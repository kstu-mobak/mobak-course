QRSTUVWXYZ&quot;\nn = int(input())\nb = int(input())\nif n == 0:\n    print(&quot;0&quot;)\nelse:\n    s = &quot;&quot;\n    while n &gt; 0:\n        s = DIGITS[n % b] + s   # новая цифра — слева\n        n = ...\n    print(s)<\/code><\/pre>"]}]}]}, {"n": 2, "title": "Неделя 2. Функции, коллекции, представление данных", "lessons": [{"title": "Функции", "steps": [{"id": "w2l1s1", "t": "text", "html": "<h3>Зачем функции<\/h3>\n<p>Функция — именованный кусок программы, который получает <b>аргументы<\/b> и возвращает <b>результат<\/b>. Она позволяет написать алгоритм один раз и проверять его отдельно.<\/p>\n<pre><code>def key_space(alphabet, length):\n    \"\"\"Сколько всего ключей длины length из алфавита размера alphabet.\"\"\"\n    return alphabet ** length\n\nprint(key_space(10, 4))   # 10000<\/code><\/pre>\n<ul>\n<li><code>return<\/code> завершает функцию и отдаёт значение. Без <code>return<\/code> функция возвращает <code>None<\/code>.<\/li>\n<li><b>Чистая функция<\/b> зависит только от аргументов и ничего не печатает. Такие функции легко тестировать: <code>assert key_space(2, 3) == 8<\/code>.<\/li>\n<li>Строка в тройных кавычках сразу после <code>def<\/code> — документация (docstring).<\/li>\n<\/ul>\n<p>С этой недели задачи на код бывают двух видов — в условии сказано, какой:<\/p>\n<ul>\n<li><b>Функция<\/b> (в заготовке есть <code>def …:<\/code> и <code>pass<\/code>). Замените <code>pass<\/code> своим кодом с <code>return<\/code>. Внутри функции не вызывайте <code>input()<\/code> и <code>print()<\/code>: проверяйте её вызовами из таблицы примеров, например <code>print(key_space(10, 4))<\/code>.<\/li>\n<li><b>Программа<\/b> (заготовки нет). Читайте данные через <code>input()<\/code>, печатайте ответ через <code>print()<\/code>, как в неделе 1.<\/li>\n<\/ul>"}, {"id": "w2l1s2", "t": "choice", "html": "<p>Что выведет программа?<\/p><pre><code>def f(x):\n    y = x * 2\n\nprint(f(5))<\/code><\/pre>", "opts": [["None", true, "Верно: без return функция возвращает None."], ["10", false, "Значение вычислено, но не возвращено."], ["5", false, "Функция не возвращает x."], ["Ошибка", false, "Ошибки нет."]]}, {"id": "w2l1s3", "t": "code", "html": "<p><b>Функция: время перебора.<\/b> Напишите функцию <code>bruteforce_years(bits, speed)<\/code>, которая возвращает целое число лет полного перебора ключей длины <code>bits<\/code> бит при скорости <code>speed<\/code> ключей в секунду (год = 365 суток, дробную часть отбросить).<\/p>\n<p>Пример: <code>bruteforce_years(56, 10**9)<\/code> → <code>2<\/code>.<\/p>\n<p>Числа бывают огромными (2<sup>128<\/sup>). Считайте только целыми операциями <code>**<\/code> и <code>//<\/code>: деление <code>/<\/code> даёт float, у него около 16 значащих цифр, и ответ получится неточным.<\/p>", "tpl": "def bruteforce_years(bits, speed):\n    # ваш код\n    pass", "calls": [["bruteforce_years(56, 1000000000)", "2", ""], ["bruteforce_years(40, 1000000000)", "0", ""], ["bruteforce_years(128, 1000000000000)", "10790283070806014188", ""], ["bruteforce_years(1, 1)", "0", ""], ["bruteforce_years(80, 1000000)", "38334786263", ""], ["bruteforce_years(25, 1)", "1", ""]], "limits": "", "hints": ["Ключей <code>2 ** bits<\/code>; секунд — <code>2 ** bits // speed<\/code>; лет — секунды, делённые нацело на число секунд в году.", "Функция ничего не читает и не печатает: она <b>возвращает<\/b> число через <code>return<\/code>. Проверка — <code>print(bruteforce_years(56, 10**9))<\/code>.", "<pre><code>def bruteforce_years(bits, speed):\n    seconds = ...\n    return seconds // (365 * 24 * 3600)<\/code><\/pre>"]}]}, {"title": "Коллекции: list, tuple, dict, set", "steps": [{"id": "w2l2s1", "t": "text", "html": "<h3>Четыре коллекции<\/h3>\n<table border=\"1\" cellpadding=\"4\">\n<tbody><tr><th>Тип<\/th><th>Пример<\/th><th>Особенность<\/th><\/tr>\n<tr><td>list<\/td><td><code>[3, 1, 2]<\/code><\/td><td>упорядочен, изменяем<\/td><\/tr>\n<tr><td>tuple<\/td><td><code>(3, 1, 2)<\/code><\/td><td>упорядочен, неизменяем; удобно вернуть несколько значений из функции<\/td><\/tr>\n<tr><td>dict<\/td><td><code>{\"aes\": 128, \"des\": 56}<\/code><\/td><td>ключ → значение; быстрый поиск по ключу<\/td><\/tr>\n<tr><td>set<\/td><td><code>{\"a\", \"b\"}<\/code><\/td><td>только уникальные элементы<\/td><\/tr>\n<\/tbody><\/table>\n<h3>Срезы<\/h3>\n<pre><code>s = \"secret\"\nprint(s[1:4])    # ecr   — с 1-го по 3-й символ\nprint(s[::-1])   # terces — задом наперёд\nprint(s[-2:])    # et    — два последних<\/code><\/pre><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 560 150\" width=\"560\" style=\"min-width:403px\" role=\"img\" aria-label=\"Индексы строки: сверху от начала, снизу от конца\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-sl\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><text x=\"101\" y=\"30\" class=\"s-tm s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"70\" y=\"38\" width=\"62\" height=\"46\" rx=\"8\" class=\"f-soft\"/><text x=\"101.0\" y=\"66.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:20px\">s<\/text><text x=\"101\" y=\"104\" class=\"s-tm s-mono\" text-anchor=\"middle\">-6<\/text><text x=\"167\" y=\"30\" class=\"s-tm s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"136\" y=\"38\" width=\"62\" height=\"46\" rx=\"8\" class=\"f-acc\"/><text x=\"167.0\" y=\"66.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:20px\">e<\/text><text x=\"167\" y=\"104\" class=\"s-tm s-mono\" text-anchor=\"middle\">-5<\/text><text x=\"233\" y=\"30\" class=\"s-tm s-mono\" text-anchor=\"middle\">2<\/text><rect x=\"202\" y=\"38\" width=\"62\" height=\"46\" rx=\"8\" class=\"f-acc\"/><text x=\"233.0\" y=\"66.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:20px\">c<\/text><text x=\"233\" y=\"104\" class=\"s-tm s-mono\" text-anchor=\"middle\">-4<\/text><text x=\"299\" y=\"30\" class=\"s-tm s-mono\" text-anchor=\"middle\">3<\/text><rect x=\"268\" y=\"38\" width=\"62\" height=\"46\" rx=\"8\" class=\"f-acc\"/><text x=\"299.0\" y=\"66.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:20px\">r<\/text><text x=\"299\" y=\"104\" class=\"s-tm s-mono\" text-anchor=\"middle\">-3<\/text><text x=\"365\" y=\"30\" class=\"s-tm s-mono\" text-anchor=\"middle\">4<\/text><rect x=\"334\" y=\"38\" width=\"62\" height=\"46\" rx=\"8\" class=\"f-soft\"/><text x=\"365.0\" y=\"66.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:20px\">e<\/text><text x=\"365\" y=\"104\" class=\"s-tm s-mono\" text-anchor=\"middle\">-2<\/text><text x=\"431\" y=\"30\" class=\"s-tm s-mono\" text-anchor=\"middle\">5<\/text><rect x=\"400\" y=\"38\" width=\"62\" height=\"46\" rx=\"8\" class=\"f-soft\"/><text x=\"431.0\" y=\"66.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:20px\">t<\/text><text x=\"431\" y=\"104\" class=\"s-tm s-mono\" text-anchor=\"middle\">-1<\/text><text x=\"40\" y=\"30\" class=\"s-tm\" text-anchor=\"end\">i:<\/text><text x=\"40\" y=\"104\" class=\"s-tm\" text-anchor=\"end\">−i:<\/text><text x=\"285\" y=\"136\" class=\"s-t s-mono\" text-anchor=\"middle\">s[1:4] = 'ecr' — с индекса 1 до 4, не включая 4;  s[-2:] = 'et'<\/text><\/svg><\/div><figcaption>Индексы строки: сверху от начала, снизу от конца<\/figcaption><\/figure>\n<h3>Подсчёт через словарь<\/h3>\n<pre><code>count = {}\nfor w in [\"a\", \"b\", \"a\"]:\n    count[w] = count.get(w, 0) + 1\nprint(count)     # {'a': 2, 'b': 1}<\/code><\/pre>\n<h3>Основные операции<\/h3>\n<pre><code>nums = [5, 3, 8]\nnums.append(1)              # [5, 3, 8, 1] — добавить в конец\nlen(nums)                   # 4 — длина\nnums[0], nums[-1]           # 5 1 — индексы с 0, -1 — последний\nmax(nums), min(nums)        # 8 1\nlen(set([\"a\", \"b\", \"a\"]))   # 2 — сколько различных\nfor key in count:           # перебор ключей словаря\n    print(key, count[key])\nmax(count.values())         # наибольшее значение в словаре\n\"abc\" &lt; \"abd\"               # True — строки сравниваются посимвольно\n\"Z\" &lt; \"a\"                   # True — по кодам символов (лексикографически)\nn = int(input())\nfor _ in range(n):          # прочитать n строк; _ — «переменная не нужна»\n    p = input()<\/code><\/pre>"}, {"id": "w2l2s2", "t": "choice", "html": "<p>Что выведет <code>print(\"secret\"[1:4], \"secret\"[::-1])<\/code>?<\/p>", "opts": [["ecr terces", true, ""], ["sec terces", false, "Индексы начинаются с 0: s[1] — это 'e'."], ["ecre terces", false, "Правая граница среза не включается."], ["ecr secret", false, "Шаг −1 разворачивает строку."]]}, {"id": "w2l2s3", "t": "code", "html": "<p><i>Программа целиком: ввод — <code>input()<\/code>, вывод — <code>print()<\/code>.<\/i><\/p>\n<p><b>Утёкшая база паролей.<\/b> В первой строке n, далее n строк — пароли. Выведите в первой строке количество <b>различных<\/b> паролей, во второй — самый частый пароль.<\/p>\n<p>Если самых частых паролей несколько, выведите <b>первый по алфавиту<\/b> (как в словаре; программисты говорят «лексикографически наименьший»). Строки в Python сравниваются обычным <code>&lt;<\/code>, а <code>min(...)<\/code> возвращает наименьшую.<\/p>\n<p>Пример ввода:<\/p>\n<pre><code>5\n123456\nqwerty\n123456\npassword\nqwerty<\/code><\/pre>\n<p>Пример вывода (123456 и qwerty встречаются по 2 раза, по алфавиту первый — 123456):<\/p>\n<pre><code>3\n123456<\/code><\/pre>\n<p>Подсказка: <code>set<\/code> для уникальных, <code>dict<\/code> для подсчёта: <code>count[p] = count.get(p, 0) + 1<\/code>.<\/p>", "io": [["5\n123456\nqwerty\n123456\npassword\nqwerty", "3\n123456"], ["4\nb\na\nb\na", "2\na"], ["6\ns3cret\nS3cret\ns3cret\n111\n111\n111", "3\n111"]], "limits": "", "hints": ["Прочитайте n, затем в цикле n паролей в список. Количество различных — <code>len(set(список))<\/code>.", "Подсчёт — словарь: <code>count[p] = count.get(p, 0) + 1<\/code> (см. «Подсчёт через словарь»). Наибольшая частота — <code>max(count.values())<\/code>.", "Среди паролей с наибольшей частотой выберите наименьший: <pre><code>best = max(count.values())\nprint(min(p for p in count if count[p] == best))<\/code><\/pre>"]}]}, {"title": "Строки и байты: Unicode, UTF-8, hex", "steps": [{"id": "w2l3s1", "t": "text", "html": "<h3>Символ → номер → байты<\/h3>\n<p>Шифры работают с байтами, а не с буквами. Путь от буквы к байтам — два шага:<\/p>\n<ol>\n<li><b>Unicode<\/b> даёт каждому символу номер (кодовую точку): «A» = 65 (U+0041), «Ж» = 1046 (U+0416), «€» = 8364 (U+20AC).<\/li>\n<li><b>UTF-8<\/b> записывает этот номер в 1–4 байта: латинские буквы без диакритики, цифры и знаки ASCII — 1 байт (совпадает с ASCII); кириллица, греческий, буквы вроде é — 2; €, китайские иероглифы и большинство прочих символов — 3; эмодзи — 4.<\/li>\n<\/ol><p style=\"text-align:center;\"><img alt=\"Буква Ж: номер 1046, его 11 бит раскладываются в два байта UTF-8 D0 96\" src=\"/media/attachments/lesson/2612704/w02_utf8.png\" style=\"height:auto;\"><\/p>\n<p>Первые биты каждого байта служебные: по ним декодер понимает, где начинается символ и сколько у него байтов. Поэтому <code>len(\"Жук\")<\/code> = 3 символа, а <code>len(\"Жук\".encode(\"utf-8\"))<\/code> = 6 байтов.<\/p>\n<p><b>Зачем это криптографии.<\/b> Если зашифровать текст, а расшифровать с другой кодировкой (cp1251 вместо utf-8), байты будут те же, а буквы — «кракозябры». В коде всегда явно пишите <code>.encode(\"utf-8\")<\/code> и <code>.decode(\"utf-8\")<\/code>.<\/p>"}, {"id": "w2l3s2", "t": "widget", "kind": "utf8", "html": ""}, {"id": "w2l3s3", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Сколько байтов займёт строка «Ключ 42» в UTF-8?<\/p>", "opts": [["11", true, "Верно: 4 кириллические буквы по 2 байта + пробел + 2 цифры по 1 байту = 8 + 1 + 2."], ["7", false, "7 — число символов. Кириллица в UTF-8 занимает 2 байта на букву."], ["14", false, "Пробел и цифры в UTF-8 занимают 1 байт, а не 2."], ["8", false, "Не забудьте пробел и две цифры."]]}, {"id": "w2l3s4", "t": "text", "html": "<h3>str и bytes — разные вещи<\/h3>\n<p><code>str<\/code> — последовательность символов Unicode. <code>bytes<\/code> — последовательность чисел 0…255. Криптография работает только с <b>байтами<\/b>: шифруются, хешируются и подписываются байты, а не «буквы».<\/p>\n<pre><code>s = \"Ж\"\nb = s.encode(\"utf-8\")    # b'\\xd0\\x96'\nprint(len(s), len(b))    # 1 2\nprint(b.hex(\" \"))        # d0 96\nprint(b.decode(\"utf-8\")) # Ж<\/code><\/pre><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 640 185\" width=\"640\" style=\"min-width:460px\" role=\"img\" aria-label=\"Строка — символы, bytes — числа 0…255. Кириллица в UTF-8 занимает 2 байта на букву\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-sb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><rect x=\"105\" y=\"18\" width=\"90\" height=\"46\" rx=\"8\" class=\"f-acc\"/><text x=\"150.0\" y=\"46.0\" class=\"s-t s-b\" text-anchor=\"middle\" style=\"font-size:24px\">Ж<\/text><line x1=\"150\" y1=\"66\" x2=\"150\" y2=\"100\" class=\"s-ln\" marker-end=\"url(#ar-sb)\"/><rect x=\"90\" y=\"104\" width=\"58\" height=\"40\" rx=\"8\" class=\"f-acc2\"/><text x=\"119.0\" y=\"129.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:17px\">D0<\/text><rect x=\"152\" y=\"104\" width=\"58\" height=\"40\" rx=\"8\" class=\"f-acc2\"/><text x=\"181.0\" y=\"129.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:17px\">96<\/text><rect x=\"275\" y=\"18\" width=\"90\" height=\"46\" rx=\"8\" class=\"f-acc\"/><text x=\"320.0\" y=\"46.0\" class=\"s-t s-b\" text-anchor=\"middle\" style=\"font-size:24px\">у<\/text><line x1=\"320\" y1=\"66\" x2=\"320\" y2=\"100\" class=\"s-ln\" marker-end=\"url(#ar-sb)\"/><rect x=\"260\" y=\"104\" width=\"58\" height=\"40\" rx=\"8\" class=\"f-acc2\"/><text x=\"289.0\" y=\"129.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:17px\">D1<\/text><rect x=\"322\" y=\"104\" width=\"58\" height=\"40\" rx=\"8\" class=\"f-acc2\"/><text x=\"351.0\" y=\"129.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:17px\">83<\/text><rect x=\"445\" y=\"18\" width=\"90\" height=\"46\" rx=\"8\" class=\"f-acc\"/><text x=\"490.0\" y=\"46.0\" class=\"s-t s-b\" text-anchor=\"middle\" style=\"font-size:24px\">к<\/text><line x1=\"490\" y1=\"66\" x2=\"490\" y2=\"100\" class=\"s-ln\" marker-end=\"url(#ar-sb)\"/><rect x=\"430\" y=\"104\" width=\"58\" height=\"40\" rx=\"8\" class=\"f-acc2\"/><text x=\"459.0\" y=\"129.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:17px\">D0<\/text><rect x=\"492\" y=\"104\" width=\"58\" height=\"40\" rx=\"8\" class=\"f-acc2\"/><text x=\"521.0\" y=\"129.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:17px\">BA<\/text><text x=\"10\" y=\"46\" class=\"s-tm s-mono\" text-anchor=\"start\">str<\/text><text x=\"10\" y=\"128\" class=\"s-tm s-mono\" text-anchor=\"start\">bytes<\/text><text x=\"350\" y=\"172\" class=\"s-t s-mono\" text-anchor=\"middle\">\"Жук\".encode(\"utf-8\") → 6 байт;  bytes.decode(\"utf-8\") → обратно 3 символа<\/text><\/svg><\/div><figcaption>Строка — символы, bytes — числа 0…255. Кириллица в UTF-8 занимает 2 байта на букву<\/figcaption><\/figure>\n<h3>Как устроен UTF-8<\/h3>\n<p>Каждый символ имеет номер — кодовую точку (например, Ж = U+0416). UTF-8 записывает её 1–4 байтами:<\/p>\n<table border=\"1\" cellpadding=\"4\">\n<tbody><tr><th>Кодовая точка<\/th><th>Байты<\/th><\/tr>\n<tr><td>U+0000 … U+007F<\/td><td><code>0xxxxxxx<\/code><\/td><\/tr>\n<tr><td>U+0080 … U+07FF<\/td><td><code>110xxxxx 10xxxxxx<\/code><\/td><\/tr>\n<tr><td>U+0800 … U+FFFF<\/td><td><code>1110xxxx 10xxxxxx 10xxxxxx<\/code><\/td><\/tr>\n<tr><td>U+10000 … U+10FFFF<\/td><td><code>11110xxx 10xxxxxx 10xxxxxx 10xxxxxx<\/code> (эмодзи, например 😀 = U+1F600)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Пример: Ж = U+0416 = 100 0001 0110 (11 бит) → 110<b>10000<\/b> 10<b>010110<\/b> = <code>D0 96<\/code>.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 520 185\" width=\"520\" style=\"min-width:374px\" role=\"img\" aria-label=\"UTF-8 вручную: биты кодовой точки раскладываются по шаблону 110xxxxx 10xxxxxx\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-u8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><text x=\"20\" y=\"26\" class=\"s-t s-b\" text-anchor=\"start\">Ж = U+0416 = 10000010110₂ (11 бит)<\/text><rect x=\"40\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"52.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"68\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"80.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"96\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"108.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"124\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"136.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"152\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"164.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"196\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"208.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"224\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"236.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"252\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"264.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"280\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"292.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"308\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"320.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"336\" y=\"40\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"348.5\" y=\"56.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"40\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-soft\"/><text x=\"52.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"68\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-soft\"/><text x=\"80.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"96\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-soft\"/><text x=\"108.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"124\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"136.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"152\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"164.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"180\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"192.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"208\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"220.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"236\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc2\"/><text x=\"248.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"288\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-soft\"/><text x=\"300.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"316\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-soft\"/><text x=\"328.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"344\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"356.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"372\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"384.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"400\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"412.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"428\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"440.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"456\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"468.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"484\" y=\"112\" width=\"25\" height=\"25\" rx=\"5\" class=\"f-acc\"/><text x=\"496.5\" y=\"128.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><line x1=\"110\" y1=\"70\" x2=\"160\" y2=\"110\" class=\"s-ln\" marker-end=\"url(#ar-u8)\"/><line x1=\"270\" y1=\"70\" x2=\"400\" y2=\"110\" class=\"s-ln\" marker-end=\"url(#ar-u8)\"/><text x=\"40\" y=\"104\" class=\"s-tm s-mono\" text-anchor=\"start\">110xxxxx<\/text><text x=\"288\" y=\"104\" class=\"s-tm s-mono\" text-anchor=\"start\">10xxxxxx<\/text><text x=\"150\" y=\"168\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:18px\">= D0<\/text><text x=\"398\" y=\"168\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:18px\">= 96<\/text><\/svg><\/div><figcaption>UTF-8 вручную: биты кодовой точки раскладываются по шаблону 110xxxxx 10xxxxxx<\/figcaption><\/figure>\n<h3>Числа и байты<\/h3>\n<pre><code>(1000).to_bytes(2, \"big\")          # b'\\x03\\xe8'\nint.from_bytes(b\"\\x03\\xe8\", \"big\")  # 1000\nbytes.fromhex(\"41 45 53\")          # b'AES'<\/code><\/pre>\n<p>Важно: одна и та же строка в разных кодировках даёт разные байты, а значит — разный шифртекст и хеш.<\/p>"}, {"id": "w2l3s5", "t": "choice", "html": "<p>Что выведет <code>print(len(\"Жук\"), len(\"Жук\".encode(\"utf-8\")))<\/code>?<\/p>", "opts": [["3 6", true, "Каждая русская буква в UTF-8 занимает 2 байта."], ["3 3", false, "В UTF-8 кириллица занимает 2 байта."], ["6 6", false, "len(str) считает символы."], ["3 9", false, "Кириллица — 2 байта, не 3."]]}, {"id": "w2l3s6", "t": "example", "html": "<h3>Разбор: UTF-8 вручную<\/h3><p>Буква «Я» = U+042F.<\/p><ol><li>Переводим hex в двоичную по 4 бита: 042F → 0000 0100 0010 1111.<\/li><li>Нужны младшие 11 бит: <code>10000101111<\/code>. Режем на 5 + 6: <code>10000<\/code> | <code>101111<\/code>.<\/li><li>Подставляем в шаблон 110xxxxx 10xxxxxx: <code>11010000<\/code> <code>10101111<\/code>.<\/li><li>Каждый байт — в hex по 4 бита: <b>D0 AF<\/b>.<\/li><\/ol><p><b>Трёхбайтный символ<\/b> «₽» = U+20BD = <code>0010000010111101<\/code> (16 бит) → режем 4 + 6 + 6: <code>11100010<\/code> <code>10000010<\/code> <code>10111101<\/code> = <b>E2 82 BD<\/b>.<\/p><p><b>Hex-дамп<\/b> слова «Key»: K = 4B, e = 65, y = 79 → <b>4B 65 79<\/b>. Заглавная A = 41, строчная a = 61, дальше по алфавиту.<\/p><p><b>Перевод делением<\/b>: 100 в систему с основанием 3.<\/p><table><tr><th>Деление<\/th><th>Частное<\/th><th>Остаток<\/th><\/tr><tr><td>100 : 3<\/td><td>33<\/td><td>1<\/td><\/tr><tr><td>33 : 3<\/td><td>11<\/td><td>0<\/td><\/tr><tr><td>11 : 3<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>3 : 3<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>1 : 3<\/td><td>0<\/td><td>1<\/td><\/tr><\/table><p>Остатки в порядке получения: 1 0 2 0 1; запись числа — снизу вверх: <b>10201<\/b>.<\/p>"}, {"id": "w2l3s7", "t": "dataset", "html": "<p><b>UTF-8 вручную.<\/b> Во входных данных кодовая точка русской буквы, например <code>U+0416<\/code>. Запишите её байты в UTF-8 в hex через пробел, например <code>D0 96<\/code>.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["U+0445", "D1 85"], ["U+0442", "D1 82"], ["U+042E", "D0 AE"]]}, {"id": "w2l3s8", "t": "dataset", "html": "<p><b>Hex-дамп.<\/b> Во входных данных короткое английское слово. Запишите его байты в ASCII в hex через пробел. Например, <code>AES<\/code> → <code>41 45 53<\/code>.<\/p><p>Подсказка: 'A' = 0x41, 'a' = 0x61, буквы идут подряд: A–O = 41–4F, P–Z = 50–5A; a–o = 61–6F, p–z = 70–7A.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["Bob", "42 6F 62"], ["cipher", "63 69 70 68 65 72"], ["XOR", "58 4F 52"]]}, {"id": "w2l3s9", "t": "dataset", "html": "<p><b>Перевод делением.<\/b> Во входных данных два числа: n и основание b. Переведите n в систему с основанием b последовательным делением на b.<\/p>\n<p>Запишите остатки <b>в порядке получения<\/b> (от первого деления к последнему), затем «;» и итоговую запись числа. Пример для n = 11, b = 2: <code>1 1 0 1; 1011<\/code><\/p>\n<pre><code>11 : 2 = 5, остаток 1\n 5 : 2 = 2, остаток 1\n 2 : 2 = 1, остаток 0\n 1 : 2 = 0, остаток 1   → стоп: частное 0\nОстатки в порядке получения: 1 1 0 1; запись — снизу вверх: 1011<\/code><\/pre><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["528 3", "0 2 1 1 0 2; 201120"], ["503 7", "6 1 3 1; 1316"], ["346 8", "2 3 5; 532"]]}, {"id": "w2l3s10", "t": "dataset", "html": "<p><b>⭐ Трёхбайтный UTF-8.<\/b> Во входных данных кодовая точка символа из диапазона U+0800…U+FFFF (например, € = U+20AC). Запишите её байты в UTF-8 в hex через пробел. Шаблон: <code>1110xxxx 10xxxxxx 10xxxxxx<\/code>. Пример: U+20AC → <code>E2 82 AC<\/code>.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["U+2264", "E2 89 A4"], ["U+2605", "E2 98 85"], ["U+2260", "E2 89 A0"]]}]}, {"title": "ЛР-1. Представление данных", "steps": [{"id": "w2l4s1", "t": "text", "html": "<h3>Лабораторная работа 1<\/h3>\n<p>Четыре функции для работы с числами и байтами. К каждой даны примеры с правильными ответами. Пишите <b>только функцию<\/b>: <code>input()<\/code> и <code>print()<\/code> внутри неё не нужны — проверяйте её вызовами из таблицы примеров. Встроенные <code>bin<\/code>, <code>hex<\/code>, <code>format<\/code>, <code>bytes.hex<\/code>, <code>bytes.fromhex<\/code> использовать нельзя — цель работы в том, чтобы реализовать алгоритм самостоятельно. Любое решение может быть проверено устно.<\/p>"}, {"id": "w2l4s2", "t": "text", "html": "<h3>Python для ЛР-1<\/h3>\n<p>Приёмы, которые понадобятся в функциях ниже (решения здесь нет):<\/p>\n<pre><code>data = b\"Hi\"\nfor x in data:                   # элементы bytes — целые числа 0…255\n    print(x)                     # 72, затем 105\ndata[0]                          # 72\n\"0123456789ABCDEF\"[11]           # 'B' — символ номер 11 (с 0)\n\"0123456789abcdef\".index(\"b\")    # 11 — номер символа в строке\n\"AB\" + \"CD\"                      # 'ABCD' — склейка строк\n\" \".join([\"41\", \"45\"])           # '41 45' — склеить список строк через пробел\n\"48 69\".split()                  # ['48', '69'] — разрезать по пробелам\n\"Ab\".lower()                     # 'ab'\nbytes([72, 105])                 # b'Hi' — байты из списка чисел 0…255<\/code><\/pre>\n<p>Строку удобно собирать так: сначала список кусков (<code>parts.append(...)<\/code>), в конце — <code>\" \".join(parts)<\/code>.<\/p>"}, {"id": "w2l4s3", "t": "code", "html": "<p><b>ЛР-1.1. Перевод в любую систему.<\/b> Напишите функцию <code>to_base(n, b)<\/code>: n ≥ 0, 2 ≤ b ≤ 36. Верните строку — запись n в системе с основанием b; цифры больше 9 — заглавные A–Z.<\/p>\n<p>Примеры: <code>to_base(255, 16)<\/code> → <code>\"FF\"<\/code>, <code>to_base(0, 2)<\/code> → <code>\"0\"<\/code>.<\/p>", "tpl": "def to_base(n, b):\n    digits = \"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\n    # ваш код\n    pass", "calls": [["to_base(255, 16)", "'FF'", ""], ["to_base(0, 2)", "'0'", ""], ["to_base(35, 36)", "'Z'", ""], ["to_base(36, 36)", "'10'", ""], ["to_base(1, 2)", "'1'", ""], ["to_base(65535, 2)", "'1111111111111111'", ""], ["to_base(123456789, 36)", "'21I3V9'", ""]], "limits": "", "hints": ["Делите n на b и собирайте остатки — это цифры числа справа налево (как в «Разборе» перевода делением).", "Цифры — из строки <code>\"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ\"<\/code>. Новую цифру добавляйте <b>слева<\/b> к результату. n = 0 → <code>\"0\"<\/code>.", "<pre><code>def to_base(n, b):\n    DIGITS = &quot;0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ&quot;\n    if n == 0:\n        return &quot;0&quot;\n    s = &quot;&quot;\n    while n &gt; 0:\n        ...\n    return s<\/code><\/pre>"]}, {"id": "w2l4s4", "t": "code", "html": "<p><b>ЛР-1.2. Байты → hex.<\/b> Напишите функцию <code>bytes_to_hex(data)<\/code>: принимает <code>bytes<\/code>, возвращает строку из hex-пар заглавными буквами через пробел. Пустые байты → пустая строка.<\/p>\n<p>Пример: <code>bytes_to_hex(b\"AES\")<\/code> → <code>\"41 45 53\"<\/code>. Без <code>.hex()<\/code> и <code>format<\/code>: переводите каждый байт делением на 16 (старшая цифра — <code>x // 16<\/code>, младшая — <code>x % 16<\/code>). Каждый байт — ровно две цифры: 5 → <code>05<\/code>, 255 → <code>FF<\/code>.<\/p>", "tpl": "def bytes_to_hex(data):\n    # ваш код\n    pass", "calls": [["bytes_to_hex(b'AES')", "'41 45 53'", ""], ["bytes_to_hex(b'A')", "'41'", ""], ["bytes_to_hex(b'Hello, World!')", "'48 65 6C 6C 6F 2C 20 57 6F 72 6C 64 21'", ""], ["bytes_to_hex(b'\\xd0\\x96\\xd1\\x83\\xd0\\xba')", "'D0 96 D1 83 D0 BA'", ""], ["bytes_to_hex(b'')", "''", ""], ["bytes_to_hex(b'~ 0')", "'7E 20 30'", ""], ["bytes_to_hex(b'a\\tb')", "'61 09 62'", ""]], "limits": "", "hints": ["Перебирайте байты: <code>for x in data<\/code> — каждый x уже число 0…255.", "Байт → две hex-цифры: старшая <code>x // 16<\/code>, младшая <code>x % 16<\/code>, символы — из <code>\"0123456789ABCDEF\"<\/code>. Пары соедините: <code>\" \".join(pairs)<\/code>. Для пустых байтов join сам даст пустую строку.", "<pre><code>def bytes_to_hex(data):\n    H = &quot;0123456789ABCDEF&quot;\n    pairs = []\n    for x in data:\n        pairs.append(H[...] + H[...])\n    return &quot; &quot;.join(pairs)<\/code><\/pre>"]}, {"id": "w2l4s5", "t": "code", "html": "<p><b>ЛР-1.3. Hex → байты.<\/b> Напишите функцию <code>hex_to_bytes(s)<\/code>: строка из hex-пар через пробел (буквы любого регистра) → <code>bytes<\/code>. Без <code>bytes.fromhex<\/code> и <code>int(..., 16)<\/code>.<\/p>\n<p>Пример: <code>hex_to_bytes(\"48 69\")<\/code> → <code>b\"Hi\"<\/code>. Проверить удобно так: <code>print(hex_to_bytes(\"48 69\").decode(\"utf-8\"))<\/code> напечатает <code>Hi<\/code>.<\/p>", "tpl": "def hex_to_bytes(s):\n    # ваш код\n    pass", "calls": [["hex_to_bytes('48 69')", "b'Hi'", ""], ["hex_to_bytes('48 65 6C 6C 6F')", "b'Hello'", ""], ["hex_to_bytes('41 45 53 2D 31 32 38')", "b'AES-128'", ""], ["hex_to_bytes('D0 9F D1 80 D0 B8 D0 B2 D0 B5 D1 82')", "b'\\xd0\\x9f\\xd1\\x80\\xd0\\xb8\\xd0\\xb2\\xd0\\xb5\\xd1\\x82'", ""], ["hex_to_bytes('7A')", "b'z'", ""], ["hex_to_bytes('6b 65 79')", "b'key'", ""]], "limits": "", "hints": ["<code>s.split()<\/code> даёт список пар вроде <code>['48', '69']<\/code>. Каждую пару переведите в число 0…255 вручную.", "Значение hex-цифры: <code>\"0123456789abcdef\".index(ch.lower())<\/code>. Байт = старшая·16 + младшая. Соберите список чисел и верните <code>bytes(список)<\/code>.", "<pre><code>def hex_to_bytes(s):\n    H = &quot;0123456789abcdef&quot;\n    out = []\n    for pair in s.split():\n        hi = H.index(pair[0].lower())\n        lo = ...\n        out.append(...)\n    return bytes(out)<\/code><\/pre>"]}, {"id": "w2l4s6", "t": "code", "html": "<p><b>ЛР-1.4. Сколько единичных бит.<\/b> Напишите функцию <code>count_ones(data)<\/code>: принимает <code>bytes<\/code>, возвращает общее число бит, равных 1, во всех байтах. Без <code>bin<\/code> и <code>bit_count<\/code>: используйте <code>%<\/code> и <code>//<\/code>.<\/p>\n<p>Пример: <code>count_ones(b\"A\")<\/code> → 2 (0x41 = 0100 0001).<\/p>", "tpl": "def count_ones(data):\n    # ваш код\n    pass", "calls": [["count_ones(b'A')", "2", ""], ["count_ones(b'AES')", "9", ""], ["count_ones(b'')", "0", ""], ["count_ones(b'~~~~')", "24", ""], ["count_ones(b'\\xd0\\x96\\xd1\\x83\\xd0\\xba')", "22", ""], ["count_ones(b'The quick brown fox')", "73", ""]], "limits": "", "hints": ["Посчитайте единичные биты в каждом байте и сложите.", "Для одного байта x: пока <code>x &gt; 0<\/code> — прибавляйте последний бит <code>x % 2<\/code> к счётчику и делайте <code>x //= 2<\/code>.", "<pre><code>def count_ones(data):\n    total = 0\n    for x in data:\n        while x &gt; 0:\n            ...\n            ...\n    return total<\/code><\/pre>"]}]}]}, {"n": 3, "title": "Неделя 3. Делимость, НОД, алгоритм Евклида", "lessons": [{"title": "Делимость, НОД, алгоритм Евклида", "steps": [{"id": "w3l1s1", "t": "text", "html": "<h3>Деление с остатком на картинке<\/h3>\n<p>Разделить a на b с остатком — значит уложить как можно больше целых «блоков» длины b и посмотреть, сколько осталось:<\/p>\n<p style=\"text-align:center;\"><b>a = b·q + r,  0 ≤ r &lt; b<\/b><\/p><p style=\"text-align:center;\"><img alt=\"17 = 5·3 + 2 и −17 = 5·(−4) + 3 на числовой прямой\" src=\"/media/attachments/lesson/2612706/w03_divmod_line.png\" style=\"height:auto;\"><\/p>\n<p>q — сколько блоков, r — сколько осталось. Остаток всегда считается <b>вправо<\/b> от ближайшего кратного b, которое не больше a. Для −17 это −20, поэтому r = 3, а не −2.<\/p>\n<p>Python делает так же: <code>-17 // 5 == -4<\/code>, <code>-17 % 5 == 3<\/code>. В C и Java остаток был бы −2: это частая ошибка при переносе алгоритмов.<\/p>\n<p>Дальше в курсе почти все вычисления — «по модулю», то есть с остатком. Это и есть деление с остатком, применённое много раз.<\/p>"}, {"id": "w3l1s2", "t": "widget", "kind": "euclid", "html": ""}, {"id": "w3l1s3", "t": "text", "html": "<h3>Алгоритм Евклида: нарезаем квадраты<\/h3>\n<p>Возьмите прямоугольник a×b и отрезайте от него самые большие квадраты, пока можно. От остатка снова отрезайте квадраты и так далее. Сторона последнего квадрата, который замостит остаток без зазоров, — это НОД(a, b).<\/p><p style=\"text-align:center;\"><img alt=\"Прямоугольник 42×18 режется на квадраты 18×18, 18×18 и 6×6\" src=\"/media/attachments/lesson/2612706/w03_euclid_squares.png\" style=\"height:auto;\"><\/p>\n<p><b>Почему это работает.<\/b> Пусть плитка d×d ровно укладывается и вдоль стороны a, и вдоль стороны b: d — общий делитель. Тогда она ровно укладывается и в остаток r = a − q·b: из длины, кратной d, вычли длину, кратную d. И наоборот, общий делитель b и r делит a = q·b + r. Значит, у пар (a, b) и (b, r) одни и те же общие делители, и <b>НОД(a, b) = НОД(b, a mod b)<\/b> (a mod b — остаток r, в Python <code>a % b<\/code>).<\/p>\n<p>Каждая строка «42 = 2·18 + 6» — один шаг алгоритма: частное q — сколько квадратов отрезали, остаток r — ширина полосы, которая осталась. Когда остаток стал 0, ответ — последний ненулевой остаток.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 449 196\" width=\"449\" style=\"min-width:323px\" role=\"img\" aria-label=\"Евклид геометрически: от прямоугольника отрезаем квадраты, пока не замостим его целиком. Сторона последнего квадрата — НОД\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-eu\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><rect x=\"10\" y=\"10\" width=\"429\" height=\"156\" rx=\"2\" class=\"f-soft\"/><rect x=\"10\" y=\"10\" width=\"156\" height=\"156\" style=\"fill:#6366f1;fill-opacity:.28;stroke:#6366f1\" /><text x=\"88.0\" y=\"93.0\" class=\"s-t s-mono\" text-anchor=\"middle\" style=\"font-size:14px\">12×12<\/text><rect x=\"166\" y=\"10\" width=\"156\" height=\"156\" style=\"fill:#6366f1;fill-opacity:.28;stroke:#6366f1\" /><text x=\"244.0\" y=\"93.0\" class=\"s-t s-mono\" text-anchor=\"middle\" style=\"font-size:14px\">12×12<\/text><rect x=\"322\" y=\"10\" width=\"117\" height=\"117\" style=\"fill:#0ea5e9;fill-opacity:.28;stroke:#0ea5e9\" /><text x=\"380.5\" y=\"73.5\" class=\"s-t s-mono\" text-anchor=\"middle\" style=\"font-size:14px\">9×9<\/text><rect x=\"322\" y=\"127\" width=\"39\" height=\"39\" style=\"fill:#f59e0b;fill-opacity:.28;stroke:#f59e0b\" /><text x=\"341.5\" y=\"151.5\" class=\"s-t s-mono\" text-anchor=\"middle\" style=\"font-size:13.0px\">3×3<\/text><rect x=\"361\" y=\"127\" width=\"39\" height=\"39\" style=\"fill:#f59e0b;fill-opacity:.28;stroke:#f59e0b\" /><text x=\"380.5\" y=\"151.5\" class=\"s-t s-mono\" text-anchor=\"middle\" style=\"font-size:13.0px\">3×3<\/text><rect x=\"400\" y=\"127\" width=\"39\" height=\"39\" style=\"fill:#f59e0b;fill-opacity:.28;stroke:#f59e0b\" /><text x=\"419.5\" y=\"151.5\" class=\"s-t s-mono\" text-anchor=\"middle\" style=\"font-size:13.0px\">3×3<\/text><text x=\"224.5\" y=\"192\" class=\"s-t s-b\" text-anchor=\"middle\">33×12: частные 2 1 3, НОД = 3<\/text><\/svg><\/div><figcaption>Евклид геометрически: от прямоугольника отрезаем квадраты, пока не замостим его целиком. Сторона последнего квадрата — НОД<\/figcaption><\/figure>"}, {"id": "w3l1s4", "t": "text", "html": "<h3>Разбор по шагам: расширенный алгоритм Евклида таблицей<\/h3>\n<p>Нужно найти x и y, для которых 240·x + 46·y = НОД(240, 46). Обратная подстановка путается в знаках, поэтому удобнее вести таблицу. Для каждой строки выполняется <b>r = 240·x + 46·y<\/b>.<\/p>\n<table style=\"text-align:right;\">\n<tbody><tr style=\"background:#EEF2F6;\"><th style=\"padding:4px 10px;\">r<\/th><th style=\"padding:4px 10px;\">q<\/th><th style=\"padding:4px 10px;\">x<\/th><th style=\"padding:4px 10px;\">y<\/th><th style=\"padding:4px 10px;\">проверка 240·x + 46·y<\/th><\/tr>\n<tr><td style=\"padding:4px 10px;\">240<\/td><td style=\"padding:4px 10px;\">—<\/td><td style=\"padding:4px 10px;\">1<\/td><td style=\"padding:4px 10px;\">0<\/td><td style=\"padding:4px 10px;\">240<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">46<\/td><td style=\"padding:4px 10px;\">—<\/td><td style=\"padding:4px 10px;\">0<\/td><td style=\"padding:4px 10px;\">1<\/td><td style=\"padding:4px 10px;\">46<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">10<\/td><td style=\"padding:4px 10px;\">5<\/td><td style=\"padding:4px 10px;\">1<\/td><td style=\"padding:4px 10px;\">−5<\/td><td style=\"padding:4px 10px;\">240 − 230 = 10<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">6<\/td><td style=\"padding:4px 10px;\">4<\/td><td style=\"padding:4px 10px;\">−4<\/td><td style=\"padding:4px 10px;\">21<\/td><td style=\"padding:4px 10px;\">−960 + 966 = 6<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">4<\/td><td style=\"padding:4px 10px;\">1<\/td><td style=\"padding:4px 10px;\">5<\/td><td style=\"padding:4px 10px;\">−26<\/td><td style=\"padding:4px 10px;\">1200 − 1196 = 4<\/td><\/tr>\n<tr style=\"background:#FDF1DC;\"><td style=\"padding:4px 10px;\"><b>2<\/b><\/td><td style=\"padding:4px 10px;\">1<\/td><td style=\"padding:4px 10px;\"><b>−9<\/b><\/td><td style=\"padding:4px 10px;\"><b>47<\/b><\/td><td style=\"padding:4px 10px;\">−2160 + 2162 = 2<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">0<\/td><td style=\"padding:4px 10px;\">2<\/td><td colspan=\"3\" style=\"padding:4px 10px;\">стоп: остаток 0<\/td><\/tr>\n<\/tbody><\/table>\n<p><b>Правило одной строки.<\/b> q — частное от деления r из строки «две выше» на r из строки «выше». Новая строка = «строка две выше» − q × «строка выше», одинаково для r, x и y. Пример для строки r = 6: q = 46 // 10 = 4, x = 0 − 4·1 = −4, y = 1 − 4·(−5) = 21.<\/p>\n<p>Ответ берётся из строки с последним ненулевым остатком: НОД = 2, x = −9, y = 47. Последний столбец — самопроверка: если он не совпал с r, ошибка в этой строке.<\/p>\n<p>Ровно так работает функция <code>egcd<\/code> в ЛР-2.2: в цикле хранятся две последние строки таблицы.<\/p>"}, {"id": "w3l1s5", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Прямоугольник 30×12 режут на самые большие квадраты, как на картинке. Что получится?<\/p>", "opts": [["Два квадрата 12×12, затем два квадрата 6×6. НОД(30, 12) = 6", true, "Верно: 30 = 2·12 + 6, 12 = 2·6 + 0."], ["Два квадрата 12×12 и полоса 6×12, которую дальше не режут. НОД = 12", false, "Полосу 6×12 тоже режут на квадраты: 12 = 2·6 + 0. Ответ — сторона последнего квадрата."], ["Три квадрата 10×10. НОД = 10", false, "Квадраты режут со стороной меньшей стороны прямоугольника, то есть 12."], ["Два квадрата 12×12, затем шесть квадратов 1×1. НОД = 1", false, "Полоса 6×12 режется на два квадрата 6×6, без остатка."]]}, {"id": "w3l1s6", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Таблица расширенного алгоритма Евклида для 35 и 15 начинается так же, как в разборе: строки (r, x, y) = (35, 1, 0) и (15, 0, 1). Какие x, y будут в строке с r = 5?<\/p>", "opts": [["x = 1, y = −2", true, "Верно: q = 35 // 15 = 2, (1, 0) − 2·(0, 1) = (1, −2); 35·1 + 15·(−2) = 5."], ["x = −2, y = 1", false, "Проверьте: 35·(−2) + 15·1 = −55, а не 5."], ["x = 1, y = 2", false, "Строку вычитают: 0 − 2·1 = −2."], ["x = 2, y = −1", false, "Проверьте: 35·2 + 15·(−1) = 55."]]}, {"id": "w3l1s7", "t": "text", "html": "<h3>Частые ошибки<\/h3>\n<ul>\n<li><b>Берут последний остаток, а не последний ненулевой.<\/b> Последний остаток всегда 0. НОД — остаток на шаг раньше.<\/li>\n<li><b>Путают знаки в обратной подстановке.<\/b> Ведите таблицу и проверяйте каждую строку: 240·x + 46·y должно совпасть с r.<\/li>\n<li><b>Думают, что x и y единственны.<\/b> Если (x, y) подходит, подходит и (x + 46/2, y − 240/2) = (14, −73). Автопроверка принимает любую верную пару.<\/li>\n<li><b>Отрицательные числа.<\/b> НОД всегда неотрицателен: НОД(12, −18) = 6. Остаток от деления на положительное b в Python неотрицателен.<\/li>\n<\/ul>\n<p><b>Зачем это в криптографии.<\/b> Расширенный алгоритм Евклида находит обратный элемент по модулю (неделя 4). На нём держатся аффинный шифр, ключ d в RSA (неделя 12) и деление на эллиптических кривых (неделя 13). Ниже — краткий конспект темы.<\/p>"}, {"id": "w3l1s8", "t": "text", "html": "<h3>Деление с остатком<\/h3>\n<p>Для целых a и b &gt; 0 существуют единственные q и r: <b>a = b·q + r, 0 ≤ r &lt; b<\/b>. В Python это <code>a // b<\/code> и <code>a % b<\/code> — и для отрицательных a тоже: <code>-17 // 5 = -4<\/code>, <code>-17 % 5 = 3<\/code>, потому что −17 = 5·(−4) + 3.<\/p>\n<h3>НОД и алгоритм Евклида<\/h3>\n<p>НОД(a, b) — наибольшее число, на которое делятся и a, и b. Ключевой факт: <b>НОД(a, b) = НОД(b, a mod b)<\/b> (a mod b — остаток от деления a на b, в Python <code>a % b<\/code>) — любой общий делитель a и b делит и остаток r = a − b·q, и наоборот.<\/p>\n<pre><code>240 = 46·5 + 10\n 46 = 10·4 + 6\n 10 =  6·1 + 4\n  6 =  4·1 + 2\n  4 =  2·2 + 0   → НОД(240, 46) = 2 (последний ненулевой остаток)<\/code><\/pre>\n<p>Алгоритм завершается: остатки строго убывают и остаются неотрицательными.<\/p>\n<h3>Сложность<\/h3>\n<p>Каждые два шага остаток уменьшается как минимум вдвое. Поэтому делений не больше примерно 2·log₂ b, где b — меньшее число, а log₂ b ≈ число двоичных разрядов b. Так пишут: <b>O(log b)<\/b> — «растёт не быстрее log b, с точностью до постоянного множителя».<\/p>\n<p>Для 2048-битных чисел это меньше 3000 делений: мгновенно. Перебор всех делителей потребовал бы порядка 2<sup>2048<\/sup> шагов. Худший случай — соседние числа Фибоначчи: для (89, 55) нужно 9 делений.<\/p>\n<h3>Расширенный алгоритм Евклида и соотношение Безу<\/h3>\n<p>Существуют целые x, y: <b>a·x + b·y = НОД(a, b)<\/b>. Их находят обратной подстановкой или сразу, храня коэффициенты по ходу алгоритма. Для примера выше: 240·(−9) + 46·47 = 2. Пара (x, y) не единственна: (x + b/g, y − a/g) тоже подходит.<\/p>\n<p>Числа a и b <b>взаимно просты<\/b>, если НОД(a, b) = 1. Тогда a·x + b·y = 1, и a·x даёт остаток 1 при делении на b (запись a·x ≡ 1 (mod b) — на следующей неделе) — это даст обратный элемент на следующей неделе и ключ d в RSA.<\/p>"}, {"id": "w3l1s9", "t": "choice", "html": "<p>Почему алгоритм Евклида всегда завершается?<\/p>", "opts": [["Остатки строго убывают и не бывают отрицательными", true, ""], ["Потому что a и b конечны", false, "Этого недостаточно: нужно убывание остатков."], ["Потому что НОД всегда равен 1", false, "НОД бывает любым."], ["Он завершается только для простых чисел", false, "Для любых целых."]]}, {"id": "w3l1s10", "t": "choice", "html": "<p>Что выведет <code>print(-17 // 5, -17 % 5)<\/code>?<\/p>", "opts": [["-4 3", true, "−17 = 5·(−4) + 3, остаток 0 ≤ r &lt; 5."], ["-3 -2", false, "Так делит C/Java, но не Python."], ["-3 2", false, "Проверьте: 5·(−3) + 2 = −13."], ["-4 -3", false, "Остаток в Python неотрицателен при b &gt; 0."]]}]}, {"title": "Ручные задачи: Евклид и Безу", "steps": [{"id": "w3l2s1", "t": "example", "html": "<h3>Разбор: алгоритм Евклида<\/h3><p>Данные: <code>1071 462<\/code>.<\/p><table><tr><th>Шаг<\/th><th>Частное q<\/th><th>Остаток r<\/th><\/tr><tr><td>1071 = 2 · 462 + 147<\/td><td>2<\/td><td>147<\/td><\/tr><tr><td>462 = 3 · 147 + 21<\/td><td>3<\/td><td>21<\/td><\/tr><tr><td>147 = 7 · 21 + 0<\/td><td>7<\/td><td>0<\/td><\/tr><\/table><p>Частные: 2 3 7; последний ненулевой остаток — НОД = 21.<\/p><p class=\"ans\">Ответ в формате задачи: <code>2 3 7; 21<\/code><\/p><h3>Разбор: соотношение Безу табличным методом<\/h3><p>Данные: <code>240 46<\/code>. Ведём таблицу, где в каждой строке <b>r = 240·x + 46·y<\/b>. Первые две строки очевидны: 240 = 240·1 + 46·0 и 46 = 240·0 + 46·1. Каждая следующая строка = строка через одну − q · предыдущая (для r, x и y одинаково), где q = (r через одну) // (r предыдущей).<\/p><table><tr><th>r<\/th><th>q<\/th><th>x<\/th><th>y<\/th><\/tr><tr><td>240<\/td><td><\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>46<\/td><td><\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>10<\/td><td>5<\/td><td>1<\/td><td>-5<\/td><\/tr><tr><td>6<\/td><td>4<\/td><td>-4<\/td><td>21<\/td><\/tr><tr><td>4<\/td><td>1<\/td><td>5<\/td><td>-26<\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>-9<\/td><td>47<\/td><\/tr><tr><td>0<\/td><td>2<\/td><td>23<\/td><td>-120<\/td><\/tr><\/table><p>Последний ненулевой r = 2 — это НОД, а x, y в его строке — ответ: 240·(-9) + 46·47 = 2.<\/p><p class=\"ans\">Ответ в формате задачи: <code>-9 47<\/code><\/p><h3>Разбор: деление с остатком для отрицательных<\/h3><p>Данные: <code>-23 5<\/code>. Остаток должен быть 0 ≤ r &lt; 5, поэтому частное округляем <b>вниз<\/b>: -23/5 = -4.6 → q = -5. Тогда r = -23 − 5·(-5) = 2.<\/p><p class=\"ans\">Ответ в формате задачи: <code>-5 2<\/code><\/p>"}, {"id": "w3l2s2", "t": "dataset", "html": "<p><b>Алгоритм Евклида.<\/b> Во входных данных числа a и b. Найдите НОД(a, b) алгоритмом Евклида. Запишите все частные по шагам через пробел, затем «;» и НОД. Пример: <code>5 4 1 1 2; 2<\/code><\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["595 259", "2 3 2 1 3; 7"], ["448 189", "2 2 1 2 3; 7"], ["708 384", "1 1 5 2 2; 12"]]}, {"id": "w3l2s3", "t": "dataset", "html": "<p><b>Соотношение Безу.<\/b> Во входных данных числа a и b. Найдите целые x и y, для которых a·x + b·y = НОД(a, b). Формат ответа: <code>x y<\/code>. Подходит любая верная пара.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["356 27", "11 -145"], ["301 93", "-38 123"], ["223 75", "37 -110"]]}, {"id": "w3l2s4", "t": "dataset", "html": "<p><b>Деление с остатком для отрицательных.<\/b> Во входных данных a (отрицательное) и b &gt; 0. Найдите q и r: a = b·q + r, 0 ≤ r &lt; b. Формат ответа: <code>q r<\/code><\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["-528 7", "-76 4"], ["-503 7", "-72 1"], ["-346 6", "-58 2"]]}]}, {"title": "Python: кортежи, assert, comprehensions", "steps": [{"id": "w3l3s1", "t": "text", "html": "<h3>Вернуть несколько значений — кортеж<\/h3>\n<pre><code>def divmod_pos(a, b):\n    return a // b, a % b      # кортеж (q, r)\n\nq, r = divmod_pos(17, 5)       # распаковка<\/code><\/pre>\n<h3>Одновременное присваивание<\/h3>\n<pre><code>a, b = b, a % b<\/code><\/pre>\n<p>Сначала вычисляется вся правая часть (из <b>старых<\/b> a и b), потом обе переменные получают новые значения. Две строки <code>a = b<\/code> и <code>b = a % b<\/code> — ошибка: во второй строке a уже новое, и b всегда становится 0 (такой «НОД(240, 46)» вернёт 46).<\/p>\n<h3>Число как условие<\/h3>\n<p><code>while b:<\/code> — то же, что <code>while b != 0:<\/code>. Ноль, пустая строка и пустой список считаются ложью, всё остальное — истиной.<\/p>\n<h3>assert — первые тесты<\/h3>\n<pre><code>assert divmod_pos(17, 5) == (3, 2)\nassert divmod_pos(-17, 5) == (-4, 3)<\/code><\/pre>\n<p>Если условие ложно — программа остановится с ошибкой. Пишите assert для обычных, граничных и «хитрых» случаев.<\/p>\n<h3>Списковые включения (list comprehension)<\/h3>\n<pre><code>squares = [x * x for x in range(5)]            # [0, 1, 4, 9, 16]\nevens = [x for x in range(10) if x % 2 == 0]   # [0, 2, 4, 6, 8]\ntable = {x: x % 7 for x in range(10)}          # словарь<\/code><\/pre>\n<h3>Таблица трассировки<\/h3>\n<p>Чтобы понять цикл, выписывайте значения переменных после каждой итерации — это ваша «ручная отладка».<\/p>"}, {"id": "w3l3s2", "t": "parsons", "html": "<p>Соберите функцию НОД по алгоритму Евклида. Расставьте строки и отступы.<\/p><p><i>Порядок строк — стрелки ↑ ↓, отступ — стрелки ⇥ ⇤. Тело функции сдвинуто на один уровень, тело цикла — на два.<\/i><\/p>", "lines": [[0, "def gcd(a, b):"], [1, "while b != 0:"], [2, "a, b = b, a % b"], [1, "return a"]]}, {"id": "w3l3s3", "t": "code", "html": "<p><b>Взаимно простые.<\/b> <i>Программа целиком.<\/i> Прочитайте n ≥ 1 через <code>input()<\/code> и выведите через пробел все k от 1 до n, для которых НОД(k, n) = 1. Используйте генератор списка.<\/p>\n<p>Здесь можно готовую функцию: строка <code>from math import gcd<\/code> в начале программы подключает <code>gcd<\/code> из стандартного модуля <code>math<\/code>. Вывести список через пробел: <code>print(*nums)<\/code> — звёздочка передаёт элементы в print по одному.<\/p>\n<p>Пример: n = 10 → <code>1 3 7 9<\/code>.<\/p>", "io": [["10", "1 3 7 9"], ["1", "1"], ["2", "1"]], "limits": "", "hints": ["Перебирайте k от 1 до n и оставляйте те, у которых <code>math.gcd(k, n) == 1<\/code> (здесь gcd разрешён).", "Генератор списка: <code>[k for k in range(1, n + 1) if ...]<\/code>. Вывод через пробел: <code>print(*список)<\/code>.", "<pre><code>import math\nn = int(input())\nres = [k for k in range(1, n + 1) if ...]\nprint(*res)<\/code><\/pre>"]}]}, {"title": "Python: строки — методы и срезы", "steps": [{"id": "w3l4s1", "t": "text", "html": "<h3>Индексы и срезы<\/h3>\n<p>Строка — последовательность символов. Индексы начинаются с 0, отрицательные считаются с конца.<\/p>\n<pre><code>s = \"КРИПТОГРАФИЯ\"\ns[0]        # 'К'\ns[-1]       # 'Я'   — последний символ\ns[2:5]      # 'ИПТ' — с 2-го по 4-й (правая граница не входит)\ns[:5]       # 'КРИПТ' — первые 5\ns[5:]       # 'ОГРАФИЯ' — всё, начиная с 5-го\ns[-3:]      # 'ФИЯ' — три последних\ns[::2]      # 'КИТГАИ' — каждый второй\ns[1::3]     # 'РТРИ' — каждый третий, начиная с 1-го\ns[::-1]     # 'ЯИФАРГОТПИРК' — задом наперёд<\/code><\/pre>\n<p>Срез <code>s[a:b:k]<\/code> не падает с ошибкой, если границы выходят за строку: <code>\"abc\"[1:100] == \"bc\"<\/code>. А вот <code>s[100]<\/code> даст <code>IndexError<\/code>.<\/p>\n<p>Строки <b>неизменяемы<\/b>: <code>s[0] = \"Х\"<\/code> — ошибка. Методы, которые «меняют» строку (<code>upper<\/code>, <code>lower<\/code>, <code>strip<\/code>, <code>replace<\/code>), возвращают <b>новую<\/b> строку, старая не меняется: пишите <code>s = s.upper()<\/code>.<\/p>\n<h3>Нужные методы<\/h3>\n<pre><code>t = \"  Привет, Мир!  \"\nt.strip()               # 'Привет, Мир!' — убрать пробелы по краям\n\"..да!\".strip(\".!\")     # 'да' — убрать указанные символы по краям\nt.lower(), t.upper()    # нижний / верхний регистр\nt.replace(\"Мир\", \"Боб\") # заменить подстроку\n\"a,b,,c\".split(\",\")     # ['a', 'b', '', 'c'] — разрезать по разделителю\n\"ключ  и   шифр\".split() # ['ключ', 'и', 'шифр'] — по любым пробелам\n\"-\".join([\"ab\", \"cd\"])  # 'ab-cd' — склеить список строк\n\"шифр\".find(\"ф\")        # 2 (или -1, если нет)\n\"abc\".count(\"b\")        # 1\n\"Ж\".isalpha(), \"7\".isdigit(), \" \".isspace()   # True True True\n\"key\" in \"secret key\"   # True — есть ли подстрока<\/code><\/pre>\n<h3>Собирать строку — через список и join<\/h3>\n<pre><code>letters = []\nfor c in text:\n    if c.isalpha():\n        letters.append(c.upper())\nresult = \"\".join(letters)\n# то же коротко:\nresult = \"\".join(c.upper() for c in text if c.isalpha())<\/code><\/pre>\n<p>Внутри <code>join(...)<\/code> квадратные скобки генератора списка можно не писать.<\/p>\n<p>Именно так готовят текст для классических шифров (неделя 7): убирают всё, кроме букв, приводят к одному регистру, режут на блоки и столбцы.<\/p>"}, {"id": "w3l4s2", "t": "choice", "html": "<p>Что выведет программа?<\/p><pre><code>s = \"ШИФРОВАНИЕ\"\nprint(s[1:4], s[-3:], s[::3])<\/code><\/pre>", "opts": [["ИФР НИЕ ШРАЕ", true, "Верно: s[1:4] — индексы 1, 2, 3; s[::3] — индексы 0, 3, 6, 9."], ["ИФРО НИЕ ШРАЕ", false, "Правая граница среза не входит: s[1:4] — это 3 символа."], ["ШИФ НИЕ ШРАЕ", false, "Индексы начинаются с 0: s[1] — 'И'."], ["ИФР ЕИН ШРАЕ", false, "s[-3:] идёт слева направо: 'НИЕ'."]]}, {"id": "w3l4s3", "t": "code", "html": "<p><b>Только буквы.<\/b> Перед шифрованием текст «нормализуют». Напишите функцию <code>clean(text)<\/code>: оставить только буквы (русские и латинские), убрать пробелы, цифры и знаки, перевести в верхний регистр.<\/p>\n<p>Пример: <code>clean(\"Встреча в 10:00, у моста!\")<\/code> → <code>\"ВСТРЕЧАВУМОСТА\"<\/code>.<\/p>", "tpl": "def clean(text):\n    # ваш код\n    pass", "calls": [["clean('Встреча в 10:00, у моста!')", "'ВСТРЕЧАВУМОСТА'", ""], ["clean('Attack at dawn')", "'ATTACKATDAWN'", ""], ["clean('ёжик Ёлка')", "'ЁЖИКЁЛКА'", ""], ["clean('A-B_C d.e,f!g?h')", "'ABCDEFGH'", ""], ["clean('Ключ: k3y_2026 (секрет)')", "'КЛЮЧKYСЕКРЕТ'", ""], ["clean('x')", "'X'", ""], ["clean('Шифр «Цезаря» — это сдвиг на 3.')", "'ШИФРЦЕЗАРЯЭТОСДВИГНА'", ""]], "limits": ""}, {"id": "w3l4s4", "t": "code", "html": "<p><b>Нарезать на блоки.<\/b> Блочные шифры работают с кусками фиксированной длины. Напишите функцию <code>blocks(s, k)<\/code>: вернуть <b>список<\/b> кусков строки s длины k; последний кусок может быть короче.<\/p>\n<p>Пример: <code>blocks(\"ПРИВЕТМИР\", 4)<\/code> → <code>[\"ПРИВ\", \"ЕТМИ\", \"Р\"]<\/code>. Подсказка: срез <code>s[i:i + k]<\/code> и <code>range(0, len(s), k)<\/code>.<\/p>", "tpl": "def blocks(s, k):\n    # ваш код\n    pass", "calls": [["blocks('ПРИВЕТМИР', 4)", "['ПРИВ', 'ЕТМИ', 'Р']", ""], ["blocks('ABCDEFGH', 4)", "['ABCD', 'EFGH']", ""], ["blocks('ABC', 5)", "['ABC']", ""], ["blocks('ABC', 1)", "['A', 'B', 'C']", ""], ["blocks('СЕКРЕТНЫЙКЛЮЧ', 2)", "['СЕ', 'КР', 'ЕТ', 'НЫ', 'ЙК', 'ЛЮ', 'Ч']", ""], ["blocks('X', 1)", "['X']", ""], ["blocks('КРИПТОГРАФИЯ', 12)", "['КРИПТОГРАФИЯ']", ""]], "limits": ""}, {"id": "w3l4s5", "t": "code", "html": "<p><b>Столбцы.<\/b> Если записать текст в строки по k символов, получится таблица из k столбцов. Столбец i состоит из символов с номерами i, i + k, i + 2k, … Это пригодится при взломе шифра Виженера (неделя 7).<\/p>\n<p>Напишите функцию <code>columns(s, k)<\/code>: вернуть список из k строк-столбцов. Пример: <code>columns(\"ABCDEFG\", 3)<\/code> → <code>[\"ADG\", \"BE\", \"CF\"]<\/code>. Подсказка: срез с шагом.<\/p>", "tpl": "def columns(s, k):\n    # ваш код\n    pass", "calls": [["columns('ABCDEFG', 3)", "['ADG', 'BE', 'CF']", ""], ["columns('ABCDEF', 2)", "['ACE', 'BDF']", ""], ["columns('ABC', 1)", "['ABC']", ""], ["columns('ШИФРВИЖЕНЕРА', 4)", "['ШВН', 'ИИЕ', 'ФЖР', 'РЕА']", ""], ["columns('0123456789', 5)", "['05', '16', '27', '38', '49']", ""], ["columns('КЛЮЧКЛЮЧКЛЮЧ', 4)", "['ККК', 'ЛЛЛ', 'ЮЮЮ', 'ЧЧЧ']", ""], ["columns('QWERTYUIOPASDFG', 7)", "['QIG', 'WO', 'EP', 'RA', 'TS', 'YD', 'UF']", ""]], "limits": ""}, {"id": "w3l4s6", "t": "parsons", "html": "<p>Соберите функцию, которая возвращает список слов текста: без знаков препинания по краям слов, в нижнем регистре, без пустых строк. Расставьте строки и отступы.<\/p>", "lines": [[0, "def words(text):"], [1, "result = []"], [1, "for w in text.split():"], [2, "w = w.strip(\".,!?\").lower()"], [2, "if w:"], [3, "result.append(w)"], [1, "return result"]]}]}, {"title": "ЛР-2. Алгоритм Евклида", "steps": [{"id": "w3l5s1", "t": "text", "html": "<h3>Лабораторная работа 2<\/h3>\n<p>Реализуйте алгоритм Евклида и расширенный алгоритм Евклида. Встроенные <code>math.gcd<\/code>, <code>math.lcm<\/code>, модули <code>fractions<\/code>, <code>sympy<\/code>, <code>numpy<\/code> использовать нельзя: смысл работы — написать алгоритм самому. Эти функции понадобятся вам дальше: в обратном элементе (нед. 4), RSA (нед. 12) и ECC (нед. 13).<\/p>"}, {"id": "w3l5s2", "t": "code", "html": "<p><b>ЛР-2.1. НОД.<\/b> Напишите функцию <code>gcd(a, b)<\/code>: НОД целых чисел (не оба равны 0). Результат всегда неотрицательный: <code>gcd(12, -18) == 6<\/code>.<\/p>\n<p>Подсказка: <code>abs(x)<\/code> — модуль числа, <code>abs(-18) == 18<\/code>.<\/p>", "tpl": "def gcd(a, b):\n    # ваш код\n    pass", "calls": [["gcd(48, 18)", "6", ""], ["gcd(1071, 462)", "21", ""], ["gcd(5, 0)", "5", ""], ["gcd(12, -18)", "6", ""], ["gcd(-12, 18)", "6", ""], ["gcd(832040, 514229)", "1", ""], ["gcd(123456789012, 987654321098)", "2", ""]], "limits": "<div class=\"limits\"><b>Ограничения<\/b><ul><li>В этой задаче math.gcd / math.lcm запрещены: реализуйте алгоритм Евклида сами.<\/li><li>Нельзя подключать модули: <code>fractions<\/code>, <code>numpy<\/code>, <code>sympy<\/code>, <code>gmpy2<\/code>.<\/li><\/ul><\/div>", "hints": ["Алгоритм Евклида: пока b ≠ 0, заменяйте пару (a, b) на (b, a mod b). Ответ — a. Посмотрите схему с квадратами в теории.", "НОД не зависит от знака: в самом начале сделайте <code>a, b = abs(a), abs(b)<\/code>.", "<pre><code>def gcd(a, b):\n    a, b = abs(a), abs(b)\n    while b != 0:\n        a, b = ...\n    return a<\/code><\/pre>"]}, {"id": "w3l5s3", "t": "choice", "html": "<p><b>Проверь себя перед ЛР-2.2.<\/b> В таблице расширенного алгоритма Евклида для 240 и 46 две последние строки (r, x, y) — это (46, 0, 1) и (10, 1, −5), частное q = 46 // 10 = 4. Какой будет новая строка?<\/p>", "opts": [["(6, −4, 21)", true, "Верно: новая строка = «две выше» − q × «выше»: (46 − 4·10, 0 − 4·1, 1 − 4·(−5)). Проверка: 240·(−4) + 46·21 = 6."], ["(6, 4, −19)", false, "Вычитайте из строки «две выше»: x = 0 − 4·1 = −4, y = 1 − 4·(−5) = 21."], ["(2, −4, 21)", false, "r считается так же, как x и y: r = 46 − 4·10 = 6."], ["(6, 1, −5)", false, "Это строка «выше» без изменений, а нужна новая: «две выше» − q × «выше»."]]}, {"id": "w3l5s4", "t": "code", "html": "<p><b>ЛР-2.2. Расширенный алгоритм Евклида.<\/b> Напишите функцию <code>egcd(a, b)<\/code> для a, b ≥ 0 (не оба 0). Верните кортеж <code>(g, x, y)<\/code>: g = НОД(a, b) и a·x + b·y = g. Подходит любая верная пара x, y.<\/p>\n<p>Пример: <code>egcd(240, 46)<\/code> → <code>(2, -9, 47)<\/code>.<\/p>\n<p>В шаблоне — каркас по таблице из разбора: переменные хранят две последние строки (r, x, y). Допишите вместо <code>...<\/code> частное, вычисление новой строки и сдвиг строк. Можно написать и по-своему.<\/p>", "tpl": "def egcd(a, b):\n    r0, x0, y0 = a, 1, 0      # строка «две выше»: r0 = a·x0 + b·y0\n    r1, x1, y1 = b, 0, 1      # строка «выше»:     r1 = a·x1 + b·y1\n    while r1 != 0:\n        q = ...               # частное, как в таблице\n        # новая строка = (r0, x0, y0) − q·(r1, x1, y1);\n        # затем «выше» становится «две выше», а новая — «выше»\n        ...\n    return ...                # строка с последним ненулевым r", "calls": [["egcd(240, 46)", "(2, -9, 47)", "подходит любая пара x, y с a·x + b·y = g"], ["egcd(17, 13)", "(1, -3, 4)", "подходит любая пара x, y с a·x + b·y = g"], ["egcd(0, 5)", "(5, 0, 1)", "подходит любая пара x, y с a·x + b·y = g"], ["egcd(5, 0)", "(5, 1, 0)", "подходит любая пара x, y с a·x + b·y = g"], ["egcd(1, 1)", "(1, 0, 1)", "подходит любая пара x, y с a·x + b·y = g"], ["egcd(123456789012, 987654321098)", "(2, 204728167426, -25591020695)", "подходит любая пара x, y с a·x + b·y = g"], ["egcd(170141183460469231731687303715884105727, 147808829414345923316083210206383297601)", "(1, 66851763530473604265066128439082823203, -76952359399378770303573258765908175580)", "подходит любая пара x, y с a·x + b·y = g"]], "limits": "<div class=\"limits\"><b>Ограничения<\/b><ul><li>В этой задаче math.gcd / math.lcm запрещены: реализуйте алгоритм Евклида сами.<\/li><li>Нельзя подключать модули: <code>fractions<\/code>, <code>numpy<\/code>, <code>sympy<\/code>, <code>gmpy2<\/code>.<\/li><\/ul><\/div>", "hints": ["Откройте «Разбор: соотношение Безу табличным методом» в уроке «Ручные задачи: Евклид и Безу». Код делает то же, что таблица, но хранит только две последние строки.", "Строка таблицы — тройка (r, x, y) с r = a·x + b·y. Старт: (a, 1, 0) и (b, 0, 1). Шаг: <code>q = r0 // r1<\/code>, новая строка = строка0 − q·строка1 для всех трёх чисел.", "<pre><code>def egcd(a, b):\n    r0, x0, y0 = a, 1, 0\n    r1, x1, y1 = b, 0, 1\n    while r1 != 0:\n        q = r0 // r1\n        r0, r1 = r1, r0 - q * r1\n        x0, x1 = x1, ...\n        y0, y1 = y1, ...\n    return (r0, x0, y0)<\/code><\/pre>"]}, {"id": "w3l5s5", "t": "code", "html": "<p><b>ЛР-2.3. Число шагов.<\/b> Напишите функцию <code>euclid_steps(a, b)<\/code> (a, b ≥ 0): сколько раз выполнится тело цикла <code>while b: a, b = b, a % b<\/code>.<\/p>\n<p>Примеры: (240, 46) → 5; (89, 55) → 9; (5, 0) → 0; (0, 5) → 1.<\/p>", "tpl": "def euclid_steps(a, b):\n    # ваш код\n    pass", "calls": [["euclid_steps(240, 46)", "5", ""], ["euclid_steps(89, 55)", "9", ""], ["euclid_steps(5, 0)", "0", ""], ["euclid_steps(1, 1)", "1", ""], ["euclid_steps(832040, 514229)", "28", ""], ["euclid_steps(1000000, 1)", "1", ""], ["euclid_steps(2, 1)", "1", ""]], "limits": "<div class=\"limits\"><b>Ограничения<\/b><ul><li>В этой задаче math.gcd / math.lcm запрещены: реализуйте алгоритм Евклида сами.<\/li><li>Нельзя подключать модули: <code>fractions<\/code>, <code>numpy<\/code>, <code>sympy<\/code>, <code>gmpy2<\/code>.<\/li><\/ul><\/div>", "hints": ["Это ваш gcd со счётчиком: сколько раз выполнится тело цикла <code>while b<\/code>.", "<code>steps = 0<\/code> до цикла, <code>steps += 1<\/code> внутри. При b = 0 цикл не выполняется ни разу — ответ 0.", "<pre><code>def euclid_steps(a, b):\n    steps = 0\n    while b:\n        a, b = b, a % b\n        ...\n    return steps<\/code><\/pre>"]}, {"id": "w3l5s6", "t": "code", "html": "<p><b>⭐ ЛР-2.4. Худший случай.<\/b> <i>Программа целиком: ввод — <code>input()<\/code>, вывод — <code>print()<\/code>.<\/i> Дано k ≥ 1. Выведите через пробел наименьшую пару a &gt; b ≥ 1, для которой алгоритм Евклида делает ровно k делений (наименьшее a, а при нём — наименьшее b). Подсказка: посмотрите на числа Фибоначчи.<\/p>\n<p>Пример: k = 3 → <code>5 3<\/code>.<\/p>", "io": [["1", "2 1"], ["5", "13 8"], ["90", "7540113804746346429 4660046610375530309"]], "limits": "", "hints": ["Худший случай — соседние числа Фибоначчи 1, 1, 2, 3, 5, 8, 13, … Сравните с примерами: (5, 3) → 3 деления, (89, 55) → 9.", "Пара для k = 1 — (2, 1). Следующая пара получается из предыдущей так: (a, b) → (a + b, a). Сделайте этот переход k − 1 раз.", "Проверьте свою догадку программой: напишите euclid_steps из ЛР-2.3 и посчитайте шаги для найденной пары."]}]}]}, {"n": 4, "title": "Неделя 4. Модульная арифметика, кольцо Z_n, поле GF(p)", "lessons": [{"title": "Сравнения, Z_n и поле GF(p)", "steps": [{"id": "w4l1s1", "t": "text", "html": "<h3>Арифметика по модулю — это часы<\/h3>\n<p>На циферблате с n делениями после n − 1 снова идёт 0. Число a «по модулю n» — это деление, на котором остановится стрелка, если сделать a шагов от нуля. Отрицательное a — шаги назад.<\/p><p style=\"text-align:center;\"><img alt=\"17 ≡ 5 (mod 12) и −3 ≡ 4 (mod 7) на циферблатах\" src=\"/media/attachments/lesson/2612710/w04_mod_clock.png\" style=\"height:auto;\"><\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 600 250\" width=\"600\" style=\"min-width:432px\" role=\"img\" aria-label=\"Арифметика по модулю — это арифметика на циферблате\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-clk\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><circle cx=\"130\" cy=\"125\" r=\"95\" class=\"f-soft\"/><text x=\"130.0\" y=\"53.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><text x=\"168.5\" y=\"63.3\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><circle cx=\"196.7\" cy=\"86.5\" r=\"14\" class=\"f-ok\"/><text x=\"196.7\" y=\"91.5\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">2<\/text><text x=\"207.0\" y=\"130.0\" class=\"s-t s-mono\" text-anchor=\"middle\">3<\/text><text x=\"196.7\" y=\"168.5\" class=\"s-t s-mono\" text-anchor=\"middle\">4<\/text><text x=\"168.5\" y=\"196.7\" class=\"s-t s-mono\" text-anchor=\"middle\">5<\/text><text x=\"130.0\" y=\"207.0\" class=\"s-t s-mono\" text-anchor=\"middle\">6<\/text><text x=\"91.5\" y=\"196.7\" class=\"s-t s-mono\" text-anchor=\"middle\">7<\/text><text x=\"63.3\" y=\"168.5\" class=\"s-t s-mono\" text-anchor=\"middle\">8<\/text><circle cx=\"53.0\" cy=\"125.0\" r=\"14\" class=\"f-acc\"/><text x=\"53.0\" y=\"130.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">9<\/text><text x=\"63.3\" y=\"91.5\" class=\"s-t s-mono\" text-anchor=\"middle\">10<\/text><text x=\"91.5\" y=\"63.3\" class=\"s-t s-mono\" text-anchor=\"middle\">11<\/text><path d=\"M78.5,117.8 A52,52 0 0 1 171.0,93.0\" class=\"s-acc2\" fill=\"none\" marker-end=\"url(#ar-clk)\"/><text x=\"130\" y=\"130\" class=\"s-t s-b\" text-anchor=\"middle\">+5<\/text><text x=\"260\" y=\"60\" class=\"s-t s-b\" text-anchor=\"start\">9 + 5 = 14 ≡ 2 (mod 12)<\/text><text x=\"260\" y=\"86\" class=\"s-t\" text-anchor=\"start\">14 часов на циферблате — это 2<\/text><text x=\"260\" y=\"112\" class=\"s-t\" text-anchor=\"start\"><\/text><text x=\"260\" y=\"138\" class=\"s-t\" text-anchor=\"start\">a mod n — «где остановилась стрелка»:<\/text><text x=\"260\" y=\"164\" class=\"s-t\" text-anchor=\"start\">остаток от деления на n.<\/text><text x=\"260\" y=\"190\" class=\"s-t\" text-anchor=\"start\">17 ≡ 2 (mod 5), −3 ≡ 4 (mod 7)<\/text><\/svg><\/div><figcaption>Арифметика по модулю — это арифметика на циферблате<\/figcaption><\/figure>\n<p><b>a ≡ b (mod n)<\/b> читается «a сравнимо с b по модулю n» и значит: стрелка для a и для b стоит на одном делении. Иначе: a и b дают одинаковый остаток, или n делит a − b.<\/p>\n<p><b>Главное удобство:<\/b> сокращать по модулю можно в любой момент, ответ не изменится.<\/p>\n<pre><code>(17 + 29) mod 12 = (5 + 5) mod 12 = 10\n(17 · 29) mod 12 = (5 · 5) mod 12 = 25 mod 12 = 1<\/code><\/pre>\n<p>Поэтому компьютер считает 7^1000 mod 13, не вычисляя огромное 7^1000: после каждого умножения берётся остаток (быстрое возведение в степень — неделя 5).<\/p>"}, {"id": "w4l1s2", "t": "widget", "kind": "zn", "html": ""}, {"id": "w4l1s3", "t": "text", "html": "<h3>Обратный элемент — ищем 1 в таблице умножения<\/h3>\n<p>Обратный к a по модулю n — такое x, что a·x ≡ 1 (mod n). В таблице умножения это клетка со значением 1 в строке a.<\/p><p style=\"text-align:center;\"><img alt=\"Таблицы умножения Z7 и Z8 с выделенными единицами и нулями\" src=\"/media/attachments/lesson/2612710/w04_zn_tables.png\" style=\"height:auto;\"><\/p>\n<ul>\n<li>В Z₇ (7 — простое) в каждой строке, кроме нулевой, есть ровно одна единица. Каждый ненулевой элемент обратим, делить можно на всё, кроме 0. Такая структура называется <b>полем GF(7)<\/b>.<\/li>\n<li>В Z₈ строки 2, 4 и 6 не содержат единицы: у них нет обратного. Зато в них есть нули: 2·4 ≡ 0, 4·6 ≡ 0. Это <b>делители нуля<\/b>.<\/li>\n<\/ul>\n<p>Правило: <b>обратный к a по модулю n существует ⇔ НОД(a, n) = 1<\/b>. У 2, 4, 6 с числом 8 общий делитель 2, поэтому все их кратные — чётные и никогда не дают 1 по модулю 8.<\/p>\n<p><b>Общее правило.<\/b> Пусть d = НОД(a, n) &gt; 1. Тогда a·(n/d) = (a/d)·n делится на n, то есть a·(n/d) ≡ 0, хотя n/d ≢ 0 (≢ — «не сравнимо»). Значит, a — делитель нуля. Если же НОД(a, n) = 1, то a обратим и из a·b ≡ 0 следует b ≡ a⁻¹·0 = 0. Итак, каждый ненулевой элемент Z_n либо <b>обратим<\/b> (НОД = 1), либо <b>делитель нуля<\/b> (НОД &gt; 1). Пример: в Z₈ 6·4 = 24 ≡ 0, здесь d = 2 и n/d = 4.<\/p>\n<p>Для больших n таблицу не построить, поэтому обратный ищут расширенным алгоритмом Евклида (следующий шаг).<\/p>"}, {"id": "w4l1s4", "t": "text", "html": "<h3>Разбор: 17⁻¹ mod 43 таблицей Евклида<\/h3>\n<p>Таблица та же, что на неделе 3, но нужен только коэффициент при 17: обозначим его t. В каждой строке r ≡ 17·t (mod 43).<\/p>\n<table style=\"text-align:right;\">\n<tbody><tr style=\"background:#EEF2F6;\"><th style=\"padding:4px 10px;\">r<\/th><th style=\"padding:4px 10px;\">q<\/th><th style=\"padding:4px 10px;\">t<\/th><th style=\"padding:4px 10px;\">проверка 17·t mod 43<\/th><\/tr>\n<tr><td style=\"padding:4px 10px;\">43<\/td><td style=\"padding:4px 10px;\">—<\/td><td style=\"padding:4px 10px;\">0<\/td><td style=\"padding:4px 10px;\">0 ≡ 43<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">17<\/td><td style=\"padding:4px 10px;\">—<\/td><td style=\"padding:4px 10px;\">1<\/td><td style=\"padding:4px 10px;\">17<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">9<\/td><td style=\"padding:4px 10px;\">2<\/td><td style=\"padding:4px 10px;\">0 − 2·1 = −2<\/td><td style=\"padding:4px 10px;\">−34 ≡ 9<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">8<\/td><td style=\"padding:4px 10px;\">1<\/td><td style=\"padding:4px 10px;\">1 − 1·(−2) = 3<\/td><td style=\"padding:4px 10px;\">51 ≡ 8<\/td><\/tr>\n<tr style=\"background:#FDF1DC;\"><td style=\"padding:4px 10px;\"><b>1<\/b><\/td><td style=\"padding:4px 10px;\">1<\/td><td style=\"padding:4px 10px;\"><b>−2 − 1·3 = −5<\/b><\/td><td style=\"padding:4px 10px;\">−85 ≡ 1<\/td><\/tr>\n<\/tbody><\/table>\n<p>Дошли до r = 1, значит 17·(−5) ≡ 1 (mod 43). Обратный — <b>−5 mod 43 = 38<\/b>. Проверка: 17·38 = 646 = 15·43 + 1 ✓.<\/p>\n<p>Если r = 1 так и не встретилось (следующий остаток уже 0), то последний ненулевой остаток d = НОД(a, n) больше 1 и обратного нет.<\/p>\n<h3>Деление в поле GF(p)<\/h3>\n<p>«Разделить на b» по модулю простого p — значит умножить на b⁻¹. Пример в GF(7): 4 / 3 = 4·3⁻¹ = 4·5 = 20 ≡ 6. Проверка: 6·3 = 18 ≡ 4 ✓. Обычное деление <code>4 / 3<\/code> здесь не подходит: в Z_n нет дробей.<\/p>"}, {"id": "w4l1s5", "t": "choice", "html": "<p><b>Проверь себя.<\/b> У какого элемента Z₁₀ <b>нет<\/b> обратного?<\/p>", "opts": [["4", true, "Верно: НОД(4, 10) = 2, все кратные 4 по модулю 10 чётные — единицы не получить."], ["3", false, "3·7 = 21 ≡ 1 (mod 10): обратный есть."], ["7", false, "7·3 = 21 ≡ 1 (mod 10): обратный есть."], ["9", false, "9·9 = 81 ≡ 1 (mod 10): 9 обратен сам себе."]]}, {"id": "w4l1s6", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Чему равно (123·457) mod 10? Сначала сократите каждый множитель по модулю 10.<\/p>", "opts": [["1", true, "Верно: 3·7 = 21 ≡ 1 (mod 10)."], ["21", false, "Результат по модулю 10 лежит в 0…9: сократите 21."], ["7", false, "Множители сокращаются оба: 123 → 3, 457 → 7, затем 3·7."], ["0", false, "Произведение нечётных чисел не может оканчиваться на 0."]]}, {"id": "w4l1s7", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Чему равно −25 mod 7 (как в Python: <code>-25 % 7<\/code>)?<\/p>", "opts": [["3", true, "Верно: −25 = 7·(−4) + 3. На часах с 7 делениями 25 шагов назад приводят в 3."], ["4", false, "Это 25 mod 7. Для −25 идите назад: −25 = −28 + 3."], ["−4", false, "Остаток по модулю 7 лежит в 0…6."], ["−3", false, "−3 — это частное при делении «с отбрасыванием дробной части»: −25 = 7·(−3) − 4. В Python остаток неотрицателен: −25 = 7·(−4) + 3, ответ 3."]]}, {"id": "w4l1s8", "t": "text", "html": "<h3>Аффинный шифр: почему нужен НОД(a, 26) = 1<\/h3><p style=\"text-align:center;\"><img alt=\"Аффинный шифр с a = 3 переставляет буквы, с a = 2 склеивает их попарно\" src=\"/media/attachments/lesson/2612710/w04_affine_perm.png\" style=\"height:auto;\"><\/p>\n<p>При a = 3 каждая буква переходит в свою, и расшифрование D(y) = 3⁻¹·(y − 5) mod 26 однозначно (3⁻¹ = 9). При a = 2 буквы склеиваются по две: «a» и «n» обе шифруются в «f» (на рисунке шифртекст — заглавными буквами). По шифртексту уже не понять, какая была буква: у 2 нет обратного по модулю 26.<\/p>\n<h3>Частые ошибки<\/h3>\n<ul>\n<li><b>Забывают взять остаток после вычитания.<\/b> y − b может быть отрицательным: в Python <code>(y - b) % 26<\/code> вернёт верный неотрицательный результат, а в ручном счёте прибавьте 26.<\/li>\n<li><b>Делят обычным делением.<\/b> <code>(y - b) / a<\/code> даст дробь. Нужно умножить на a⁻¹.<\/li>\n<li><b>Ищут обратный, когда его нет.<\/b> Сначала проверьте НОД. В ЛР функция должна сообщить об ошибке, а не вернуть «что-то».<\/li>\n<li><b>Используют pow(a, -1, n) в ЛР.<\/b> Для самопроверки можно, в решениях ЛР-3 — нет: задача в том, чтобы реализовать алгоритм.<\/li>\n<\/ul>\n<p>Ниже — краткий конспект темы.<\/p>"}, {"id": "w4l1s9", "t": "text", "html": "<h3>Сравнения по модулю<\/h3>\n<p>a ≡ b (mod n), если n делит a − b, то есть a и b дают одинаковый остаток при делении на n. Например, 17 ≡ 2 (mod 5), −3 ≡ 4 (mod 7).<\/p>\n<h3>Кольцо Z_n<\/h3>\n<p>Z_n = {0, 1, …, n−1} со сложением и умножением по модулю n. При составном n бывают <b>делители нуля<\/b>: в Z_6 произведение 2·3 = 6 ≡ 0, хотя 2 ≠ 0 и 3 ≠ 0.<\/p>\n<h3>Обратный элемент<\/h3>\n<p>a⁻¹ mod n — такое x, что a·x ≡ 1 (mod n). <b>Существует тогда и только тогда, когда НОД(a, n) = 1.<\/b> Находится расширенным алгоритмом Евклида: из a·x + n·y = 1 следует a·x ≡ 1 (mod n).<\/p>\n<pre><code>17·x + 43·y = 1  →  x = −5  →  17⁻¹ ≡ −5 ≡ 38 (mod 43)\nпроверка: 17·38 = 646 = 15·43 + 1 ✓<\/code><\/pre>\n<h3>Поле GF(p)<\/h3>\n<p>Если p простое, то каждое a из 1…p−1 взаимно просто с p (единственные делители p — это 1 и p), значит, у каждого ненулевого элемента есть обратный. Такая структура — <b>поле<\/b> GF(p): в нём можно складывать, вычитать, умножать и <b>делить<\/b>: a / b = a · b⁻¹ mod p.<\/p>\n<p>Пример в GF(7): 3⁻¹ = 5 (3·5 = 15 ≡ 1), поэтому 4 / 3 = 4·5 = 20 ≡ 6.<\/p>\n<p>Линейное сравнение a·x ≡ b (mod p) решается делением: x = b · a⁻¹ mod p.<\/p>\n<h3>Исключения в Python<\/h3>\n<p><b>raise<\/b> останавливает функцию и «выбрасывает» ошибку наверх, к тому, кто её вызвал. Строки после <code>raise<\/code> не выполняются, а функция ничего не возвращает.<\/p>\n<pre><code>def mod_inverse(a, n):\n    g, x, _ = egcd(a % n, n)\n    if g != 1:\n        raise ValueError(\"обратного нет\")   # дальше функция не идёт\n    return x % n<\/code><\/pre>\n<p><b>try / except<\/b> ловит ошибку. Python выполняет блок <code>try<\/code>. Если внутри возникла ошибка указанного типа, остаток <code>try<\/code> пропускается и выполняется блок <code>except<\/code>. После этого программа идёт дальше, как обычно.<\/p>\n<pre><code>try:\n    print(mod_inverse(2, 6))       # здесь возникнет ValueError\n    print(\"эта строка не выполнится\")\nexcept ValueError as e:            # e — сам объект ошибки, str(e) — её текст\n    print(\"ошибка:\", e)            # ошибка: обратного нет\nprint(\"программа продолжается\")<\/code><\/pre>\n<p>Если ошибку никто не поймал, программа завершается и печатает traceback. Ловите только ожидаемый тип (<code>except ValueError<\/code>), а не «всё подряд»: голый <code>except:<\/code> спрячет и настоящие баги.<\/p>\n<p>Функция не должна «молча» возвращать неправильное число — лучше явно сообщить об ошибке. <code>pow(a, -1, n)<\/code> можно использовать только для самопроверки.<\/p>"}, {"id": "w4l1s10", "t": "choice", "html": "<p>Какие из Z_n являются полями? (Выберите все.)<\/p>", "opts": [["Z_5", true, ""], ["Z_6", false, "2·3 ≡ 0 — делители нуля."], ["Z_9", false, "3·3 ≡ 0."], ["Z_11", true, ""], ["Z_12", false, "Составное число."], ["Z_13", true, ""]], "multi": true}, {"id": "w4l1s11", "t": "choice", "html": "<p>Что выведет программа?<\/p><pre><code>try:\n    x = int(\"7a\")\n    print(\"ok\", x)\nexcept ValueError:\n    print(\"ошибка\")\nprint(\"конец\")<\/code><\/pre>", "opts": [["«ошибка», затем «конец»", true, "int(\"7a\") вызывает ValueError, программа продолжает работу после except."], ["«ok 7», затем «конец»", false, "\"7a\" — не десятичное число."], ["только «ошибка»", false, "После except выполнение продолжается."], ["Программа аварийно завершится", false, "Исключение перехвачено."]]}, {"id": "w4l1s12", "t": "code", "html": "<p><b>Безопасный обратный.<\/b> Функция <code>mod_inverse(a, n)<\/code> из шаблона возбуждает <code>ValueError<\/code>, если обратного нет. Напишите <code>safe_inverse(a, n)<\/code>: она вызывает <code>mod_inverse<\/code> и возвращает строку с обратным элементом или строку <code>нет<\/code>.<\/p>\n<p>Используйте <code>try / except ValueError<\/code>. НОД заранее не проверяйте: смысл задачи — поймать ошибку именно через <code>except ValueError<\/code>.<\/p>\n<pre><code>safe_inverse(3, 7) → \"5\"\nsafe_inverse(2, 6) → \"нет\"<\/code><\/pre>", "tpl": "def mod_inverse(a, n):\n    for x in range(1, n):\n        if a * x % n == 1:\n            return x\n    raise ValueError(\"обратного нет\")\n\n\ndef safe_inverse(a, n):\n    # ваш код: try / except ValueError\n    pass", "calls": [["safe_inverse(3, 7)", "'5'", ""], ["safe_inverse(17, 43)", "'38'", ""], ["safe_inverse(0, 5)", "'нет'", ""], ["safe_inverse(1, 2)", "'1'", ""], ["safe_inverse(5, 18)", "'11'", ""], ["safe_inverse(100, 101)", "'100'", ""], ["safe_inverse(13, 26)", "'нет'", ""]], "limits": ""}]}, {"title": "Ручные задачи: обратный элемент и GF(p)", "steps": [{"id": "w4l2s1", "t": "example", "html": "<h3>Разбор: обратный элемент<\/h3><p>Найдём 17<sup>−1<\/sup> mod 43. НОД должен быть 1. Табличный метод для пары (43, 17): в строке r = 43·x + 17·y.<\/p><table><tr><th>r<\/th><th>q<\/th><th>x (при 43)<\/th><th>y (при 17)<\/th><\/tr><tr><td>43<\/td><td><\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>17<\/td><td><\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>9<\/td><td>2<\/td><td>1<\/td><td>-2<\/td><\/tr><tr><td>8<\/td><td>1<\/td><td>-1<\/td><td>3<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>2<\/td><td>-5<\/td><\/tr><tr><td>0<\/td><td>8<\/td><td>-17<\/td><td>43<\/td><\/tr><\/table><p>В строке с r = 1: 43·2 + 17·-5 = 1, значит 17·-5 ≡ 1 (mod 43). Приводим к 0…42: -5 mod 43 = <b>38<\/b>. Проверка: 17·38 = 646 = 15·43 + 1 ✓<\/p><p class=\"ans\">Ответ в формате задачи: <code>38<\/code><\/p><h3>Разбор: деление в GF(p)<\/h3><p>7 / 3 в GF(11): сначала 3<sup>−1<\/sup> mod 11 = 4 (потому что 3·4 = 12 ≡ 1), затем 7·4 = 28 ≡ <b>6<\/b> (mod 11).<\/p><p class=\"ans\">Ответ в формате задачи: <code>6<\/code><\/p><h3>Разбор: линейное сравнение<\/h3><p>5·x ≡ 3 (mod 13). Делим обе части на 5: x ≡ 3·5<sup>−1<\/sup>. 5<sup>−1<\/sup> mod 13 = 8 (5·8 = 40 ≡ 1), x = 3·8 = 24 ≡ <b>11<\/b>. Проверка: 5·11 = 55 ≡ 3 ✓<\/p><p class=\"ans\">Ответ в формате задачи: <code>11<\/code><\/p><h3>Разбор: делители нуля<\/h3><p>В Z<sub>12<\/sub> число a — делитель нуля, если НОД(a, 12) &gt; 1: тогда a·(12/НОД) ≡ 0. Например, 8·3 = 24 ≡ 0. Перебираем a = 1…11 и оставляем те, у которых есть общий делитель с 12: <b>2 3 4 6 8 9 10<\/b>.<\/p><p class=\"ans\">Ответ в формате задачи: <code>2 3 4 6 8 9 10<\/code><\/p>"}, {"id": "w4l2s2", "t": "dataset", "html": "<p><b>Обратный элемент.<\/b> Во входных данных числа a и n. Найдите a⁻¹ mod n. Запишите число от 0 до n−1 или слово <code>нет<\/code>, если обратного не существует.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["83 84", "83"], ["79 93", "73"], ["21 75", "нет"]]}, {"id": "w4l2s3", "t": "dataset", "html": "<p><b>Деление в GF(p).<\/b> Во входных данных числа a, b и простое p. Вычислите a / b в поле GF(p). Запишите число от 0 до p−1.<\/p><p class=\"note\">✍️ Ручная задач
