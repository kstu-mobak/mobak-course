" class=\"s-t s-mono s-b\" text-anchor=\"middle\">T<\/text><text x=\"72.6\" y=\"175.6\" class=\"s-t s-mono t-acc2\" text-anchor=\"middle\">W<\/text><text x=\"30.9\" y=\"149.3\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">U<\/text><text x=\"72.6\" y=\"154.4\" class=\"s-t s-mono t-acc2\" text-anchor=\"middle\">X<\/text><text x=\"38.4\" y=\"118.9\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">V<\/text><text x=\"77.7\" y=\"133.8\" class=\"s-t s-mono t-acc2\" text-anchor=\"middle\">Y<\/text><text x=\"53.0\" y=\"91.2\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">W<\/text><text x=\"87.6\" y=\"115.0\" class=\"s-t s-mono t-acc2\" text-anchor=\"middle\">Z<\/text><text x=\"73.8\" y=\"67.7\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">X<\/text><text x=\"101.6\" y=\"99.1\" class=\"s-t s-mono t-acc2\" text-anchor=\"middle\">A<\/text><text x=\"99.6\" y=\"49.9\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">Y<\/text><text x=\"119.1\" y=\"87.1\" class=\"s-t s-mono t-acc2\" text-anchor=\"middle\">B<\/text><text x=\"128.9\" y=\"38.8\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">Z<\/text><text x=\"138.9\" y=\"79.6\" class=\"s-t s-mono t-acc2\" text-anchor=\"middle\">C<\/text><text x=\"160\" y=\"154\" class=\"s-tm\" text-anchor=\"middle\">сдвиг<\/text><text x=\"160\" y=\"176\" class=\"s-t s-b\" text-anchor=\"middle\">k = 3<\/text><\/svg><\/div><figcaption>Шифр Цезаря: внешнее кольцо — открытый текст, внутреннее — шифртекст (A → D)<\/figcaption><\/figure>\n<p><b>Шифр простой замены<\/b> (буквы переставлены произвольно) имеет 32! ≈ 2,6·10<sup>35<\/sup> ≈ 2<sup>118<\/sup> ключей, но ломается тем же частотным анализом: замена сохраняет частоты. Вывод: <b>большое пространство ключей необходимо, но не достаточно<\/b>.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 610 210\" width=\"610\" style=\"min-width:439px\" role=\"img\" aria-label=\"Частоты букв русского текста, % (примерно). Самая частая — «о»\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-fr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><rect x=\"30\" y=\"21.4\" width=\"28\" height=\"153.6\" rx=\"4\" class=\"f-acc2\"/><text x=\"44\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">о<\/text><text x=\"44\" y=\"16.419999999999987\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">11<\/text><rect x=\"68\" y=\"56.7\" width=\"28\" height=\"118.3\" rx=\"4\" class=\"f-acc\"/><text x=\"82\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">е<\/text><text x=\"82\" y=\"51.70000000000002\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">8<\/text><rect x=\"106\" y=\"62.9\" width=\"28\" height=\"112.1\" rx=\"4\" class=\"f-acc\"/><text x=\"120\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">а<\/text><text x=\"120\" y=\"57.86\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">8<\/text><rect x=\"144\" y=\"72.1\" width=\"28\" height=\"102.9\" rx=\"4\" class=\"f-acc\"/><text x=\"158\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">и<\/text><text x=\"158\" y=\"67.10000000000001\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">7<\/text><rect x=\"182\" y=\"81.2\" width=\"28\" height=\"93.8\" rx=\"4\" class=\"f-acc\"/><text x=\"196\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">н<\/text><text x=\"196\" y=\"76.2\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">7<\/text><rect x=\"220\" y=\"87.4\" width=\"28\" height=\"87.6\" rx=\"4\" class=\"f-acc\"/><text x=\"234\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">т<\/text><text x=\"234\" y=\"82.36\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">6<\/text><rect x=\"258\" y=\"98.4\" width=\"28\" height=\"76.6\" rx=\"4\" class=\"f-acc\"/><text x=\"272\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">с<\/text><text x=\"272\" y=\"93.42\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">5<\/text><rect x=\"296\" y=\"108.8\" width=\"28\" height=\"66.2\" rx=\"4\" class=\"f-acc\"/><text x=\"310\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">р<\/text><text x=\"310\" y=\"103.78\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">5<\/text><rect x=\"334\" y=\"111.4\" width=\"28\" height=\"63.6\" rx=\"4\" class=\"f-acc\"/><text x=\"348\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">в<\/text><text x=\"348\" y=\"106.44\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">5<\/text><rect x=\"372\" y=\"113.4\" width=\"28\" height=\"61.6\" rx=\"4\" class=\"f-acc\"/><text x=\"386\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">л<\/text><text x=\"386\" y=\"108.39999999999999\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">4<\/text><rect x=\"410\" y=\"126.1\" width=\"28\" height=\"48.9\" rx=\"4\" class=\"f-acc\"/><text x=\"424\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">к<\/text><text x=\"424\" y=\"121.14\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">3<\/text><rect x=\"448\" y=\"130.1\" width=\"28\" height=\"44.9\" rx=\"4\" class=\"f-acc\"/><text x=\"462\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">м<\/text><text x=\"462\" y=\"125.06\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">3<\/text><rect x=\"486\" y=\"133.3\" width=\"28\" height=\"41.7\" rx=\"4\" class=\"f-acc\"/><text x=\"500\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">д<\/text><text x=\"500\" y=\"128.28\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">3<\/text><rect x=\"524\" y=\"135.7\" width=\"28\" height=\"39.3\" rx=\"4\" class=\"f-acc\"/><text x=\"538\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">п<\/text><text x=\"538\" y=\"130.66\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">3<\/text><rect x=\"562\" y=\"138.3\" width=\"28\" height=\"36.7\" rx=\"4\" class=\"f-acc\"/><text x=\"576\" y=\"196\" class=\"s-t s-b\" text-anchor=\"middle\">у<\/text><text x=\"576\" y=\"133.32\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:11px\">3<\/text><\/svg><\/div><figcaption>Частоты букв русского текста, % (примерно). Самая частая — «о»<\/figcaption><\/figure>\n<h3>Шифр Виженера<\/h3>\n<p>Ключ — слово, например LEMON. Буква открытого текста с номером i сдвигается на букву ключа с номером i mod |ключ|: ATTACKATDAWN + LEMON → LXFOPVEFRNHR. Это несколько шифров Цезаря вперемешку. Если длина ключа L известна, текст распадается на L столбцов, каждый столбец — обычный Цезарь, и частотный анализ снова работает.<\/p>\n<h3>Модели атак<\/h3>\n<ul>\n<li><b>Только шифртекст<\/b> — противник видит лишь c (частотный анализ);<\/li>\n<li><b>Известный открытый текст<\/b> — у противника есть пары (m, c) (для Цезаря и Виженера это сразу ключ);<\/li>\n<li><b>Выбранный открытый текст<\/b> — противник может зашифровать свои сообщения;<\/li>\n<li><b>Выбранный шифртекст<\/b> — противник может подсовывать свои шифртексты на расшифрование и смотреть на реакцию (например, на сообщение «неверное дополнение»). Так работает атака padding oracle (нед. 9).<\/li>\n<\/ul>\n<p>Современный шифр должен выдерживать все четыре модели.<\/p>\n<h3>XOR — сложение в GF(2)<\/h3>\n<p>XOR (⊕) — сложение битов по модулю 2: 0⊕0 = 0, 0⊕1 = 1, 1⊕1 = 0. Свойства: a ⊕ 0 = a, a ⊕ a = 0, коммутативность и ассоциативность. Отсюда главное: (m ⊕ k) ⊕ k = m — шифрование и расшифрование одной операцией. Пример: 0x5A ⊕ 0x3C = 01011010 ⊕ 00111100 = 01100110 = 0x66.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 520 196\" width=\"520\" style=\"min-width:374px\" role=\"img\" aria-label=\"XOR дважды с одним ключом возвращает исходное: (m ⊕ k) ⊕ k = m\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-otp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><text x=\"150\" y=\"33\" class=\"s- \" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"275.5\" y=\"66.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"293\" y=\"48\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"307.5\" y=\"66.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"325\" y=\"48\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"339.5\" y=\"66.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"357\" y=\"48\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"371.5\" y=\"66.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"389\" y=\"48\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"403.5\" y=\"66.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><text x=\"440\" y=\"69\" class=\"s-tm s-mono\" text-anchor=\"start\">0x58<\/text><text x=\"150\" y=\"105\" class=\"s-t s-mono\" text-anchor=\"end\">= c<\/text><rect x=\"165\" y=\"84\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc2\"/><text x=\"179.5\" y=\"102.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"197\" y=\"84\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc2\"/><text x=\"211.5\" y=\"102.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"229\" y=\"84\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc2\"/><text x=\"243.5\" y=\"102.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"261\" y=\"84\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc2\"/><text x=\"275.5\" y=\"102.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"293\" y=\"84\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc2\"/><text x=\"307.5\" y=\"102.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"325\" y=\"84\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc2\"/><text x=\"339.5\" y=\"102.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"357\" y=\"84\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc2\"/><text x=\"371.5\" y=\"102.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"389\" y=\"84\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc2\"/><text x=\"403.5\" y=\"102.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><text x=\"440\" y=\"105\" class=\"s-tm s-mono\" text-anchor=\"start\">0x10<\/text><line x1=\"160\" y1=\"117\" x2=\"420\" y2=\"117\" class=\"s-mu\" stroke-dasharray=\"5 4\"/><text x=\"150\" y=\"141\" class=\"s-t s-mono\" text-anchor=\"end\">⊕ k<\/text><rect x=\"165\" y=\"120\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"179.5\" y=\"138.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"197\" y=\"120\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"211.5\" y=\"138.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"229\" y=\"120\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"243.5\" y=\"138.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"261\" y=\"120\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"275.5\" y=\"138.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"293\" y=\"120\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"307.5\" y=\"138.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"325\" y=\"120\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"339.5\" y=\"138.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"357\" y=\"120\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"371.5\" y=\"138.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"389\" y=\"120\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-acc\"/><text x=\"403.5\" y=\"138.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><text x=\"440\" y=\"141\" class=\"s-tm s-mono\" text-anchor=\"start\">0x58<\/text><text x=\"150\" y=\"177\" class=\"s-t s-mono\" text-anchor=\"end\">= m = 'H'<\/text><rect x=\"165\" y=\"156\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-ok\"/><text x=\"179.5\" y=\"174.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"197\" y=\"156\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-ok\"/><text x=\"211.5\" y=\"174.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"229\" y=\"156\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-ok\"/><text x=\"243.5\" y=\"174.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"261\" y=\"156\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-ok\"/><text x=\"275.5\" y=\"174.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"293\" y=\"156\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-ok\"/><text x=\"307.5\" y=\"174.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"325\" y=\"156\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-ok\"/><text x=\"339.5\" y=\"174.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"357\" y=\"156\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-ok\"/><text x=\"371.5\" y=\"174.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"389\" y=\"156\" width=\"29\" height=\"29\" rx=\"5\" class=\"f-ok\"/><text x=\"403.5\" y=\"174.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><text x=\"440\" y=\"177\" class=\"s-tm s-mono\" text-anchor=\"start\">0x48<\/text><\/svg><\/div><figcaption>XOR дважды с одним ключом возвращает исходное: (m ⊕ k) ⊕ k = m<\/figcaption><\/figure>\n<p><b>Повторяющийся XOR-ключ<\/b> — это «Виженер над байтами», и ломается он так же.<\/p>\n<h3>Одноразовый блокнот (OTP)<\/h3>\n<p>c = m ⊕ k. Шеннон доказал: OTP обладает <b>совершенной секретностью<\/b> — шифртекст не даёт никакой информации об открытом тексте, — если ключ:<\/p>\n<ol><li>истинно случаен (равномерен);<\/li><li>не короче сообщения;<\/li><li>используется <b>ровно один раз<\/b>;<\/li><li>хранится в секрете.<\/li><\/ol>\n<p><b>Поточный шифр<\/b> заменяет длинный случайный ключ на гамму (keystream), вырабатываемую из короткого ключа. Если одну гамму использовать дважды: c₁ ⊕ c₂ = (m₁ ⊕ k) ⊕ (m₂ ⊕ k) = m₁ ⊕ m₂. Ключ исчез; зная или угадав m₁, противник получает m₂. На 9-й неделе вы встретите это как повтор nonce в режиме CTR.<\/p>\n<p>Ключи генерируются только модулем <code>secrets<\/code>: <code>secrets.token_bytes(n)<\/code>. Модуль <code>random<\/code> предсказуем.<\/p>"}, {"id": "w7l1s11", "t": "choice", "html": "<p>Какие условия нужны, чтобы одноразовый блокнот обеспечивал совершенную секретность? Отметьте все.<\/p>", "opts": [["Ключ истинно случаен", true, ""], ["Ключ не короче сообщения", true, ""], ["Ключ используется только один раз", true, ""], ["Ключ хранится в секрете", true, ""], ["Алгоритм шифрования держится в секрете", false, "Принцип Керкгоффса: секретен только ключ."], ["Ключ получен через random.randint", false, "random предсказуем: нужен secrets."]], "multi": true}, {"id": "w7l1s12", "t": "choice", "html": "<p>У шифра простой замены около 2<sup>118<\/sup> ключей. Почему его всё равно легко взломать?<\/p>", "opts": [["Замена сохраняет частоты букв — работает частотный анализ", true, ""], ["2^118 ключей перебирается за секунды", false, "Перебор 2^118 невозможен; ломают не перебором."], ["Ключ всегда короче сообщения", false, "Длина ключа здесь ни при чём."], ["Шифр использует XOR", false, "Простая замена не использует XOR."]]}, {"id": "w7l1s13", "t": "choice", "html": "<p>Два сообщения зашифрованы XOR с одной и той же гаммой k. Чему равно c₁ ⊕ c₂?<\/p>", "opts": [["m₁ ⊕ m₂", true, ""], ["k", false, "k сокращается: k ⊕ k = 0."], ["m₁ ⊕ m₂ ⊕ k", false, "k входит дважды и сокращается."], ["0", false, "Равно 0, только если m₁ = m₂."]]}]}, {"title": "Ручные задачи: XOR, Цезарь, Виженер, повтор ключа", "steps": [{"id": "w7l2s1", "t": "example", "html": "<h3>Разбор: XOR байтов<\/h3><p>A = 3C A7, B = 5A 0F. Переводим в биты (по 4 бита на hex-цифру) и сравниваем столбцы: одинаковые биты → 0, разные → 1.<\/p><table><tr><th><\/th><th>Биты<\/th><\/tr><tr><td>A<\/td><td><code>00111100 10100111<\/code><\/td><\/tr><tr><td>B<\/td><td><code>01011010 00001111<\/code><\/td><\/tr><tr><td>A ⊕ B<\/td><td><code>01100110 10101000<\/code><\/td><\/tr><\/table><p>Обратно в hex: <b>66 A8<\/b>.<\/p><p class=\"ans\">Ответ в формате задачи: <code>66 A8<\/code><\/p><h3>Разбор: взлом Цезаря<\/h3><p>Шифртекст: <code>упуру цчехуиу суцче цчунч зацупно йус<\/code>.<\/p><ol><li>Считаем буквы (без пробелов). Самые частые: «у» — 9, «ц» — 4, «ч» — 4.<\/li><li>Предполагаем, что «у» — это зашифрованная «о». Номера в алфавите из 32 букв: «о» = 14, «у» = 19.<\/li><li>Ключ k = 19 − 14 = <b>5<\/b> (mod 32). Проверяем: сдвигаем каждую букву назад на 5 — получается «около старого моста стоит высокий дом». Осмысленно — ключ найден.<\/li><\/ol><p class=\"ans\">Ответ в формате задачи: <code>5<\/code><\/p><h3>Разбор: Виженер вручную<\/h3><p>P = HELLOWORLD, K = KEY (A = 0 … Z = 25). Ключ повторяем под текстом и складываем номера по модулю 26.<\/p><table><tr><th>P<\/th><th>H<\/th><th>E<\/th><th>L<\/th><th>L<\/th><th>O<\/th><th>W<\/th><th>O<\/th><th>R<\/th><th>L<\/th><th>D<\/th><\/tr><tr><td>K<\/td><td>K<\/td><td>E<\/td><td>Y<\/td><td>K<\/td><td>E<\/td><td>Y<\/td><td>K<\/td><td>E<\/td><td>Y<\/td><td>K<\/td><\/tr><tr><td>P + K<\/td><td>7+10=17<\/td><td>4+4=8<\/td><td>11+24=35<\/td><td>11+10=21<\/td><td>14+4=18<\/td><td>22+24=46<\/td><td>14+10=24<\/td><td>17+4=21<\/td><td>11+24=35<\/td><td>3+10=13<\/td><\/tr><tr><td>mod 26<\/td><td>17<\/td><td>8<\/td><td>9<\/td><td>21<\/td><td>18<\/td><td>20<\/td><td>24<\/td><td>21<\/td><td>9<\/td><td>13<\/td><\/tr><tr><td>C<\/td><td>R<\/td><td>I<\/td><td>J<\/td><td>V<\/td><td>S<\/td><td>U<\/td><td>Y<\/td><td>V<\/td><td>J<\/td><td>N<\/td><\/tr><\/table><p class=\"ans\">Ответ в формате задачи: <code>RIJVSUYVJN<\/code><\/p><h3>Разбор: повтор гаммы<\/h3><p>m₂ = c₁ ⊕ c₂ ⊕ m₁ — гамма сокращается. Считаем побайтно (ASCII-коды — в условии задачи).<\/p><table><tr><th>Байт<\/th><th>c₁<\/th><th>c₂<\/th><th>m₁<\/th><th>c₁ ⊕ c₂ ⊕ m₁<\/th><\/tr><tr><td>1<\/td><td>CD<\/td><td>DD<\/td><td>53 (S)<\/td><td>43 → C<\/td><\/tr><tr><td>2<\/td><td>60<\/td><td>6E<\/td><td>41 (A)<\/td><td>4F → O<\/td><\/tr><tr><td>3<\/td><td>1D<\/td><td>1F<\/td><td>46 (F)<\/td><td>44 → D<\/td><\/tr><tr><td>4<\/td><td>81<\/td><td>81<\/td><td>45 (E)<\/td><td>45 → E<\/td><\/tr><\/table><p class=\"ans\">Ответ в формате задачи: <code>CODE<\/code><\/p>"}, {"id": "w7l2s2", "t": "dataset", "html": "<p><b>XOR байтов.<\/b> Во входных данных два двухбайтовых числа A и B в hex. Вычислите A ⊕ B побитно и запишите результат в hex (два байта через пробел).<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["A = D6 1C\nB = B2 D4", "64 C8"], ["A = C9 B1\nB = B7 EE", "7E 5F"], ["A = 7B DD\nB = 9F DF", "E4 02"]]}, {"id": "w7l2s3", "t": "dataset", "html": "<p><b>Взлом Цезаря.<\/b> Во входных данных фраза, зашифрованная шифром Цезаря над алфавитом «абвгдежзийклмнопрстуфхцчшщъыьэюя» (32 буквы, без «ё»; пробелы не шифруются): c = (m + k) mod 32. Найдите ключ k (0..31).<\/p><p>Подсказки: самая частая буква русского текста — «о»; однобуквенные слова — обычно «и», «в», «а».<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["эь эюцыдцэб шуюшсьввяо яаьчшьяак жцвюо тьщфыо ьэцюоакян аьщкшь ыо яушюуаыьяак шщмео о ыу ощсьюцаъо", "14"], ["умомцюэ иожнрмбоютжхгпиюэ яжяйжмргию жеяюайэгр номбоюккжпрю мр клмдгпраю мнюплщу мцжями а пмяпрагллмк имвг", "30"], ["эцшцаиз тшрчъцлшиьрянщтиз йрйурцънти рпйикузнъ чшцлшиффрщъи цъ фхцонщъки цчищхгэ царйцт к щцйщъкнххцф тцмн", "8"]]}, {"id": "w7l2s4", "t": "dataset", "html": "<p><b>Виженер вручную.<\/b> Во входных данных открытый текст P и ключ K (латиница, A = 0, …, Z = 25). Зашифруйте: Cᵢ = (Pᵢ + K<sub>i mod |K|<\/sub>) mod 26. Запишите шифртекст заглавными буквами.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["P = HANDSHAKE\nK = LEMON", "SEZRFSEWS"], ["P = HANDSHAKE\nK = CODE", "JOQHUVDOG"], ["P = FIREWALL\nK = RED", "WMUVADCP"]]}, {"id": "w7l2s5", "t": "dataset", "html": "<p><b>Повтор гаммы.<\/b> Два слова по 4 буквы зашифрованы XOR с <b>одной и той же<\/b> гаммой. Во входных данных шифртексты c1, c2 (hex) и первое слово m1. Найдите второе слово m2: m2 = c1 ⊕ c2 ⊕ m1.<\/p>\n<p>Коды ASCII (hex): A 41, B 42, C 43, D 44, E 45, F 46, G 47, H 48, I 49, J 4A, K 4B, L 4C, M 4D, N 4E, O 4F, P 50, Q 51, R 52, S 53, T 54, U 55, V 56, W 57, X 58, Y 59, Z 5A.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["c1 = 4F F3 92 A6\nc2 = 52 FD 90 A6\nm1 = SAFE", "NODE"], ["c1 = FD F8 AD 23\nc2 = E1 F8 BC 3C\nm1 = LOCK", "PORT"], ["c1 = DD 86 0D F3\nc2 = D2 9E 0A FD\nm1 = BYTE", "MASK"]]}]}, {"title": "Python: bytes, bytearray, Counter, файлы, secrets", "steps": [{"id": "w7l3s1", "t": "text", "html": "<h3>bytes и bytearray<\/h3>\n<pre><code>b = bytes([0x5A, 0x3C])        # неизменяемая последовательность байтов\nb[0]                            # 90 — элемент bytes есть int 0..255\nba = bytearray(b\"hello\")        # изменяемая\nba[0] ^= 0x20                   # можно менять на месте: b\"Hello\"\nbytes(ba)                       # обратно в bytes<\/code><\/pre>\n<h3>XOR двух последовательностей<\/h3>\n<pre><code>def xor_bytes(a, b):\n    return bytes(x ^ y for x, y in zip(a, b))   # zip обрезает по короткой!<\/code><\/pre>\n<p>zip молча обрезает длинную последовательность — для шифрования это ошибка. Проверяйте длины явно и бросайте <code>ValueError<\/code>. В Python 3.10+ можно написать <code>zip(a, b, strict=True)<\/code> — тогда zip сам бросит <code>ValueError<\/code> при разной длине.<\/p>\n<h3>Частоты: collections.Counter<\/h3>\n<pre><code>from collections import Counter\ncnt = Counter(\"абракадабра\")\ncnt.most_common(2)              # [('а', 5), ('б', 2)]<\/code><\/pre>\n<h3>Файлы<\/h3>\n<pre><code>with open(\"msg.txt\", \"rb\") as f:     # 'rb' — читать байты\n    data = f.read()\nwith open(\"msg.enc\", \"wb\") as f:     # 'wb' — записывать байты\n    f.write(ct)<\/code><\/pre>\n<p><code>with<\/code> сам закрывает файл даже при ошибке.<\/p>\n<h3>Ключи — только из secrets<\/h3>\n<pre><code>import secrets\nkey = secrets.token_bytes(32)          # 32 криптографически случайных байта\nsecrets.token_hex(16)                  # 32 hex-символа<\/code><\/pre>\n<h3>Битовые операции<\/h3>\n<pre><code>hex(0x5A ^ 0x3C)    # '0x66'  XOR: бит 1, если биты разные\nhex(0x57 &amp; 0x0F)    # '0x7'   AND: бит 1, если оба бита 1 (маска: оставить нужные биты)\nhex(0x50 | 0x07)    # '0x57'  OR: бит 1, если хотя бы один бит 1\nhex(0x57 &lt;&lt; 1)      # '0xae'  сдвиг влево на 1 = умножить на 2\nhex(0xAE &gt;&gt; 4)      # '0xa'   сдвиг вправо на 4 = целочисленно разделить на 16\n(0x57 &gt;&gt; 6) &amp; 1     # 1       бит номер 6 (бит 0 — младший)\nx ^= k              # то же, что x = x ^ k<\/code><\/pre>\n<p>Операции работают с целыми числами. Элемент <code>bytes<\/code> — тоже число 0..255, поэтому <code>b[0] ^ 0x20<\/code> работает. А <code>\"a\" ^ \"b\"<\/code> — ошибка <code>TypeError<\/code>: строку сначала переводят в байты <code>.encode()<\/code>.<\/p>"}, {"id": "w7l3s2", "t": "parsons", "html": "<p>Соберите программу, которая шифрует файл msg.txt одноразовым блокнотом и сохраняет шифртекст в msg.enc. Расставьте строки и отступы.<\/p><p>Здесь для краткости ключ не сохраняется. В настоящей программе его обязательно записывают (например, в msg.key) и передают получателю: без ключа расшифровать msg.enc нельзя.<\/p>", "lines": [[0, "import secrets"], [0, "with open(\"msg.txt\", \"rb\") as f:"], [1, "data = f.read()"], [0, "key = secrets.token_bytes(len(data))"], [0, "ct = bytes(x ^ y for x, y in zip(data, key))"], [0, "with open(\"msg.enc\", \"wb\") as f:"], [1, "f.write(ct)"]]}, {"id": "w7l3s3", "t": "code", "html": "<p><b>xor_bytes.<\/b> Напишите <code>xor_bytes(a, b)<\/code>: верните <code>bytes<\/code> — побайтовый XOR. Если длины различны — <code>ValueError<\/code> (не обрезайте молча!).<\/p>\n", "tpl": "def xor_bytes(a, b):\n    # ваш код\n    pass", "calls": [["xor_bytes(b'Z\\x17', b'<\\xf0')", "b'f\\xe7'", ""], ["xor_bytes(b'\\xff', b'\\xff')", "b'\\x00'", ""], ["xor_bytes(b'\\x00\\x11\"3', b'\\x00\\x11')", "исключение ValueError", ""], ["xor_bytes(b'hello', b'\\x00\\x00\\x00\\x00\\x00')", "b'hello'", ""], ["xor_bytes(b'\\x01\\x02', b'\\x01\\x02\\x03')", "исключение ValueError", ""]], "limits": "", "hints": ["Если <code>len(a) != len(b)<\/code> — <code>raise ValueError<\/code>: молча обрезать нельзя.", "После проверки длин <code>zip<\/code> безопасен: <code>bytes(x ^ y for x, y in zip(a, b))<\/code>.", "<pre><code>def xor_bytes(a, b):\n    if ...:\n        raise ValueError(&quot;разные длины&quot;)\n    return bytes(...)<\/code><\/pre>"]}, {"id": "w7l3s4", "t": "code", "html": "<p><b>Взлом Цезаря программой.<\/b> На вход — строка, зашифрованная шифром Цезаря над алфавитом <code>абвгдежзийклмнопрстуфхцчшщъыьэюя<\/code> (32 буквы, пробелы не шифруются). Выведите в первой строке ключ k (c = (m + k) mod 32), во второй — открытый текст.<\/p>\n<p>Считайте частоты с помощью <code>Counter<\/code> (только буквы, не пробелы) и считайте, что самая частая буква открытого текста — «о».<\/p>", "io": [["ылчу щикгув фзелжгих нгйзцб дцнец гочгелхг рг сзрс л хс йи ълфос тсклщлм тсахспц ижс оижнс екоспгхя згйи еуцърцб", "3\nшифр цезаря сдвигает каждую букву алфавита на одно и то же число позиций поэтому его легко взломать даже вручную"], ["опнснйнк налдмя йкэцялз онжбнкюдс гбтл рснпнмял гнвнбнпзсырю на нашдл рдйпдсд он нсйпъснлт йямякт рбюжз", "31\nпротокол обмена ключами позволяет двум сторонам договориться об общем секрете по открытому каналу связи"], ["злиюрщлзг злгйфлзьз гдчрщ изезьщюл мъюэблхкш рлз кзъюкюэжбг издмрбд беюжжз ыщс гдчр щ жю изээюдхжфв", "25\nотпечаток открытого ключа помогает убедиться что собеседник получил именно ваш ключ а не поддельный"]], "limits": "", "hints": ["Посчитайте частоты букв без пробелов: <code>Counter(c for c in text if c != \" \")<\/code>. Самая частая буква — образ «о».", "Номер буквы — <code>ALPHA.index(ch)<\/code>, где <code>ALPHA = \"абвгдежзийклмнопрстуфхцчшщъыьэюя\"<\/code>. Ключ k = (номер самой частой − номер «о») mod 32.", "<pre><code>from collections import Counter\nALPHA = &quot;абвгдежзийклмнопрстуфхцчшщъыьэюя&quot;\ntext = input()\ntop = Counter(c for c in text if c != &quot; &quot;).most_common(1)[0][0]\nk = (ALPHA.index(top) - ALPHA.index(&quot;о&quot;)) % 32\nplain = &quot;&quot;.join(c if c == &quot; &quot; else ALPHA[...] for c in text)\nprint(k)\nprint(plain)<\/code><\/pre>"]}]}, {"title": "Python: файлы — текст и байты", "steps": [{"id": "w7l4s1", "t": "text", "html": "<h3>Открыть, прочитать, закрыть<\/h3>\n<pre><code>with open(\"notes.txt\", \"r\", encoding=\"utf-8\") as f:   # текстовый режим\n    text = f.read()                # весь файл одной строкой\n# здесь файл уже закрыт — даже если внутри with была ошибка<\/code><\/pre>\n<table style=\"\">\n<tbody><tr style=\"background:#EEF2F6;\"><th style=\"padding:4px 10px;\">Режим<\/th><th style=\"padding:4px 10px;\">Что делает<\/th><th style=\"padding:4px 10px;\">Что возвращает read()<\/th><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>\"r\"<\/code><\/td><td style=\"padding:4px 10px;\">читать текст (по умолчанию)<\/td><td style=\"padding:4px 10px;\">str<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>\"w\"<\/code><\/td><td style=\"padding:4px 10px;\">записать текст, <b>стереть<\/b> старое содержимое<\/td><td style=\"padding:4px 10px;\">—<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>\"a\"<\/code><\/td><td style=\"padding:4px 10px;\">дописать в конец<\/td><td style=\"padding:4px 10px;\">—<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>\"rb\"<\/code> / <code>\"wb\"<\/code><\/td><td style=\"padding:4px 10px;\">читать / записать байты (шифртексты, ключи, картинки)<\/td><td style=\"padding:4px 10px;\">bytes<\/td><\/tr>\n<\/tbody><\/table>\n<p><b>Всегда указывайте <code>encoding=\"utf-8\"<\/code><\/b> в текстовом режиме. Без него Windows может прочитать файл в другой кодировке, и кириллица превратится в «кракозябры» или вызовет <code>UnicodeDecodeError<\/code>.<\/p>\n<h3>Построчно<\/h3>\n<pre><code>with open(\"log.txt\", encoding=\"utf-8\") as f:\n    for line in f:                 # файл — это последовательность строк\n        line = line.rstrip(\"\\n\")   # у каждой строки в конце \"\\n\"\n        if not line or line.startswith(\"#\"):\n            continue               # пустые строки и комментарии пропускаем\n        name, value = line.split(\";\")\n        print(name, int(value))<\/code><\/pre>\n<h3>Записать<\/h3>\n<pre><code>with open(\"out.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"строка 1\\n\")          # write не добавляет перевод строки сам\n    print(\"строка 2\", file=f)      # print в файл — добавляет\n\nwith open(\"msg.enc\", \"wb\") as f:\n    f.write(bytes([0x5A, 0x3C]))   # в бинарный файл пишут только bytes<\/code><\/pre>\n<h3>Короче — через pathlib<\/h3>\n<pre><code>from pathlib import Path\ndata = Path(\"photo.png\").read_bytes()\nPath(\"copy.png\").write_bytes(data)\ntext = Path(\"notes.txt\").read_text(encoding=\"utf-8\")\nPath(\"notes.txt\").exists()         # True / False<\/code><\/pre>\n<h3>Частые ошибки<\/h3>\n<ul>\n<li><code>FileNotFoundError<\/code> — неверный путь или программа запущена из другой папки.<\/li>\n<li><code>UnicodeDecodeError<\/code> — бинарный файл открыт в текстовом режиме, или забыли <code>encoding=\"utf-8\"<\/code>.<\/li>\n<li><code>TypeError: a bytes-like object is required, not 'str'<\/code> — в файл <code>\"wb\"<\/code> пишут строку. Нужно <code>.encode()<\/code>.<\/li>\n<li>Режим <code>\"w\"<\/code> по ошибке вместо <code>\"r\"<\/code> — файл стёрт. Делайте копии данных.<\/li>\n<\/ul>"}, {"id": "w7l4s2", "t": "choice", "html": "<p>Файл <code>log.txt<\/code> содержит одну строку <code>A<\/code>. Что в нём будет после программы?<\/p><pre><code>with open(\"log.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"B\")\nwith open(\"log.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"C\")<\/code><\/pre>", "opts": [["BC", true, "Верно: режим w стёр «A» и записал «B», режим a дописал «C»."], ["ABC", false, "Режим w стирает файл перед записью."], ["C", false, "Режим a дописывает в конец, а не перезаписывает."], ["B", false, "Второй with открыл файл в режиме a и дописал «C»."]]}, {"id": "w7l4s3", "t": "code", "html": "<p><b>Статистика файла.<\/b> Напишите функцию <code>file_stats(path)<\/code>: открыть текстовый файл (UTF-8) и вернуть кортеж <code>(строк, слов, букв)<\/code>. Строки — как их выдаёт <code>for line in f<\/code> (или <code>f.readlines()<\/code>): пустые строки в середине считаются, а перевод строки в самом конце файла новой строки не создаёт. Файл <code>\"x\\ny\\nz\\n\"<\/code> — 3 строки, файл <code>\"a\\n\\nb\"<\/code> — тоже 3 строки. Слова — части, разделённые пробельными символами (<code>split()<\/code>); буквы — символы, для которых <code>isalpha()<\/code> истинно.<\/p>\n<p>Файл создаёт проверочный код в конце заготовки: содержимое файла он берёт из строки ввода, где <code>\\n<\/code> означает перевод строки. Пример: файл из двух строк <code>Привет, мир!<\/code> и <code>Ключ 42<\/code> → <code>(2, 4, 13)<\/code>.<\/p>", "io": [["Привет, мир!\\nКлюч 42", "(2, 4, 13)"], ["a b c\\n\\nd e", "(3, 5, 5)"], ["  пробелы   вокруг  ", "(1, 2, 13)"]], "tpl": "def file_stats(path):\n    # ваш код\n    pass\n\n\n# --- проверочный код: не меняйте; запустите файл и введите строку из колонки «Ввод» ---\nimport sys as _sys, os as _os, tempfile as _tf\n_text = _sys.stdin.read().rstrip(\"\\n\").replace(\"\\\\n\", \"\\n\")\n_dir = _tf.mkdtemp()\n_p = _os.path.join(_dir, \"text.txt\")\nwith open(_p, \"w\", encoding=\"utf-8\") as _f:\n    _f.write(_text)\nprint(file_stats(_p))", "limits": ""}, {"id": "w7l4s4", "t": "code", "html": "<p><b>Сумма из файла с комментариями.<\/b> Файл (UTF-8) состоит из строк вида <code>имя;число<\/code>. Пустые строки и строки, начинающиеся с <code>#<\/code>, пропускаются; пробелы по краям строки и вокруг частей не важны. Напишите функцию <code>total(path)<\/code>: вернуть сумму всех чисел.<\/p>\n<pre><code># расходы\nключи;  120\nсертификат;300\n\nхостинг ; 80<\/code><\/pre>\n<p>Для этого файла ответ — 500. Файл создаёт проверочный код в конце заготовки: содержимое файла он берёт из строки ввода, где <code>\\n<\/code> означает перевод строки.<\/p>", "io": [["# расходы\\nключи;  120\\nсертификат;300\\n\\nхостинг ; 80", "500"], ["# только комментарий\\n\\n", "0"], ["a;7", "7"]], "tpl": "def total(path):\n    # ваш код\n    pass\n\n\n# --- проверочный код: не меняйте; запустите файл и введите строку из колонки «Ввод» ---\nimport sys as _sys, os as _os, tempfile as _tf\n_text = _sys.stdin.read().rstrip(\"\\n\").replace(\"\\\\n\", \"\\n\")\n_p = _os.path.join(_tf.mkdtemp(), \"data.txt\")\nwith open(_p, \"w\", encoding=\"utf-8\") as _f:\n    _f.write(_text)\nprint(total(_p))", "limits": ""}, {"id": "w7l4s5", "t": "code", "html": "<p><b>Зашифровать файл.<\/b> Напишите функцию <code>xor_file(src, dst, key)<\/code>: прочитать байты файла <code>src<\/code>, сделать XOR с повторяющимся ключом <code>key<\/code> (bytes) и записать результат в файл <code>dst<\/code>. Исходный файл не менять. Повторное применение с тем же ключом должно вернуть исходные байты.<\/p>\n<p>Проверочный код в конце заготовки читает строку «данные ключ» (оба в hex), записывает данные в файл, вызывает вашу функцию и печатает в hex содержимое нового файла.<\/p>", "io": [["48656c6c6f 2b", "634e474744\nисходный файл не изменён"], ["d09fd180d0b8d0b2d0b5d182 6b6579", "bbfaa8ebb5c1bbd7a9deb4fb\nисходный файл не изменён"], ["6d6f62616b 6d6f62616b", "0000000000\nисходный файл не изменён"]], "tpl": "def xor_file(src, dst, key):\n    # ваш код\n    pass\n\n\n# --- проверочный код: не меняйте; запустите файл и введите строку из колонки «Ввод» ---\nimport os as _os, tempfile as _tf\n_data, _key = (bytes.fromhex(_x) for _x in input().split())\n_d = _tf.mkdtemp()\n_src, _dst = _os.path.join(_d, \"in.bin\"), _os.path.join(_d, \"out.bin\")\nwith open(_src, \"wb\") as _f:\n    _f.write(_data)\nxor_file(_src, _dst, _key)\nwith open(_src, \"rb\") as _f:\n    _same = _f.read() == _data\nwith open(_dst, \"rb\") as _f:\n    print(_f.read().hex())\nprint(\"исходный файл не изменён\" if _same else \"ИСХОДНЫЙ ФАЙЛ ИЗМЕНЁН\")", "limits": ""}]}, {"title": "Python на своём компьютере", "steps": [{"id": "w7l5s1", "t": "text", "html": "<h3>Зачем<\/h3>\n<p>В задачах ЛР-4.1–4.3 данных много: их нужно сохранить в файл и обработать <b>своей<\/b> программой. Если до сих пор вы запускали код в онлайн-редакторе, поставьте Python на компьютер. Ставится один раз — пригодится до конца курса (на неделе 9 добавим к нему библиотеку <code>cryptography<\/code>).<\/p>\n<h3>1. Установить Python (один раз)<\/h3>\n<p><b>Windows.<\/b> python.org → Downloads → установщик Python 3.10 или новее. В первом окне <b>поставьте галочку «Add python.exe to PATH»<\/b>, затем «Install Now».<\/p>\n<p><b>macOS.<\/b> Установщик с python.org. В терминале команда называется <code>python3<\/code> (не <code>python<\/code>).<\/p>\n<p><b>Linux (Ubuntu/Debian).<\/b> <code>sudo apt install python3 python3-venv<\/code>.<\/p>\n<h3>2. Терминал и папка курса<\/h3>\n<p>Windows: Пуск → «Терминал» (или «PowerShell»). macOS: Программы → Утилиты → «Терминал». Команды вводятся по одной, после каждой — Enter.<\/p>\n<pre><code>python --version     # Windows; на macOS/Linux: python3 --version → 3.10 или новее\nmkdir mobak          # создать папку для программ курса (один раз)\ncd mobak             # перейти в неё — все команды дальше выполняйте отсюда<\/code><\/pre>\n<p>Windows пишет «python не является командой» или открывает Microsoft Store — значит, Python поставлен без галочки PATH. Переустановите с галочкой или пишите <code>py<\/code> вместо <code>python<\/code>.<\/p>"}, {"id": "w7l5s2", "t": "text", "html": "<h3>3. Написать и запустить программу<\/h3>\n<p>Редактор — IDLE (ставится вместе с Python) или VS Code. Сохраните программу как <code>lab.py<\/code> в папку <code>mobak<\/code> и запустите из терминала:<\/p>\n<pre><code>python lab.py        # macOS/Linux: python3 lab.py<\/code><\/pre>\n<p>В IDLE можно и без терминала: File → Save (в папку <code>mobak<\/code>), затем Run → Run Module (F5).<\/p>\n<p><b>Файл с данными.<\/b> Нажмите «Копировать» над данными задачи, вставьте их в новый файл в папке <code>mobak<\/code>, сохраните его как <code>data.txt<\/code> в кодировке UTF-8 и читайте через <code>open(\"data.txt\", encoding=\"utf-8\")<\/code>. <code>FileNotFoundError<\/code> — файл не в той папке, из которой вы запускаете программу.<\/p>\n<h3>Как прочитать данные<\/h3>\n<pre><code>with open(\"data.txt\", encoding=\"utf-8\") as f:\n    text = f.read()                 # весь файл одной строкой\nprint(text[:200])                   # посмотреть начало файла\n\nwith open(\"data.txt\", encoding=\"utf-8\") as f:\n    nums = [int(line) for line in f if line.strip()]   # по числу в строке\nprint(len(nums), sum(nums))\n\nlines = text.splitlines()           # строки вида «key = 3fa1…»\nkey = bytes.fromhex(lines[0].split(\"=\")[1].strip())<\/code><\/pre>\n<p><b>Порядок работы с задачей на данные:<\/b> напишите программу и проверьте её на маленьком файле, который сделали сами (например, из примера в условии). Только потом запускайте её на данных задачи.<\/p>"}, {"id": "w7l5s3", "t": "dataset", "html": "<p><b>Проверка: Python работает.<\/b> Во входных данных 2000 целых чисел, по одному в строке. Найдите сумму их квадратов x₁² + x₂² + … + x₂₀₀₀² и запишите одно число.<\/p>\n<p>Вручную это не решить: напишите программу, которая читает числа из файла <code>data.txt<\/code>. Сначала проверьте её на своём файле из трёх чисел (1, 2, 3 → 14), затем скопируйте данные ниже в <code>data.txt<\/code>.<\/p>\n<p class=\"note\">💻 Задача с данными: напишите программу, которая обрабатывает данные ниже, и получите ответ.<\/p>", "data": [["54864\n66676\n65629\n а своём компьютере» выше): сохраните файл с данными рядом с программой и прочитайте его через <code>open<\/code>. Сначала отладьте программу на примере из условия.<\/p>\n<p><b>Нужные функции:<\/b> <code>bytes.fromhex<\/code>, <code>.hex()<\/code>, <code>.encode(\"utf-8\")<\/code>, <code>.decode(\"utf-8\")<\/code>, ваш <code>xor_bytes<\/code>.<\/p>\n<p>⭐ — задача повышенной сложности (расширение).<\/p>"}, {"id": "w7l6s2", "t": "dataset", "html": "<p><b>ЛР-4.1. Расшифровка OTP.<\/b> Во входных данных ключ <code>key<\/code> и шифртекст <code>ct<\/code> в hex. Открытый текст — русская фраза в UTF-8. Расшифруйте и запишите фразу.<\/p><p class=\"note\">💻 Задача с данными: напишите программу, которая обрабатывает данные ниже, и получите ответ.<\/p>", "data": [["key = 1cb2d4e3febf88cdff76eb1bb8da034b1ccf0c055f9ad43759ff9faf9fa7aa7831363c8ff0b9087ccd2548b5b91dcf4dcfda0225150ca7551800ff0d10f9fa37a687b13c9b8c69f0d0e358df2fe799f940a5bfbb5ad0634119bf3c100738ffc9ff307021cf7831f2f9daf19126eeeb3e07c316035c68fc713fd7c38951dc6f02e576c37b097dffe8a61657bbd65d65671a8c1830d45a6ed0e5e18fd671a88ecac125f888943cc6ca030470226b8e0e7cffa73fb9670e7027a9daa7b21032b3cc59665d38c48df41781\nct = cd37045d2f3f58732efe3bab6955239ba61e8cd5e74a6be6db2f217f2c762aa881e7b85f48688fac78f4c96503cd7f9c40fad294c5b477e4c8bb2fb5c0472bb5763261864b3c49206833ef0f9e372929f275046ad500d6909b9fecafd6b82f772f83a1a11fc8e14e29662129f76f3abcd77336d3e2b97e51ef6b13348162bfb435c312fad8ff2f5a76a6776b688ddab7aa5d99e0698be50160c15f68a0205e72119428364486e61ab124a1a3bb30decd2e26ee3bb7bca0927967770fc08c637079b6e7e87a5d40c734", "хорошая криптографическая библиотека избавляет программиста от множества опасных ошибок в собственном коде"], ["key = b1b7ee6840d26d76df5085fb80952b18ebe392adf853c9aac1c14ea4f041756bd87912ea05cc78781426fc4cb1574841b47c10ea2141824da52e8a8fad6c25a4b2976f0620af40f241acfa1b9f9c2bce227aed3a9fe7dd092f24b12fb97bcf530ba3f06b120baeffe247daf2e27034b1127d9f0cab161ed0f6d339f1607a25cc62d444a9ee0dcacc732acf293dafef9afe1442fe7be6f24a3bd96f80a04abe720c9fb66b1c3e1d192d74e1e96cdf8ab1fe4f97adfa15f85619c78c59f5d5a502912f5d2aeefc263051\nct = 60323ed69152bdc80ed8554b511a0bc85132127d4083767b4311f0744390f5bb68a8963abd1dffa8a1f77d9c0b87f8903b5cc05bf1f952fc75955a377dd2f4266222bfbcf01f6022f97c4dcb2e4c9b1e90aa56eb103768d8ad04619068fb1feddb1021ebc2bb7e4332fb0a4a33f1e533c2cdbfdc15c79cf0266fe94cb0c4f57ab26195283f8f1a7ea39aeff9837f504a4ec5c32ec637799bbef9bf3e71c26ecadc2e66d5cc843dc99f543068bc615a002fce462f2aa728e3c97a5ce4256b75beb1ffe7fa502c92e0e4", "хорошая криптографическая библиотека избавляет программиста от множества опасных ошибок в собственном коде"], ["key = dd9fdf59b699e6d041cb664f47ccd5c6876144248762afdaec3bf69456607a61934ca82b6d0248289948f3deae0485cd7ff592678e5a7e76070e2a4db71dba5aa7b541dc9d5d45002391a60d287794a62435a0f803cdfef8a6c76b5fe3c6dca845563d932b0ac1bd090919d914ff940bc8224ed6b111b0755c736a0973cbbf6021ba4e2a865734845edf91f08e05bb693221897a7e7ac03786ccd9dd26202494b2f66923455d91e740fbd32c7655270c7bcaa2ce27e04bd0230a33491f8234c039bb0cc481c95f38d5141eeda42bcb8ff996bca5f1defb3ebb1e2ee13336\nct = 0d200fe7662b37529175b7cf9771057857d464f43fb32e0a53eb4844edb1f6b1249c16fbdfd2f8f824984b0e1b245577af4e43e95fddaec627de959d09cc388a1965fb0c238df7d09d4115dd9657452ef48d717cd24d2e488617d48f5d166b78f786834390db4e6dbcd89bf9c440458b189c9f5461a960c78ccebab1a3716ee3016af1fa38878f55dd0e162036d439b8be0158fbaff9108b5670085e06f09b440cd6b99f95e3415391780397a7db07dccf1a101e97c09b64f3b8e2cace071410876a8e143b18dfe95ec59c3c2ffa4eaf28146c1021642abf6a9cfe5fe384", "повторное использование ключа потокового шифра позволяет противнику получить сумму по модулю два двух открытых текстов"]], "hints": ["<code>bytes.fromhex(...)<\/code> превращает hex-строку в байты. Открытый текст = ct ⊕ key (схема XOR в теории).", "Получившиеся байты — UTF-8: <code>.decode(\"utf-8\")<\/code> даст русскую фразу. Если ключ длиннее шифртекста, возьмите <code>key[:len(ct)]<\/code>.", "<pre><code>key = bytes.fromhex(&quot;...&quot;)\nct = bytes.fromhex(&quot;...&quot;)\npt = bytes(x ^ y for x, y in zip(ct, key))\nprint(pt.decode(&quot;utf-8&quot;))<\/code><\/pre>"]}, {"id": "w7l6s3", "t": "dataset", "html": "<p><b>ЛР-4.2. Two-time pad.<\/b> Два английских сообщения зашифрованы XOR с <b>одной и той же<\/b> гаммой. Во входных данных c1, c2 (hex) и известное первое сообщение m1 (ASCII). Найдите второе сообщение m2 (оно не длиннее m1).<\/p>\n<p>Обычно m2 короче m1, поэтому c2 короче c1. Ваш <code>xor_bytes<\/code> справедливо бросит <code>ValueError<\/code> — обрежьте сами: <code>n = len(c2)<\/code>, затем <code>xor_bytes(xor_bytes(c1[:n], c2), m1[:n])<\/code>.<\/p><p class=\"note\">💻 Задача с данными: напишите программу, которая обрабатывает данные ниже, и получите ответ.<\/p>", "data": [["c1 = f3b88a9ddaa8ac9112cb59d7b8232a7bbd69603bbabb59799ebfdcfac4d81d45\nc2 = ffb1868a9fe5a8df179f3bccb2666b70a66e773ee8ad17388bbfc1f0c8c4\nm1 = Alice and Bob agreed on a secret", "Meet me at the library at noon"], ["c1 = 2f04b63ee2dbf9fa5e6acb8ff3dd8c3cb98ab5ae6ed098245507b91b329960bf0b117b48\nc2 = 2613ba20a58fe8fc58388686e1de9934ac8aa0b62fddd0270704b559579c60\nm1 = Bring your laptop to the lab session", "Keep this message away from Eve"], ["c1 = 16c3ebc6a324b9102a35eca2a7f4413445f301c7bf881b9af525145a0ffa2bc05f\nc2 = 12d3fc96f035a30f3c67a1b0b5f4002341a703d8bb951b90e6390d5a24e529\nm1 = Our server was patched last night", "Keep this message away from Eve"]], "hints": ["c₁ ⊕ c₂ = m₁ ⊕ m₂ (схема «Почему одноразовый ключ нельзя использовать дважды»). Значит, m₂ = c₁ ⊕ c₂ ⊕ m₁.", "m₁ — ASCII-строка: <code>m1.encode()<\/code>. m₂ не длиннее m₁, поэтому XOR трёх последовательностей через <code>zip<\/code> по длине c₂ — то, что нужно.", "<pre><code>c1 = bytes.fromhex(&quot;...&quot;)\nc2 = bytes.fromhex(&quot;...&quot;)\nm1 = &quot;...&quot;.encode()\nm2 = bytes(x ^ y ^ z for x, y, z in zip(c1, c2, m1))\nprint(m2.decode())<\/code><\/pre>"]}, {"id": "w7l6s4", "t": "dataset", "html": "<p><b>ЛР-4.3. Повторяющийся XOR-ключ и известное начало.<\/b> Сообщение зашифровано XOR с коротким ключом из заглавных латинских букв, повторённым по длине сообщения. Известно, что сообщение начинается с <code>MESSAGE: <\/code> (9 символов, с пробелом в конце). Найдите ключ и расшифруйте сообщение. Формат ответа: <code>КЛЮЧ; сообщение целиком<\/code><\/p><p>Подсказка: XOR первых 9 байтов шифртекста с известным началом даёт начало гаммы — в ней ключ повторяется.<\/p><p class=\"note\">💻 Задача с данными: напишите программу, которая обрабатывает данные ниже, и получите ответ.<\/p>", "data": [["0f091c100a050975630a2e252c266b23222b63092d2e6f222c30292a276b2d226f226b31292c312e36", "BLOCK; MESSAGE: Alice and Bob agreed on a secret"], ["0f091c100a0509756309302521246b3b233a316b2e2d3f3724326c3b2c6b36242a6327232e6f302e313f262c25", "BLOCK; MESSAGE: Bring your laptop to the lab session"], ["030a1d1004090a74630e2b2a3e633126263d63282b3c3d22222b6f2f3424376f28312a236f0b3520", "NONCE; MESSAGE: Keep this message away from Eve"]], "hints": ["Первые 9 байт шифртекста ⊕ <code>b\"MESSAGE: \"<\/code> = первые 9 байт гаммы. В них ключ повторяется, например <code>BLOCKBLOC<\/code>.", "Длина ключа L — наименьший период гаммы: <code>gamma[i] == gamma[i - L]<\/code> для всех i ≥ L. Ключ — <code>gamma[:L]<\/code>. Расшифровка всего текста: <code>ct[i] ^ key[i % L]<\/code>.", "<pre><code>ct = bytes.fromhex(&quot;...&quot;)\ngamma = bytes(x ^ y for x, y in zip(ct, b&quot;MESSAGE: &quot;))\nL = 1\nwhile any(gamma[i] != gamma[i - L] for i in range(L, len(gamma))):\n    L += 1\nkey = gamma[:L]\npt = bytes(ct[i] ^ key[i % L] for i in range(len(ct)))\nprint(key.decode() + &quot;; &quot; + pt.decode())<\/code><\/pre>"]}, {"id": "w7l6s5", "t": "code", "html": "<p><b>ЛР-4.4. repeating_xor.<\/b> Напишите <code>repeating_xor(data, key)<\/code>: XOR данных с ключом, повторённым по длине данных; вернуть <code>bytes<\/code>. Пустой ключ — <code>ValueError<\/code>.<\/p>\n<p>Пример (строки кодируются в UTF-8, результат показан в hex): ключ <code>ICE<\/code>, сообщение <code>Burning 'em, if you ain't quick and nimble<\/code> → начинается с <code>0b3637272a2b2e63622c<\/code>.<\/p>", "tpl": "def repeating_xor(data, key):\n    # ваш код\n    pass", "calls": [["repeating_xor(b\"Burning 'em, if you ain't quick and nimble\", b'ICE')", "b'\\x0b67\\'*+.cb,.ii*#i:*<c$ -b=c4<*&\"c$\\'\\'e\\'*(+/ '", ""], ["repeating_xor(b'hello', b'K')", "b\"#.''$\"", ""], ["repeating_xor(b'\\xd0\\xbf\\xd1\\x80\\xd0\\xb8\\xd0\\xb2\\xd0\\xb5\\xd1\\x82, \\xd0\\xbc\\xd0\\xb8\\xd1\\x80', b'\\xd1\\x81\\xd0\\xb5\\xd0\\xba\\xd1\\x80\\xd0\\xb5\\xd1\\x82')", "b'\\x01>\\x015\\x00\\x02\\x012\\x00\\x00\\x00\\x00\\xfd\\xa1\\x00\\t\\x00\\x02\\x00\\x00'", ""], ["repeating_xor(b'hi', b'LONGKEY123')", "b'$&'", ""], ["repeating_xor(b'anything', b'')", "исключение ValueError", ""], ["repeating_xor(b'ABABABAB', b'AB')", "b'\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00'", ""]], "limits": "", "hints": ["Пустой ключ — <code>raise ValueError<\/code>.", "i-й байт результата: <code>data[i] ^ key[i % len(key)]<\/code> — ключ повторяется по кругу.", "<pre><code>def repeating_xor(data, key):\n    if len(key) == 0:\n        raise ValueError(&quot;пустой ключ&quot;)\n    return bytes(... for i in range(len(data)))<\/code><\/pre>"]}, {"id": "w7l6s6", "t": "code", "html": "<p><b>ЛР-4.5. Расшифрование Виженера.<\/b> Напишите <code>vigenere_decrypt(text, key)<\/code> для латиницы. Буквы A–Z и a–z сдвигаются назад на соответствующую букву ключа (ключ — латинские буквы, регистр ключа не важен), регистр буквы сохраняется. Остальные символы не меняются и <b>не расходуют<\/b> букву ключа.<\/p>\n<p>Пример: <code>LXFOPVEFRNHR<\/code>, ключ <code>LEMON<\/code> → <code>ATTACKATDAWN<\/code>.<\/p>", "tpl": "def vigenere_decrypt(text, key):\n    # ваш код\n    pass", "calls": [["vigenere_decrypt('LXFOPVEFRNHR', 'LEMON')", "'ATTACKATDAWN'", ""], ["vigenere_decrypt('Kxrkgi kx bkal, dlcx vcdvckx!', 'key')", "'Attack at dawn, then retreat!'", ""], ["vigenere_decrypt('Gdkkn, Vnqkc', 'Z')", "'Hello, World'", ""], ["vigenere_decrypt('Vyc dgs vzkt iof: eckxf tvshx hjv itr. 2026', 'CRYPTO')", "'The one time pad: never reuse the key. 2026'", ""], ["vigenere_decrypt('Unchanged text', 'a')", "'Unchanged text'", ""]], "limits": "", "hints": ["Держите отдельный счётчик j — сколько букв уже расшифровано: небуквы ключ не расходуют.", "Для буквы: база <code>ord('A')<\/code> или <code>ord('a')<\/code> по регистру; сдвиг <code>s = ord(key[j % len(key)].upper()) - ord('A')<\/code>; буква <code>chr((ord(ch) - base - s) % 26 + base)<\/code>; затем <code>j += 1<\/code>.", "<pre><code>def vigenere_decrypt(text, key):\n    out, j = [], 0\n    for ch in text:\n        if ch.isascii() and ch.isalpha():\n            base = ord(&#x27;A&#x27;) if ch.isupper() else ord(&#x27;a&#x27;)\n            s = ...\n            out.append(chr(...))\n            j += 1\n        else:\n            out.append(ch)\n    return &quot;&quot;.join(out)<\/code><\/pre>"]}, {"id": "w7l6s7", "t": "code", "html": "<p><b>⭐ ЛР-4.6. Взлом Виженера при известной длине ключа.<\/b> На вход: длина ключа L, затем шифртекст (только заглавные латинские буквы; открытый текст — английский). Выведите ключ заглавными буквами.<\/p>\n<p>Разбейте текст на L столбцов (<code>ct[j::L]<\/code>). Для каждого столбца переберите 26 сдвигов и выберите тот, при котором частоты расшифрованного столбца ближе всего к английским по статистике χ² = Σ (наблюдаемое − ожидаемое)² / ожидаемое. Правило «самая частая буква — E» на части тестов ошибается.<\/p>\n<pre><code>FREQ = {\"A\": 8.2, \"B\": 1.5, \"C\": 2.8, \"D\": 4.3, \"E\": 12.7, \"F\": 2.2, \"G\": 2.0, \"H\": 6.1, \"I\": 7.0,\n        \"J\": 0.15, \"K\": 0.8, \"L\": 4.0, \"M\": 2.4, \"N\": 6.7, \"O\": 7.5, \"P\": 1.9, \"Q\": 0.1, \"R\": 6.0,\n        \"S\": 6.3, \"T\": 9.1, \"U\": 2.8, \"V\": 1.0, \"W\": 2.4, \"X\": 0.15, \"Y\": 2.0, \"Z\": 0.07}   # в процентах<\/code><\/pre>", "io": [["1\nXETMQIUDEKWXRKJXYIJEHOIXEMIJXQJULUHOIUSHUJQBWEHYJXCYIULUDJKQBBOHULUQBUTCETUHDSHOFJEWHQFXOVEBBEMIJXUFHYDSYFBUIJQJUTROAUHSAXEVVIJXUUDUCOADEMIJXUIOIJUCQDTEDBOJXUAUOCKIJHUCQYDIUSHUJJXULYWUDUHUSYFXUHMQISQBBUTJXUYDTUSYFXUHQRBUSYFXUHVEHJXHUUSUDJKHYUIYJKIUIQIXEHJAUOMEHTQDTIXYVJIULUHOBUJJUHEVJXUCUIIQWUROJXULQBKUEVJXUSEHHUIFEDTYDWAUOBUJJUHMXUDJXUAUOYIIXEHJUHJXQDJXUCUIIQWUYJHUFUQJIQDTJXYIHUFUJYJYEDWYLUIJXUQJ", "Q"]], "limits": "", "hints": ["Столбец j — буквы <code>ct[j::L]<\/code>; каждый столбец зашифрован Цезарем со своим сдвигом (буквой ключа).", "Для каждого из 26 сдвигов расшифруйте столбец и посчитайте χ² = Σ (наблюдаемое − ожидаемое)² / ожидаемое по 26 буквам, где ожидаемое = частота буквы в английском × длина столбца. Лучший сдвиг — с наименьшим χ²; буква ключа — <code>chr(сдвиг + ord('A'))<\/code>.", "Частоты английских букв A…Z, %: <pre><code>ENG = [8.167, 1.492, 2.782, 4.253, 12.702, 2.228, 2.015, 6.094, 6.966, 0.153, 0.772, 4.025, 2.406,\n       6.749, 7.507, 1.929, 0.095, 5.987, 6.327, 9.056, 2.758, 0.978, 2.360, 0.150, 1.974, 0.074]<\/code><\/pre>"]}]}]}, {"n": 8, "title": "Неделя 8. Конечные поля GF(2^m) и устройство AES", "lessons": [{"title": "Поля GF(2^m), байт как многочлен, раунд AES", "steps": [{"id": "w8l1s1", "t": "text", "html": "<h3>Зачем AES считает «многочленами»<\/h3>\n<p>AES работает с байтами. Нужна арифметика, в которой байты можно складывать, умножать и <b>делить<\/b> (S-box строится из обратных элементов), и результат снова байт. Обычное умножение по модулю 256 не подходит: 256 не простое, у чётных байтов нет обратного (как в Z₈ на неделе 4). Поле из 256 элементов существует, но устроено иначе: его элементы — многочлены.<\/p><p style=\"text-align:center;\"><img alt=\"Байт 0x57 и соответствующий ему многочлен x в шестой плюс x в четвёртой плюс x в квадрате плюс x плюс 1\" src=\"/media/attachments/lesson/2612748/w08_byte_poly.png\" style=\"height:auto;\"><\/p>\n<ul>\n<li><b>Сложение<\/b> — XOR. Коэффициенты складываются по модулю 2, переносов нет: 1 + 1 = 0.<\/li>\n<li><b>Вычитание<\/b> совпадает со сложением: −1 = 1 по модулю 2.<\/li>\n<li><b>Умножение<\/b> — «в столбик», но промежуточные строки складываются через XOR, а не обычным сложением.<\/li>\n<li>Если степень стала 8 и больше, берут остаток от деления на неприводимый многочлен x⁸ + x⁴ + x³ + x + 1 (0x11B). Это роль простого p из GF(p).<\/li>\n<\/ul>"}, {"id": "w8l1s2", "t": "widget", "kind": "gf", "html": ""}, {"id": "w8l1s3", "t": "text", "html": "<h3>Разбор: умножение в GF(2³) столбиком<\/h3>\n<p>Поле GF(2³) с модулем x³ + x + 1 (1011₂). Умножим 101 · 011, то есть (x² + 1)(x + 1).<\/p>\n<table style=\"text-align:right;\">\n<tbody><tr style=\"background:#EEF2F6;\"><th style=\"padding:4px 10px;\">Шаг<\/th><th style=\"padding:4px 10px;\">Биты<\/th><th style=\"padding:4px 10px;\">Что делаем<\/th><\/tr>\n<tr><td style=\"padding:4px 10px;\">101 · 1<\/td><td style=\"padding:4px 10px;\">0101<\/td><td style=\"padding:4px 10px;\">младший бит множителя 1 — берём 101<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">101 · x<\/td><td style=\"padding:4px 10px;\">1010<\/td><td style=\"padding:4px 10px;\">следующий бит 1 — берём 101, сдвинутое на 1<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">XOR<\/td><td style=\"padding:4px 10px;\">1111<\/td><td style=\"padding:4px 10px;\">x³ + x² + x + 1 — степень 3, надо привести<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">⊕ модуль<\/td><td style=\"padding:4px 10px;\">1011<\/td><td style=\"padding:4px 10px;\">вычитаем (XOR) x³ + x + 1<\/td><\/tr>\n<tr style=\"background:#FDF1DC;\"><td style=\"padding:4px 10px;\">ответ<\/td><td style=\"padding:4px 10px;\"><b>0100<\/b><\/td><td style=\"padding:4px 10px;\">x², то есть 101 · 011 = 100<\/td><\/tr>\n<\/tbody><\/table>\n<p>Сравните с обычным умножением 5 · 3 = 15 = 1111₂: в GF(2³) те же частичные произведения, но вместо сложения XOR и затем приведение.<\/p>"}, {"id": "w8l1s4", "t": "text", "html": "<h3>xtime — умножение на x<\/h3><p style=\"text-align:center;\"><img alt=\"Цепочка xtime: 57, AE, 47, 8E, 07 побитно\" src=\"/media/attachments/lesson/2612748/w08_xtime.png\" style=\"height:auto;\"><\/p>\n<p>Умножить на x (байт 02) — значит сдвинуть биты влево. Если старший бит был 1, получился x⁸, а он в байт не помещается. Заменяем его на остаток: x⁸ ≡ x⁴ + x³ + x + 1, то есть XOR с 0x1B.<\/p>\n<p><b>Любое умножение<\/b> собирается из xtime и XOR. Пример из стандарта: {57}·{13}, 13 = 10 ⊕ 02 ⊕ 01, поэтому {57}·{13} = {57}·{10} ⊕ {57}·{02} ⊕ {57} = 07 ⊕ AE ⊕ 57 = FE. Значения {57}·{02} = AE и {57}·{10} = 07 берутся прямо из цепочки на картинке (четыре xtime — это умножение на 10₁₆ = x⁴).<\/p>"}, {"id": "w8l1s5", "t": "text", "html": "<h3>Раунд AES<\/h3><p style=\"text-align:center;\"><img alt=\"Матрица 4 на 4 проходит SubBytes, ShiftRows, MixColumns и AddRoundKey\" src=\"/media/attachments/lesson/2612748/w08_aes_round.png\" style=\"height:auto;\"><\/p>\n<ul>\n<li><b>SubBytes<\/b> даёт <i>запутывание<\/i> (confusion): связь между ключом и шифртекстом становится нелинейной. Без него весь AES был бы системой линейных уравнений, которую решают за секунды.<\/li>\n<li><b>ShiftRows<\/b> и <b>MixColumns<\/b> дают <i>рассеивание<\/i> (diffusion). ShiftRows разносит байты столбца по разным столбцам, MixColumns смешивает байты внутри столбца. Через два раунда каждый байт зависит от всех 16 байтов входа.<\/li>\n<li><b>AddRoundKey<\/b> — единственное место, где участвует ключ.<\/li>\n<\/ul>\n<p><b>Линейная<\/b> (точнее, аффинная) операция — каждый бит результата равен XOR некоторых битов входа и, может быть, константы 1. Таковы XOR с ключом, перестановка байтов (ShiftRows) и MixColumns: «умножить столбец на матрицу» значит вычислить b0 = 02·a0 ⊕ 03·a1 ⊕ a2 ⊕ a3 и ещё три такие формулы. Обращение a ↦ a⁻¹ в GF(2⁸) так не записывается — поэтому S-box нелинеен.<\/p>\n<p>В AES-128 таких раундов 10; перед первым — ещё один AddRoundKey, в последнем нет MixColumns. Практических атак на полный AES нет: лучшая известная атака на все 10 раундов AES-128 (biclique, 2011) всего примерно в 4 раза быстрее полного перебора 2<sup>128<\/sup>, то есть ничего не меняет. Заметно быстрее перебора ломаются только версии с уменьшенным числом раундов.<\/p>"}, {"id": "w8l1s6", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Чему равна сумма {53} + {CA} в GF(2⁸)?<\/p>", "opts": [["{99}", true, "Верно: сложение — XOR, 0x53 ⊕ 0xCA = 0x99."], ["{11D}", false, "Это обычная сумма 0x53 + 0xCA. В GF(2⁸) переносов нет: складываем через XOR."], ["{01}", false, "{53}·{CA} = {01} — это произведение (они взаимно обратны), а не сумма."], ["{1D}", false, "Проверьте XOR побитно: 01010011 ⊕ 11001010."]]}, {"id": "w8l1s7", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Чему равно xtime({80})?<\/p>", "opts": [["{1B}", true, "Верно: 0x80 сдвигается в 0x100, старший бит выходит, XOR с 0x11B даёт 0x1B."], ["{00}", false, "Сдвиг без приведения дал бы 0x100, и бит потерялся бы. В поле x⁸ заменяется на 0x1B."], ["{100}", false, "Результат должен быть байтом: x⁸ приводится по модулю 0x11B."], ["{40}", false, "Это сдвиг вправо. xtime сдвигает влево."]]}, {"id": "w8l1s8", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Какая операция раунда AES единственная нелинейная?<\/p>", "opts": [["SubBytes", true, "Верно: S-box построен из обращения в GF(2⁸). Остальные операции линейны."], ["MixColumns", false, "MixColumns — умножение на матрицу, это линейная операция."], ["ShiftRows", false, "ShiftRows только переставляет байты."], ["AddRoundKey", false, "XOR с ключом — сдвиг на константу, нелинейности он не добавляет."]]}, {"id": "w8l1s9", "t": "text", "html": "<h3>Частые ошибки<\/h3>\n<ul>\n<li><b>Складывают байты обычным +.<\/b> В GF(2⁸) сложение — только XOR.<\/li>\n<li><b>Делают XOR с 0x11B после сдвига всегда.<\/b> Только когда старший бит до сдвига был 1. В коде: <code>b &lt;&lt;= 1; if b &amp; 0x100: b ^= 0x11B<\/code>.<\/li>\n<li><b>Обрезают <code>&amp; 0xFF<\/code> и забывают про 0x1B.<\/b> <code>(b &lt;&lt; 1) &amp; 0xFF<\/code> просто теряет x⁸, а его нужно заменить на 0x1B. Верно так: <code>b &lt;&lt;= 1; if b &amp; 0x100: b ^= 0x11B<\/code> или <code>((b &lt;&lt; 1) &amp; 0xFF) ^ (0x1B if b &amp; 0x80 else 0)<\/code>. Без приведения в Python получится число больше 255.<\/li>\n<li><b>Путают 0x11B и 0x1B.<\/b> 0x11B — модуль целиком (9 бит). 0x1B — то, что прибавляется к байту после выхода бита x⁸.<\/li>\n<li><b>Пишут свой AES для реальных данных.<\/b> Только библиотека: самодельная реализация почти наверняка уязвима к атакам по времени.<\/li>\n<\/ul>\n<p>Ниже — краткий конспект темы.<\/p>"}, {"id": "w8l1s10", "t": "text", "html": "<h3>Многочлены над GF(2)<\/h3>\n<p>Коэффициенты — биты 0 и 1, арифметика коэффициентов — по модулю 2. Многочлен удобно хранить как число: x<sup>2<\/sup> + 1 ↔ 101₂ = 5, x + 1 ↔ 011₂ = 3.<\/p>\n<ul>\n<li><b>Сложение<\/b> — XOR коэффициентов: (x<sup>2<\/sup> + 1) + (x + 1) = x<sup>2<\/sup> + x ↔ 101 ⊕ 011 = 110. Вычитание совпадает со сложением.<\/li>\n<li><b>Умножение<\/b> — «в столбик», но складываем через XOR (без переносов).<\/li>\n<li><b>Приведение<\/b> — остаток от деления на фиксированный <b>неприводимый<\/b> многочлен (не раскладывается в произведение многочленов меньшей степени — аналог простого числа).<\/li>\n<\/ul>\n<h3>Поле GF(2<sup>3<\/sup>)<\/h3>\n<p>Элементы — 8 многочленов степени &lt; 3 (числа 0..7), модуль x<sup>3<\/sup> + x + 1 (1011₂). Пример: (x<sup>2<\/sup> + 1)(x + 1) = x<sup>3<\/sup> + x<sup>2<\/sup> + x + 1. Так как x<sup>3<\/sup> ≡ x + 1, получаем (x + 1) + x<sup>2<\/sup> + x + 1 = x<sup>2<\/sup>. В битах: 101 · 011 = 100.<\/p>\n<p>Модуль неприводим, поэтому у каждого ненулевого элемента есть обратный — это <b>поле<\/b>. С приводимым модулем (например, x<sup>3<\/sup> + 1) получилось бы кольцо с делителями нуля — как Z_n при составном n.<\/p>\n<h3>Поле GF(2<sup>8<\/sup>) в AES<\/h3>\n<p>Байт b₇…b₀ — многочлен b₇x<sup>7<\/sup> + … + b₀. Модуль AES: x<sup>8<\/sup> + x<sup>4<\/sup> + x<sup>3<\/sup> + x + 1 = <b>0x11B<\/b>.<\/p>\n<p><b>xtime<\/b> — умножение на x (байт 02): сдвиг влево на 1; если вышел бит 8 (результат ≥ 0x100), XOR с 0x11B. Цепочка из FIPS-197: 57 → AE → 47 → 8E → 07.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 420 225\" width=\"420\" style=\"min-width:302px\" role=\"img\" aria-label=\"xtime(b) — умножение на x: сдвиг влево; если вышел старший бит, XOR с 1B. AE → 47\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-xt\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><text x=\"130\" y=\"30\" class=\"s-t s-mono\" text-anchor=\"end\">b = AE<\/text><rect x=\"150\" y=\"12\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc2\"/><text x=\"163.5\" y=\"29.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"180\" y=\"12\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"193.5\" y=\"29.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"210\" y=\"12\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"223.5\" y=\"29.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"240\" y=\"12\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"253.5\" y=\"29.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"270\" y=\"12\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"283.5\" y=\"29.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"300\" y=\"12\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"313.5\" y=\"29.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"330\" y=\"12\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"343.5\" y=\"29.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"360\" y=\"12\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"373.5\" y=\"29.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><text x=\"130\" y=\"76\" class=\"s-t s-mono\" text-anchor=\"end\">сдвиг ←<\/text><rect x=\"120\" y=\"58\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-bad\"/><text x=\"133.5\" y=\"75.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"150\" y=\"58\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"163.5\" y=\"75.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"180\" y=\"58\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"193.5\" y=\"75.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"210\" y=\"58\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"223.5\" y=\"75.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"240\" y=\"58\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"253.5\" y=\"75.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"270\" y=\"58\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"283.5\" y=\"75.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"300\" y=\"58\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"313.5\" y=\"75.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"330\" y=\"58\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"343.5\" y=\"75.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"360\" y=\"58\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-soft\"/><text x=\"373.5\" y=\"75.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><text x=\"132\" y=\"114\" class=\"s-tm\" text-anchor=\"start\">вышел 1 →<\/text><text x=\"130\" y=\"160\" class=\"s-t s-mono\" text-anchor=\"end\">⊕ 1B<\/text><rect x=\"150\" y=\"142\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"163.5\" y=\"159.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"180\" y=\"142\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"193.5\" y=\"159.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"210\" y=\"142\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"223.5\" y=\"159.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"240\" y=\"142\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"253.5\" y=\"159.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"270\" y=\"142\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"283.5\" y=\"159.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"300\" y=\"142\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"313.5\" y=\"159.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"330\" y=\"142\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"343.5\" y=\"159.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"360\" y=\"142\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"373.5\" y=\"159.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><text x=\"130\" y=\"206\" class=\"s-t s-mono s-b\" text-anchor=\"end\">= 47<\/text><rect x=\"150\" y=\"188\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-ok\"/><text x=\"163.5\" y=\"205.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"180\" y=\"188\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-ok\"/><text x=\"193.5\" y=\"205.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"210\" y=\"188\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-ok\"/><text x=\"223.5\" y=\"205.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"240\" y=\"188\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-ok\"/><text x=\"253.5\" y=\"205.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"270\" y=\"188\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-ok\"/><text x=\"283.5\" y=\"205.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"300\" y=\"188\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-ok\"/><text x=\"313.5\" y=\"205.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"330\" y=\"188\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-ok\"/><text x=\"343.5\" y=\"205.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"360\" y=\"188\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-ok\"/><text x=\"373.5\" y=\"205.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><\/svg><\/div><figcaption>xtime(b) — умножение на x: сдвиг влево; если вышел старший бит, XOR с 1B. AE → 47<\/figcaption><\/figure>\n<p><b>Умножение shift-and-add:<\/b> {57}·{13}, где 13 = 10 ⊕ 02 ⊕ 01: {57}·{13} = {57}·{10} ⊕ {57}·{02} ⊕ {57} = 07 ⊕ AE ⊕ 57 = FE. Умножение на 03 = xtime(b) ⊕ b.<\/p>\n<p><b>Обратный элемент:<\/b> группа ненулевых элементов имеет порядок 255, поэтому a<sup>255<\/sup> = 1 и a<sup>−1<\/sup> = a<sup>254<\/sup> (аналог теоремы Ферма). Пример: {53}·{CA} = {01}.<\/p>\n<h3>AES: блочный шифр<\/h3>\n<p>Блок — 16 байтов (матрица 4×4, заполняется по столбцам), ключ 128/192/256 бит, раундов Nr = 10/12/14. Сначала состояние складывается (XOR) с исходным ключом, затем идут Nr раундов:<\/p>\n<ol>\n<li><b>SubBytes<\/b> — каждый байт заменяется по S-box: обратный в GF(2<sup>8<\/sup>) + аффинное преобразование. Единственная нелинейная операция (confusion). S(00) = 63, S(01) = 7C, S(53) = ED.<\/li>\n<li><b>ShiftRows<\/b> — строка i циклически сдвигается <b>влево<\/b> на i байтов: байты столбца расходятся по разным столбцам.<\/li>\n<li><b>MixColumns<\/b> — каждый столбец умножается на матрицу с рядами (02 03 01 01), (01 02 03 01), (01 01 02 03), (03 01 01 02) в GF(2<sup>8<\/sup>) (формулы — в ЛР-5.3): изменение одного байта меняет весь столбец (diffusion). Пример: [db 13 53 45] → [8e 4d a1 bc]. <b>В последнем раунде MixColumns нет.<\/b><\/li>\n<li><b>AddRoundKey<\/b> — XOR с ключом раунда. Key schedule разворачивает ключ в Nr + 1 ключей раундов: 11 для AES-128, 13 для AES-192, 15 для AES-256.<\/li>\n<\/ol><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 650 178\" width=\"650\" style=\"min-width:460px\" role=\"img\" aria-label=\"Один раунд AES: четыре преобразования состояния 4×4\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-a
