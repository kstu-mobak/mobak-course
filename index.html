<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МОБАК — недели 1–8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4f5fb; --panel: #ffffff; --panel2: #f1f2f9; --text: #1c2133; --muted: #636b82; --line: #e1e4ef;
  --brand: #5b5bd6; --brand2: #a855f7; --brand3: #ec4899;
  --ok: #16a34a; --ok-soft: #e7f7ec; --bad: #dc2626; --bad-soft: #fdecec; --warn: #b45309; --warn-soft: #fff4e0;
  --c-text: #3b82f6; --c-quiz: #8b5cf6; --c-dataset: #f59e0b; --c-code: #10b981; --c-widget: #ec4899;
  --code-bg: #1f2233; --code-head: #2a2e44; --code-text: #e4e7f2; --code-line: #33384f;
  --t-kw: #c792ea; --t-str: #c3e88d; --t-num: #f78c6c; --t-com: #7d86ab; --t-fn: #82aaff; --t-bi: #89ddff; --t-op: #89ddff; --t-def: #ffcb6b;
  --shadow: 0 1px 2px rgba(30,35,60,.05), 0 6px 20px rgba(30,35,60,.06);
  --wk: #5b5bd6;
  --font: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131b; --panel: #1a1d29; --panel2: #222636; --text: #e7e9f2; --muted: #9ba2b8; --line: #2d3245;
    --ok: #4ade80; --ok-soft: #173326; --bad: #f87171; --bad-soft: #3a1f22; --warn: #fbbf24; --warn-soft: #3a2f16;
    --code-bg: #0f111a; --code-head: #191c2a; --code-line: #262a3d; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #11131b; --panel: #1a1d29; --panel2: #222636; --text: #e7e9f2; --muted: #9ba2b8; --line: #2d3245;
  --ok: #4ade80; --ok-soft: #173326; --bad: #f87171; --bad-soft: #3a1f22; --warn: #fbbf24; --warn-soft: #3a2f16;
  --code-bg: #0f111a; --code-head: #191c2a; --code-line: #262a3d; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16.5px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--wk); }
h1, h2, h3 { line-height: 1.25; font-weight: 800; }
code { font-family: var(--mono); font-size: .88em; background: color-mix(in srgb, var(--wk) 11%, transparent); color: color-mix(in srgb, var(--wk) 70%, var(--text)); padding: .1em .38em; border-radius: 6px; }
pre { font-family: var(--mono); font-size: 14px; line-height: 1.6; margin: 0; overflow-x: auto; }
pre code { background: none; color: inherit; padding: 0; font-size: inherit; }
table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; max-width: 100%; }
th, td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
th { background: color-mix(in srgb, var(--wk) 10%, var(--panel)); font-weight: 700; }
tr:nth-child(even) td { background: var(--panel2); }
button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 15px; transition: transform .08s, border-color .15s, background .15s; }
button:hover { border-color: var(--wk); }
button:active { transform: translateY(1px); }
button.primary { background: var(--wk); border-color: var(--wk); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.link { border: none; background: none; color: var(--wk); padding: 4px 6px; }
input[type=text], textarea, select { font: inherit; color: var(--text); background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 11px; }
input[type=range] { accent-color: var(--c-widget); }
input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--wk); outline-offset: 1px; }
.mono { font-family: var(--mono); }

/* каркас */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 800; background: linear-gradient(135deg, var(--brand), var(--brand2) 60%, var(--brand3)); flex: none; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; white-space: nowrap; cursor: pointer; }
.brand small { font-weight: 600; color: var(--muted); }
.top .grow { flex: 1; }
.pill { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.pill b { color: var(--text); }
.pill .mini { width: 90px; height: 8px; border-radius: 6px; background: var(--panel2); overflow: hidden; }
.pill .mini i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand3)); }
.menu-btn { display: none; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 57px); }
nav.side { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 8px 40px; overflow-y: auto; position: sticky; top: 57px; height: calc(100vh - 57px); }
.side .wk { margin: 6px 0 12px; }
.side .wk-h { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 14.5px; padding: 6px 10px; }
.side .wk-h .num { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 13px; flex: none; }
.side .wk-h .cnt { margin-left: auto; font-weight: 600; font-size: 13px; color: var(--muted); }
.side a.ls { display: flex; gap: 9px; align-items: flex-start; padding: 6px 10px 6px 14px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 14.5px; line-height: 1.35; }
.side a.ls:hover { background: var(--panel2); }
.side a.ls.cur { background: color-mix(in srgb, var(--c) 14%, transparent); color: color-mix(in srgb, var(--c) 75%, var(--text)); font-weight: 700; }
.side a.ls .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; border: 2px solid var(--line); }
.side a.ls .dot.part { border-color: var(--c); background: color-mix(in srgb, var(--c) 30%, transparent); }
.side a.ls .dot.full { border-color: var(--c); background: var(--c); }
.side a.home { padding-left: 10px; font-weight: 700; }
main { padding: 24px 32px 80px; max-width: 940px; width: 100%; }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: fixed; left: 0; top: 57px; width: min(320px, 88vw); z-index: 30; transform: translateX(-105%); transition: transform .2s; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  body.nav-open nav.side { transform: none; }
  .menu-btn { display: inline-block; }
  main { padding: 16px 16px 80px; }
  .brand small, .pill .mini { display: none; }
}

/* главная */
.hero { position: relative; overflow: hidden; color: #fff; border-radius: 22px; padding: 28px 28px 24px; background: linear-gradient(130deg, #4f46e5, #7c3aed 45%, #db2777); box-shadow: var(--shadow); }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; background: rgba(255,255,255,.1); pointer-events: none; }
.hero h1 { margin: 0 0 8px; font-size: 27px; position: relative; }
.hero p { margin: 6px 0; opacity: .92; position: relative; max-width: 640px; }
.hero .bar { background: rgba(255,255,255,.25); position: relative; }
.hero .bar i { background: #fff; }
.hero button { background: #fff; color: #4f46e5; border-color: #fff; }
.hero button.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
.legend span { font-size: 13.5px; font-weight: 700; padding: 4px 11px; border-radius: 99px; background: color-mix(in srgb, var(--c) 13%, var(--panel)); color: color-mix(in srgb, var(--c) 80%, var(--text)); }
.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
.wcard { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; cursor: pointer; }
.wcard:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(30,35,60,.12); }
.wcard .band { padding: 14px 16px; color: #fff; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 62%, #fff)); display: flex; justify-content: space-between; align-items: center; }
.wcard .band b { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.wcard .band .big { font-size: 34px; font-weight: 800; line-height: 1; }
.wcard .in { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.wcard h3 { margin: 0; font-size: 16.5px; }
.wcard ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.ring { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); margin-top: auto; }
.bar { height: 8px; border-radius: 6px; background: var(--panel2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: var(--wk); transition: width .4s; }
.small { font-size: 14px; color: var(--muted); }

/* урок */
.lhead { border-radius: 20px; padding: 20px 22px 16px; margin-bottom: 18px; color: #fff; background: linear-gradient(130deg, var(--wk), color-mix(in srgb, var(--wk) 55%, #ec4899)); box-shadow: var(--shadow); }
.lhead .crumbs { font-size: 14px; opacity: .9; font-weight: 600; }
.lhead h1 { margin: 4px 0 12px; font-size: 27px; }
.stepbar { display: flex; flex-wrap: wrap; gap: 6px; }
.stepbar a { min-width: 32px; height: 32px; padding: 0 9px; display: inline-flex; gap: 4px; align-items: center; justify-content: center; border-radius: 10px; background: rgba(255,255,255,.18); text-decoration: none; color: #fff; font-size: 13px; font-weight: 700; }
.stepbar a:hover { background: rgba(255,255,255,.32); }
.stepbar a.full { background: #fff; color: var(--wk); }
.step { position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 16px; padding: 18px 22px; margin: 0 0 16px; box-shadow: var(--shadow); scroll-margin-top: 72px; }
.step-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; padding: 3px 11px 3px 9px; border-radius: 99px; background: color-mix(in srgb, var(--c) 14%, var(--panel)); color: color-mix(in srgb, var(--c) 82%, var(--text)); }
.badge { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
.badge.full { background: var(--ok-soft); color: var(--ok); }
.body > :first-child { margin-top: 0; }
.body h3 { position: relative; margin: 22px 0 10px; padding-left: 14px; font-size: 19px; }
.body h3::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 5px; border-radius: 4px; background: linear-gradient(var(--wk), var(--brand3)); }
.body img { max-width: 100%; }
.body ul, .body ol { padding-left: 22px; }
.body li { margin: 3px 0; }
.note { color: var(--muted); background: var(--panel2); border-radius: 10px; padding: 8px 12px; }
.limits { margin: 12px 0; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.limits b { color: var(--warn); }
.limits ul { margin: 4px 0 0; padding-left: 20px; }

/* код */
.codebox { margin: 12px 0; border-radius: 14px; overflow: hidden; background: var(--code-bg); color: var(--code-text); box-shadow: 0 4px 16px rgba(15,17,30,.18); }
.codebox .ch { display: flex; align-items: center; gap: 7px; padding: 8px 12px; background: var(--code-head); font-size: 12.5px; color: #9aa3c4; font-family: var(--mono); }
.codebox .ch i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
.codebox .ch i:nth-child(1) { background: #ff5f57; } .codebox .ch i:nth-child(2) { background: #febc2e; } .codebox .ch i:nth-child(3) { background: #28c840; }
.codebox .ch span { margin-left: 6px; }
.codebox .ch button { margin-left: auto; padding: 2px 10px; font-size: 12.5px; background: transparent; color: #cfd5ee; border: 1px solid #454b68; border-radius: 7px; }
.codebox .ch button:hover { border-color: #82aaff; color: #fff; }
.codebox pre { padding: 12px 16px 14px; }
.codebox.plain { background: var(--panel2); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
.codebox.plain .ch { background: color-mix(in srgb, var(--wk) 10%, var(--panel2)); color: var(--muted); }
.codebox.plain .ch button { color: var(--text); border-color: var(--line); }
.tk-kw { color: var(--t-kw); font-weight: 500; } .tk-str { color: var(--t-str); } .tk-num { color: var(--t-num); } .tk-com { color: var(--t-com); font-style: italic; }
.tk-fn { color: var(--t-fn); } .tk-bi { color: var(--t-bi); } .tk-op { color: var(--t-op); } .tk-def { color: var(--t-def); font-weight: 600; } .tk-self { color: #f07178; }
.ex td.call { background: var(--code-bg); color: var(--code-text); }
.inl { font-family: var(--mono); font-size: 14px; background: var(--code-bg); color: var(--code-text); padding: 2px 8px; border-radius: 7px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* вопросы */
.opts { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.opt { display: flex; gap: 11px; align-items: flex-start; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--c-quiz); }
.opt input { margin-top: 6px; accent-color: var(--c-quiz); }
.opt.sel-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.sel-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt .fb { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.opt p { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.result { margin-top: 12px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel2); animation: pop .25s ease-out; }
.result.ok { border-color: var(--ok); background: var(--ok-soft); }
.result.bad { border-color: var(--bad); background: var(--bad-soft); }
.result .ttl { font-weight: 800; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.match-row select { width: 100%; }
@media (max-width: 600px) { .match-row { grid-template-columns: 1fr; gap: 4px; } }
.parsons { list-style: none; padding: 10px; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; background: var(--code-bg); border-radius: 14px; }
.parsons li { display: flex; align-items: center; gap: 6px; background: var(--code-head); border: 1px solid var(--code-line); border-radius: 9px; padding: 4px 6px; cursor: grab; color: var(--code-text); }
.parsons li.drag { opacity: .4; }
.parsons li .ln { flex: 1; white-space: pre; overflow-x: auto; font-family: var(--mono); font-size: 14px; padding: 4px 0; }
.parsons li button { padding: 1px 8px; font-size: 13px; background: transparent; color: #cfd5ee; border-color: #454b68; }
.answer { width: 100%; }

/* задачи */
.sub { font-weight: 800; font-size: 13px; color: var(--muted); margin: 16px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
.ex { width: 100%; display: table; }
.ex td { font-family: var(--mono); font-size: 14px; white-space: pre-wrap; word-break: break-all; }
.ex tr:nth-child(even) td.call { background: var(--code-head); }
.ex td.want { color: var(--ok); font-weight: 600; }
.ex td .note2 { display: block; font-family: var(--font); font-size: 13px; color: var(--muted); font-weight: 400; word-break: normal; }
.datab { font-family: var(--mono); font-size: 14.5px; white-space: pre-wrap; word-break: break-all; padding: 12px 14px; border-radius: 12px; border: 1.5px dashed color-mix(in srgb, var(--c-dataset) 60%, transparent); background: color-mix(in srgb, var(--c-dataset) 8%, var(--panel)); }
.data-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; margin-bottom: 4px; }
.reveal { margin-top: 10px; }
.reveal .ansbox { margin-top: 8px; padding: 10px 14px; border-radius: 12px; background: var(--ok-soft); border: 1.5px solid var(--ok); font-family: var(--mono); white-space: pre-wrap; word-break: break-all; animation: pop .25s ease-out; }
.reveal .ansbox .lbl { font-family: var(--font); font-weight: 800; color: var(--ok); display: block; font-size: 13.5px; }
.done-box { display: inline-flex; gap: 9px; align-items: center; margin-top: 16px; padding: 7px 14px; border: 1.5px solid var(--line); border-radius: 99px; cursor: pointer; user-select: none; font-weight: 700; font-size: 14.5px; transition: all .15s; }
.done-box:hover { border-color: var(--ok); }
.done-box:has(input:checked) { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.done-box input { width: 18px; height: 18px; accent-color: var(--ok); margin: 0; }
.lesson-done { text-align: center; padding: 18px; border-radius: 16px; background: linear-gradient(130deg, color-mix(in srgb, var(--ok) 16%, var(--panel)), color-mix(in srgb, var(--wk) 14%, var(--panel))); font-weight: 800; margin-bottom: 16px; animation: pop .3s ease-out; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
.pager button { max-width: 48%; text-align: left; }

/* тренажёры */
.wg .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 8px 0; }
.wg label.f { display: flex; flex-direction: column; gap: 3px; font-size: 13px; font-weight: 700; color: var(--muted); }
.wg label.f input { font-family: var(--mono); width: 150px; }
.wg label.f input.wide { width: 260px; max-width: 100%; }
.wg .out { margin-top: 10px; }
.wg .err { color: var(--bad); font-weight: 700; }
.wg tr.hi td, .wg td.hi { background: color-mix(in srgb, var(--c-widget) 16%, var(--panel)); }
.wg .okc { color: var(--ok); font-weight: 800; }
.bits { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; }
.bit { width: 40px; text-align: center; cursor: pointer; user-select: none; }
.bit b { display: block; height: 40px; line-height: 38px; border-radius: 10px; font-family: var(--mono); font-size: 17px; border: 1.5px solid var(--line); background: var(--panel2); transition: all .12s; }
.bit:hover b { border-color: var(--c-widget); }
.bit.on b { background: var(--c-widget); border-color: var(--c-widget); color: #fff; }
.bit small { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }
.chars { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.chr { border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; min-width: 120px; background: var(--panel2); }
.chr .g { font-size: 26px; font-weight: 800; text-align: center; }
.chr .cp { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: center; }
.chr .by { font-family: var(--mono); font-size: 13px; margin-top: 4px; }
.chr .by span { color: var(--c-widget); font-weight: 700; }
.grid-zn { border-collapse: separate; border-spacing: 2px; display: table; margin: 10px 0; }
.grid-zn td, .grid-zn th { border: none; min-width: 30px; height: 30px; padding: 0 2px; text-align: center; font-family: var(--mono); font-size: 12.5px; border-radius: 6px; background: var(--panel2); }
.grid-zn tr:nth-child(even) td { background: var(--panel2); }
.grid-zn th { background: color-mix(in srgb, var(--wk) 18%, var(--panel)); }
.grid-zn th.inv { background: var(--ok-soft); color: var(--ok); }
.grid-zn td.one, .grid-zn tr:nth-child(even) td.one { background: var(--ok); color: #fff; font-weight: 700; }
.grid-zn td.zero, .grid-zn tr:nth-child(even) td.zero { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.grid-zn td.cur { outline: 2px solid var(--c-widget); }
.scroll { overflow-x: auto; }
.alpha { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; margin: 10px 0; font-family: var(--mono); font-size: 13px; text-align: center; }
.alpha div { background: var(--panel2); border-radius: 7px; padding: 3px 0; }
.alpha div b { display: block; color: var(--c-widget); }
.trio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
.trio > div { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--panel2); font-size: 14.5px; }
.trio > div h4 { margin: 0 0 6px; font-size: 15px; }
.trio .eve { border-color: var(--bad); background: var(--bad-soft); }
@media (max-width: 640px) { .trio { grid-template-columns: 1fr; } .alpha { grid-template-columns: repeat(7, minmax(0, 1fr)); } }


/* схемы */
.dg { margin: 16px 0; text-align: center; }
.dg-scroll { overflow-x: auto; }
.dg svg { max-width: 100%; height: auto; overflow: visible; }
.dg figcaption { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.dg text { font-family: var(--font); font-size: 14px; }
.dg .s-t { fill: var(--text); } .dg .s-tm { fill: var(--muted); } .dg .s-b { font-weight: 700; } .dg .s-mono { font-family: var(--mono); }
.dg .s-w { fill: #fff; font-weight: 700; } .dg .t-acc2 { fill: #ec4899; font-weight: 700; }
.dg .s-ln { stroke: var(--text); stroke-width: 1.6; fill: none; } .dg .s-mu { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.dg .s-acc2 { stroke: #ec4899; stroke-width: 2.2; fill: none; } .dg .s-arrow { fill: var(--text); }
.dg .f-soft { fill: var(--panel2); stroke: var(--line); stroke-width: 1.2; }
.dg .f-acc { fill: color-mix(in srgb, var(--wk) 20%, var(--panel)); stroke: var(--wk); stroke-width: 1.4; }
.dg .f-acc2 { fill: color-mix(in srgb, #ec4899 18%, var(--panel)); stroke: #ec4899; stroke-width: 1.4; }
.dg .f-ok { fill: color-mix(in srgb, var(--ok) 22%, var(--panel)); stroke: var(--ok); stroke-width: 1.4; }
.dg .f-bad { fill: color-mix(in srgb, var(--bad) 18%, var(--panel)); stroke: var(--bad); stroke-width: 1.4; }
.ans { margin: 8px 0 18px; padding: 8px 12px; border-radius: 10px; background: var(--ok-soft); border-left: 4px solid var(--ok); }
.hints { margin-top: 14px; }
.hint { margin-top: 8px; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, #f59e0b 10%, var(--panel)); border: 1px solid color-mix(in srgb, #f59e0b 45%, transparent); animation: pop .25s ease-out; }
.hint .hl { font-weight: 800; font-size: 13.5px; color: color-mix(in srgb, #f59e0b 80%, var(--text)); display: block; margin-bottom: 2px; }
.hint .codebox { margin: 8px 0 2px; }

/* меню */
.menu { position: absolute; right: 12px; top: 54px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.15); padding: 6px; display: flex; flex-direction: column; min-width: 250px; z-index: 40; }
.menu button { border: none; text-align: left; background: none; padding: 9px 12px; font-weight: 600; }
.menu button:hover { background: var(--panel2); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; z-index: 60; font-size: 14.5px; font-weight: 700; }
</style>

<script>
const COURSE = [{"n": 1, "title": "Неделя 1. Основы Python. Зачем нужна криптография", "lessons": [{"title": "Как учиться по этому курсу", "steps": [{"id": "w1l1s1", "t": "text", "html": "<h3>Как устроен курс<\/h3>\n<p>Каждая неделя — отдельный модуль: теория, тренажёр, вопросы и задачи. Отметки «решено» и ответы на вопросы\nсохраняются в браузере сами — открывайте файл в том же браузере на том же устройстве.<\/p>\n<ul>\n<li><b>Теория<\/b> — короткие объяснения с примерами кода. Код можно скопировать кнопкой в углу блока.<\/li>\n<li><b>Схемы<\/b> в теории показывают, как устроены алгоритмы, — смотрите на них, прежде чем читать формулы.<\/li>\n<li><b>Тренажёры<\/b> — интерактивные схемы: меняйте числа и смотрите, как работает алгоритм по шагам.<\/li>\n<li><b>Разборы на примере<\/b> стоят перед каждым блоком ручных задач: там решена такая же задача на других числах, шаг за шагом.<\/li>\n<li><b>Подсказки<\/b> к задачам на код открываются по одной: идея → план решения → каркас кода. Сначала попробуйте сами.<\/li>\n<li>Если вы <b>никогда не программировали<\/b>, начните с урока «Python с нуля: первая программа». Незнакомый значок — смотрите «Словарик и обозначения».<\/li>\n<li><b>Вопросы<\/b> (тесты, сопоставления, сборка кода) проверяются прямо здесь, сразу.<\/li>\n<li><b>Ручные задачи<\/b> решаются на бумаге, без калькулятора. К каждой даны данные для тренировки и ответ\nпод кнопкой «Показать ответ» — откройте его только после того, как решили сами.<\/li>\n<li><b>Задачи на программирование<\/b> вы пишете и запускаете у себя: в IDE или в онлайн-редакторе. В каждой\nзадаче есть примеры с правильными ответами — по ним и проверяйте свой код. Как это сделать — в уроке\n«Как запускать и проверять код».<\/li>\n<li><b>⭐ — расширение.<\/b> Такие задачи сложнее; для зачёта не обязательны.<\/li>\n<li><b>Честность.<\/b> Любое решение может быть проверено устно (2–3 минуты): будьте готовы объяснить свою\nпрограмму строка за строкой.<\/li>\n<\/ul>\n<p>Не получилось — перечитайте теорию урока и поиграйте с тренажёром. Не помогло — спросите на паре.<\/p>"}]}, {"title": "Как запускать и проверять код", "steps": [{"id": "w1l2s1", "t": "text", "html": "<h3>Где писать и запускать код<\/h3>\n<table>\n<tr><th>Вариант<\/th><th>Что сделать<\/th><\/tr>\n<tr><td><b>Thonny<\/b> — проще всего (компьютер)<\/td><td>Скачайте с <a href=\"https://thonny.org\" target=\"_blank\" rel=\"noopener\">thonny.org<\/a>\nи установите — Python уже внутри. Откройте файл (<i>File → Open<\/i>), запуск — <b>F5<\/b>. Ввод данных — в окне <i>Shell<\/i> внизу.<\/td><\/tr>\n<tr><td><b>VS Code / PyCharm<\/b> (компьютер)<\/td><td>Поставьте Python с <a href=\"https://www.python.org/downloads/\" target=\"_blank\" rel=\"noopener\">python.org<\/a>\n(в Windows отметьте <i>Add python.exe to PATH<\/i>), затем редактор и расширение Python. Запуск — кнопка ▶ или\n<code>python имя_файла.py<\/code> в терминале.<\/td><\/tr>\n<tr><td><b>Онлайн, без установки<\/b><\/td><td><a href=\"https://www.onlinegdb.com/online_python_compiler\" target=\"_blank\" rel=\"noopener\">OnlineGDB<\/a>\nили <a href=\"https://www.programiz.com/python-programming/online-compiler/\" target=\"_blank\" rel=\"noopener\">Programiz<\/a>:\nвставьте код, нажмите <i>Run<\/i>, вводите данные в окне вывода (каждую строку — Enter). Работает и на телефоне.<\/td><\/tr>\n<tr><td><b>Телефон Android<\/b><\/td><td>Приложение <b>Pydroid 3<\/b> из Google Play.<\/td><\/tr>\n<\/table>\n<p>Нужен Python 3.8 или новее. Сторонние библиотеки для недель 1–8 не нужны.<\/p>\n\n<h3>Два вида задач на программирование<\/h3>\n<p><b>Программа<\/b> читает данные через <code>input()<\/code> и печатает ответ через <code>print()<\/code>.\nЗапустите её, введите строки из колонки «Ввод» и сравните результат с колонкой «Правильный вывод» — он должен\nсовпасть полностью (лишние пробелы в конце строк не важны).<\/p>\n<p><b>Функция<\/b> (большинство лабораторных). Скопируйте заготовку, напишите тело функции вместо <code>pass<\/code>\nи проверьте её на примерах из таблицы. Кнопка «Скопировать примеры» даёт готовые строки для проверки — вставьте\nих в конец файла и запустите:<\/p>\n<pre><code>def gcd(a, b):\n    a, b = abs(a), abs(b)\n    while b:\n        a, b = b, a % b\n    return a\n\n\nprint(gcd(48, 18))    # правильно: 6\nprint(gcd(12, -18))   # правильно: 6<\/code><\/pre>\n<p>Если напечатанное совпало с комментарием во всех строках — функция прошла примеры. Функции, которые нужно\nвзять из прошлых задач (они помечены в заготовке), вставьте в тот же файл.<\/p>\n<p>Если функция <b>печатает<\/b> результат или <b>работает с файлом<\/b>, в конце заготовки уже есть проверочный код.\nДопишите функцию, запустите файл целиком и проверяйте его, как программу: введите строку из колонки «Ввод» и\nсравните напечатанное с колонкой «Правильный вывод».<\/p>\n\n<h3>Примеры — это ещё не всё<\/h3>\n<p>Совпадение на примерах не гарантирует, что решение верное. Проверьте сами граничные случаи: 0 и 1,\nотрицательные числа, очень большие числа, пустую строку, случай, когда ответа нет. Добавьте свои проверки:<\/p>\n<pre><code>assert gcd(0, 5) == 5\nassert gcd(-12, -18) == 6\nprint(\"мои тесты пройдены\")<\/code><\/pre>\n<p>Соблюдайте <b>ограничения<\/b> из условия (например, в ЛР-2 нельзя <code>math.gcd<\/code>, в ЛР-3 — <code>pow(a, -1, n)<\/code>):\nсмысл задачи — реализовать алгоритм самому. На устной проверке спросят, как работает ваш код.<\/p>\n\n<h3>Частые ошибки<\/h3>\n<ul>\n<li><code>input()<\/code> возвращает строку: <code>n = int(input())<\/code>, два числа в строке — <code>a, b = map(int, input().split())<\/code>.<\/li>\n<li><code>IndentationError<\/code> — отступы: внутри функции, цикла и <code>if<\/code> ровно 4 пробела.<\/li>\n<li>Функция должна <b>возвращать<\/b> результат (<code>return<\/code>), а не печатать его.<\/li>\n<li>Программа «зависла» — она ждёт ввода или попала в бесконечный цикл. Остановка — <i>Stop<\/i> / Ctrl+C.<\/li>\n<\/ul>"}]}, {"title": "Словарик и обозначения", "steps": [{"id": "w1l3s1", "t": "text", "html": "<h3>Обозначения, которые встретятся в курсе<\/h3>\n<p>Возвращайтесь сюда, если встретили незнакомый значок.<\/p>\n<table>\n<tr><th>Запись<\/th><th>Как читать<\/th><th>Что значит<\/th><th>Неделя<\/th><\/tr>\n<tr><td>2<sup>n<\/sup><\/td><td>два в степени n<\/td><td>2·2·…·2 (n раз); в Python <code>2 ** n<\/code><\/td><td>1<\/td><\/tr>\n<tr><td>1011<sub>2<\/sub>, 0x2F<\/td><td>в двоичной; в шестнадцатеричной<\/td><td>запись числа в другой системе счисления<\/td><td>1<\/td><\/tr>\n<tr><td>≈<\/td><td>примерно равно<\/td><td>2<sup>10<\/sup> ≈ 10<sup>3<\/sup><\/td><td>1<\/td><\/tr>\n<tr><td>U+0416<\/td><td>кодовая точка<\/td><td>номер символа в Unicode (hex)<\/td><td>2<\/td><\/tr>\n<tr><td>a | b<\/td><td>a делит b<\/td><td>b делится на a без остатка<\/td><td>3<\/td><\/tr>\n<tr><td>НОД(a, b)<\/td><td>наибольший общий делитель<\/td><td>наибольшее число, на которое делятся и a, и b<\/td><td>3<\/td><\/tr>\n<tr><td>a mod n<\/td><td>a по модулю n<\/td><td>остаток от деления a на n; в Python <code>a % n<\/code><\/td><td>3–4<\/td><\/tr>\n<tr><td>a ≡ b (mod n)<\/td><td>a сравнимо с b по модулю n<\/td><td>одинаковые остатки при делении на n<\/td><td>4<\/td><\/tr>\n<tr><td>Z<sub>n<\/sub><\/td><td>кольцо вычетов<\/td><td>числа 0…n−1 с действиями по модулю n<\/td><td>4<\/td><\/tr>\n<tr><td>a<sup>−1<\/sup> mod n<\/td><td>обратный к a<\/td><td>такое x, что a·x ≡ 1 (mod n)<\/td><td>4<\/td><\/tr>\n<tr><td>GF(p)<\/td><td>поле Галуа<\/td><td>Z<sub>p<\/sub> при простом p: можно делить на любое ненулевое<\/td><td>4<\/td><\/tr>\n<tr><td>φ(n)<\/td><td>фи от n, функция Эйлера<\/td><td>сколько чисел от 1 до n взаимно просты с n<\/td><td>5<\/td><\/tr>\n<tr><td>O(log n)<\/td><td>«о большое»<\/td><td>как растёт число шагов: log — очень медленно, n — быстро<\/td><td>3, 5<\/td><\/tr>\n<tr><td>Z<sub>p<\/sub>*<\/td><td>мультипликативная группа<\/td><td>числа 1…p−1 с умножением по модулю p<\/td><td>6<\/td><\/tr>\n<tr><td>ord(g)<\/td><td>порядок g<\/td><td>наименьшее k ≥ 1 с g<sup>k<\/sup> ≡ 1<\/td><td>6<\/td><\/tr>\n<tr><td>Σ<\/td><td>сумма<\/td><td>Σ r<sub>i<\/sub> = r<sub>1<\/sub> + r<sub>2<\/sub> + …<\/td><td>6<\/td><\/tr>\n<tr><td>⊕<\/td><td>XOR, исключающее «или»<\/td><td>побитовое сложение без переноса; в Python <code>^<\/code><\/td><td>7<\/td><\/tr>\n<tr><td>GF(2<sup>8<\/sup>)<\/td><td>поле из 256 элементов<\/td><td>байты как многочлены; в нём работает AES<\/td><td>8<\/td><\/tr>\n<tr><td>{57}<\/td><td>байт 0x57<\/td><td>так байты пишут в стандарте AES (FIPS-197)<\/td><td>8<\/td><\/tr>\n<\/table>\n<h3>Словарик<\/h3>\n<ul>\n<li><b>Открытый текст<\/b> (m) — исходное сообщение; <b>шифртекст<\/b> (c) — результат шифрования; <b>ключ<\/b> (k) — секрет, от которого зависит шифрование.<\/li>\n<li><b>Перебор<\/b> (brute force) — попытка всех ключей подряд.<\/li>\n<li><b>Взаимно простые<\/b> числа — у которых НОД = 1.<\/li>\n<li><b>Простое число<\/b> — больше 1 и делится только на 1 и на себя.<\/li>\n<li><b>Байт<\/b> — 8 бит, число от 0 до 255, две hex-цифры.<\/li>\n<li><b>Гамма<\/b> (keystream) — поток ключевых байтов, который складывается с текстом по XOR.<\/li>\n<li><b>Образующий<\/b> — элемент, степени которого дают всю группу.<\/li>\n<\/ul>"}]}, {"title": "Входная самодиагностика", "steps": [{"id": "w1l4s1", "t": "text", "html": "<p>Проверьте себя перед началом курса: решите задачи ниже без калькулятора. Если что-то не получается — не страшно, всё это разбирается в первые недели.<\/p>"}, {"id": "w1l4s2", "t": "dataset", "html": "<p><b>Деление с остатком.<\/b> Во входных данных числа a и b. Найдите неполное частное q и остаток r (a = b·q + r, 0 ≤ r &lt; b). Формат ответа: <code>q r<\/code><\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["528 7", "75 3"], ["503 7", "71 6"], ["346 6", "57 4"]]}, {"id": "w1l4s3", "t": "dataset", "html": "<p><b>Степень двойки.<\/b> Во входных данных число k. Запишите значение 2<sup>k<\/sup>.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["11", "2048"], ["11", "2048"], ["8", "256"]]}, {"id": "w1l4s4", "t": "dataset", "html": "<p><b>Двоичная запись.<\/b> Во входных данных число n (до 255). Запишите его двоичную запись.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["127", "1111111"], ["120", "1111000"], ["81", "1010001"]]}, {"id": "w1l4s5", "t": "choice", "html": "<p>Чему равен НОД(12, 18)?<\/p>", "opts": [["2", false, ""], ["3", false, ""], ["6", true, ""], ["36", false, ""]], "multi": false}]}, {"title": "Зачем нужна криптография", "steps": [{"id": "w1l5s1", "t": "text", "html": "<h3>Четыре цели криптографии<\/h3>\n<ul>\n<li><b>Конфиденциальность<\/b> — посторонний не может прочитать данные.<\/li>\n<li><b>Целостность<\/b> — данные нельзя незаметно изменить.<\/li>\n<li><b>Аутентичность<\/b> — получатель уверен, от кого пришли данные.<\/li>\n<li><b>Неотказуемость<\/b> — автор не может потом отказаться от своего сообщения или подписи.<\/li>\n<\/ul>\n<h3>Модель противника<\/h3>\n<p>Прежде чем защищать, отвечаем: что противник знает и что умеет. <b>Пассивный<\/b> противник только подслушивает. <b>Активный<\/b> — может изменять, удалять и подменять сообщения.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 640 225\" width=\"640\" style=\"min-width:460px\" role=\"img\" aria-label=\"Модель противника: что он видит и что может изменить\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-adv\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><text x=\"20\" y=\"20\" class=\"s-t s-b\" text-anchor=\"start\">Пассивный противник: только подслушивает<\/text><rect x=\"20\" y=\"32\" width=\"110\" height=\"40\" rx=\"8\" class=\"f-acc\"/><text x=\"75.0\" y=\"57.0\" class=\"s-t s-b\" text-anchor=\"middle\">👩 Алиса<\/text><rect x=\"510\" y=\"32\" width=\"110\" height=\"40\" rx=\"8\" class=\"f-acc\"/><text x=\"565.0\" y=\"57.0\" class=\"s-t s-b\" text-anchor=\"middle\">👨 Боб<\/text><line x1=\"130\" y1=\"52\" x2=\"508\" y2=\"52\" class=\"s-ln\" marker-end=\"url(#ar-adv)\"/><text x=\"320\" y=\"45\" class=\"s-tm\" text-anchor=\"middle\">сообщение<\/text><line x1=\"320\" y1=\"52\" x2=\"320\" y2=\"92\" class=\"s-mu\" stroke-dasharray=\"5 4\"/><rect x=\"262\" y=\"92\" width=\"116\" height=\"32\" rx=\"8\" class=\"f-soft\"/><text x=\"320.0\" y=\"113.0\" class=\"s-t\" text-anchor=\"middle\">😈 Ева: копия<\/text><text x=\"20\" y=\"160\" class=\"s-t s-b\" text-anchor=\"start\">Активный противник: перехватывает и подменяет<\/text><rect x=\"20\" y=\"172\" width=\"110\" height=\"40\" rx=\"8\" class=\"f-acc\"/><text x=\"75.0\" y=\"197.0\" class=\"s-t s-b\" text-anchor=\"middle\">👩 Алиса<\/text><rect x=\"262\" y=\"172\" width=\"116\" height=\"40\" rx=\"8\" class=\"f-bad\"/><text x=\"320.0\" y=\"197.0\" class=\"s-t s-b\" text-anchor=\"middle\">😈 Ева<\/text><rect x=\"510\" y=\"172\" width=\"110\" height=\"40\" rx=\"8\" class=\"f-acc\"/><text x=\"565.0\" y=\"197.0\" class=\"s-t s-b\" text-anchor=\"middle\">👨 Боб<\/text><line x1=\"130\" y1=\"192\" x2=\"260\" y2=\"192\" class=\"s-ln\" marker-end=\"url(#ar-adv)\"/><line x1=\"378\" y1=\"192\" x2=\"508\" y2=\"192\" class=\"s-ln\" marker-end=\"url(#ar-adv)\"/><text x=\"195\" y=\"185\" class=\"s-tm s-mono\" text-anchor=\"middle\">m<\/text><text x=\"443\" y=\"185\" class=\"s-tm s-mono\" text-anchor=\"middle\">m′ ≠ m<\/text><\/svg><\/div><figcaption>Модель противника: что он видит и что может изменить<\/figcaption><\/figure>\n<h3>Принцип Керкгоффса<\/h3>\n<p>Стойкость шифра должна зависеть только от секретности <b>ключа<\/b>. Алгоритм считается известным противнику. Поэтому «секретный самодельный алгоритм» — не защита: его рано или поздно узнают, а заменить алгоритм намного труднее, чем ключ.<\/p>\n<h3>Пространство ключей и полный перебор<\/h3>\n<p>Если ключ — это n бит, существует 2<sup>n<\/sup> разных ключей. Полный перебор (brute force) пробует их все. Каждый лишний бит <b>удваивает<\/b> работу — рост экспоненциальный.<\/p>\n<table border=\"1\" cellpadding=\"4\">\n<tbody><tr><th>Длина ключа<\/th><th>Ключей<\/th><th>Перебор при 10<sup>9<\/sup> ключей/с<\/th><\/tr>\n<tr><td>40 бит<\/td><td>≈ 1,1·10<sup>12<\/sup><\/td><td>≈ 18 минут<\/td><\/tr>\n<tr><td>56 бит (DES)<\/td><td>≈ 7,2·10<sup>16<\/sup><\/td><td>≈ 2,3 года<\/td><\/tr>\n<tr><td>128 бит (AES-128)<\/td><td>≈ 3,4·10<sup>38<\/sup><\/td><td>≈ 10<sup>22<\/sup> лет<\/td><\/tr>\n<\/tbody><\/table>\n<p>Специализированная машина EFF в 1998 году нашла ключ DES перебором примерно за двое суток — поэтому 56 бит давно недостаточно. Сегодня минимум — 112 бит, рекомендуется 128 и больше.<\/p>\n<p><b>Полезные приближения:<\/b> 2<sup>10<\/sup> ≈ 10<sup>3<\/sup>, 2<sup>30<\/sup> ≈ 10<sup>9<\/sup>, 1 год ≈ 3,15·10<sup>7<\/sup> с ≈ 2<sup>25<\/sup> с.<\/p>\n<p>Важно: большое пространство ключей <b>необходимо, но не достаточно<\/b>. На 7-й неделе увидим шифр с огромным числом ключей, который ломается за минуты.<\/p>"}, {"id": "w1l5s2", "t": "matching", "html": "<p>Сопоставьте ситуацию и цель криптографии, которая в ней нарушена или обеспечена.<\/p>", "pairs": [["Посторонний не может прочитать переписку", "Конфиденциальность"], ["Никто не может незаметно изменить сумму платежа", "Целостность"], ["Получатель уверен, что письмо пришло именно от банка", "Аутентичность"], ["Автор договора не может отказаться от своей подписи", "Неотказуемость"]]}, {"id": "w1l5s3", "t": "choice", "html": "<p>Какое утверждение выражает принцип Керкгоффса?<\/p>", "opts": [["Стойкость должна зависеть только от секретности ключа; алгоритм может быть известен противнику", true, "Верно."], ["Алгоритм шифрования нужно держать в секрете", false, "Наоборот: алгоритм считается известным."], ["Чем сложнее алгоритм, тем он надёжнее", false, "Сложность не гарантирует стойкость."], ["Ключ можно не менять, если алгоритм секретный", false, "Секретность алгоритма — не защита."]], "multi": false}, {"id": "w1l5s4", "t": "number", "html": "<p>Сколько существует различных 4-значных PIN-кодов (от 0000 до 9999)?<\/p>", "answer": "10000", "err": "0"}, {"id": "w1l5s5", "t": "example", "html": "<h3>Разбор: оценка перебора<\/h3><p>Данные: <code>64 30<\/code> — ключ 64 бит, скорость 2<sup>30<\/sup> ключей в секунду.<\/p><ol><li>Всего ключей 2<sup>64<\/sup>.<\/li><li>Время = ключи / скорость = 2<sup>64<\/sup> / 2<sup>30<\/sup> = 2<sup>64−30<\/sup> = 2<sup>34<\/sup> секунд: при делении степеней показатели вычитаются.<\/li><li>Год ≈ 2<sup>25<\/sup> секунд, поэтому лет: 2<sup>34<\/sup> / 2<sup>25<\/sup> = 2<sup>9<\/sup>.<\/li><\/ol><p class=\"ans\">Ответ в формате задачи: <code>34; 9<\/code><\/p>"}, {"id": "w1l5s6", "t": "dataset", "html": "<p><b>Оценка перебора.<\/b> Во входных данных два числа: n — длина ключа в битах, k — скорость противника: 2<sup>k<\/sup> ключей в секунду.<\/p>\n<p>1) За сколько секунд в худшем случае будет перебрано всё пространство ключей? Ответ — показатель степени двойки.<br>\n2) Сколько это лет, если 1 год ≈ 2<sup>25<\/sup> с? Тоже показатель степени двойки.<\/p>\n<p>Формат: <code>показатель_секунд; показатель_лет<\/code>, например <code>40; 15<\/code><\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["96 36", "60; 35"], ["96 31", "65; 40"], ["72 33", "39; 14"]]}]}, {"title": "Python с нуля: первая программа", "steps": [{"id": "w1l6s1", "t": "text", "html": "<h3>Что такое программа<\/h3>\n<p>Программа — это список команд для компьютера. Python выполняет их <b>по порядку, сверху вниз<\/b>, по одной строке.\nСамая первая команда — <code>print<\/code>: она выводит на экран то, что в скобках.<\/p>\n<pre><code>print(\"Привет!\")\nprint(\"Я учу криптографию\")\nprint(2 + 3)<\/code><\/pre>\n<p>Запустите это (как — в уроке «Как запускать и проверять код»). На экране будет:<\/p>\n<pre><code>Привет!\nЯ учу криптографию\n5<\/code><\/pre>\n<h3>Текст и числа — разные вещи<\/h3>\n<p>Текст пишется в кавычках и называется <b>строкой<\/b>. Без кавычек Python считает выражение:<\/p>\n<pre><code>print(\"2 + 3\")   # строка: напечатает 2 + 3\nprint(2 + 3)     # число: напечатает 5\nprint(\"2\" + \"3\") # строки склеиваются: 23<\/code><\/pre>\n<p>Всё после <code>#<\/code> — <b>комментарий<\/b>: пояснение для человека, Python его пропускает.<\/p>\n<p>В <code>print<\/code> можно передать несколько значений через запятую — они выведутся через пробел:\n<code>print(\"ключ\", 128, \"бит\")<\/code> → <code>ключ 128 бит<\/code>.<\/p>"}, {"id": "w1l6s2", "t": "choice", "html": "<p>Что выведет программа?<\/p><pre><code>print(\"5\" + \"5\")\nprint(5 + 5)<\/code><\/pre>", "opts": [["<code>55<\/code>, затем <code>10<\/code>", true, "Верно: строки склеиваются, числа складываются."], ["<code>10<\/code>, затем <code>10<\/code>", false, "В первой строке «5» в кавычках — это текст, а не число."], ["<code>55<\/code>, затем <code>55<\/code>", false, "Во второй строке кавычек нет — это числа."], ["Ошибку", false, "Обе строки правильные."]]}, {"id": "w1l6s3", "t": "text", "html": "<h3>Переменные<\/h3>\n<p>Переменная — имя, под которым программа запоминает значение. Знак <code>=<\/code> означает <b>«положи значение\nсправа в переменную слева»<\/b>, а не «равно» из математики.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 600 130\" width=\"600\" style=\"min-width:432px\" role=\"img\" aria-label=\"Переменная — подписанная «коробка» со значением; у значения есть тип\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-var\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><text x=\"95\" y=\"30\" class=\"s-t s-b s-mono\" text-anchor=\"middle\">n<\/text><rect x=\"20\" y=\"40\" width=\"150\" height=\"52\" rx=\"8\" class=\"f-acc\"/><text x=\"95.0\" y=\"71.0\" class=\"s-t s-mono\" text-anchor=\"middle\" style=\"font-size:18px\">128<\/text><text x=\"95\" y=\"115\" class=\"s-tm s-mono\" text-anchor=\"middle\">int<\/text><text x=\"285\" y=\"30\" class=\"s-t s-b s-mono\" text-anchor=\"middle\">name<\/text><rect x=\"210\" y=\"40\" width=\"150\" height=\"52\" rx=\"8\" class=\"f-acc\"/><text x=\"285.0\" y=\"71.0\" class=\"s-t s-mono\" text-anchor=\"middle\" style=\"font-size:18px\">\"AES\"<\/text><text x=\"285\" y=\"115\" class=\"s-tm s-mono\" text-anchor=\"middle\">str<\/text><text x=\"475\" y=\"30\" class=\"s-t s-b s-mono\" text-anchor=\"middle\">ok<\/text><rect x=\"400\" y=\"40\" width=\"150\" height=\"52\" rx=\"8\" class=\"f-acc\"/><text x=\"475.0\" y=\"71.0\" class=\"s-t s-mono\" text-anchor=\"middle\" style=\"font-size:18px\">True<\/text><text x=\"475\" y=\"115\" class=\"s-tm s-mono\" text-anchor=\"middle\">bool<\/text><\/svg><\/div><figcaption>Переменная — подписанная «коробка» со значением; у значения есть тип<\/figcaption><\/figure>\n<pre><code>key_bits = 128\nprint(key_bits)          # 128\nkey_bits = key_bits * 2  # взять старое значение, умножить, положить обратно\nprint(key_bits)          # 256<\/code><\/pre>\n<p>Имена пишутся латиницей, без пробелов: <code>key_bits<\/code>, <code>n<\/code>, <code>total<\/code>. Большие и маленькие буквы различаются:\n<code>N<\/code> и <code>n<\/code> — разные переменные.<\/p>\n<h3>Ввод: input()<\/h3>\n<p><code>input()<\/code> ждёт, пока пользователь введёт строку и нажмёт Enter, и возвращает её <b>как текст<\/b>. Чтобы считать,\nтекст надо превратить в число функцией <code>int()<\/code>:<\/p>\n<pre><code>a = int(input())   # пользователь вводит 17\nb = int(input())   # пользователь вводит 5\nprint(a + b)       # 22\nprint(a * b)       # 85<\/code><\/pre>\n<p>Без <code>int<\/code> получилось бы <code>\"17\" + \"5\"<\/code> = <code>175<\/code> — склейка строк. Это самая частая ошибка новичков.<\/p>\n<p>Если два числа введены в одной строке через пробел (<code>17 5<\/code>), их читают так:\n<code>a, b = map(int, input().split())<\/code> — <code>split()<\/code> режет строку по пробелам, <code>map(int, …)<\/code> превращает каждую часть в число.<\/p>"}, {"id": "w1l6s4", "t": "choice", "html": "<p>Пользователь ввёл <code>7<\/code>. Что выведет программа?<\/p><pre><code>x = input()\nprint(x * 3)<\/code><\/pre>", "opts": [["<code>777<\/code>", true, "Верно: x — строка «7», а строка, умноженная на 3, повторяется трижды."], ["<code>21<\/code>", false, "Было бы так, если бы написали int(input())."], ["Ошибку", false, "Строку можно умножать на целое число — она повторится."]]}, {"id": "w1l6s5", "t": "text", "html": "<h3>Как читать сообщение об ошибке<\/h3>\n<p>Ошибки — нормальная часть программирования. Python подробно говорит, что случилось. Читайте <b>последнюю строку<\/b> —\nтам тип и причина, — и номер строки выше неё:<\/p>\n<pre><code>Traceback (most recent call last):\n  File \"main.py\", line 2, in &lt;module&gt;\n    print(a + 1)\nTypeError: can only concatenate str (not \"int\") to str<\/code><\/pre>\n<p>Здесь: строка 2, <code>a<\/code> — текст (забыли <code>int<\/code>), а к тексту нельзя прибавить число.<\/p>\n<table>\n<tr><th>Ошибка<\/th><th>Что значит<\/th><th>Что делать<\/th><\/tr>\n<tr><td><code>SyntaxError<\/code><\/td><td>Python не понял запись<\/td><td>Проверьте скобки, кавычки и двоеточие после if/for/while/def<\/td><\/tr>\n<tr><td><code>IndentationError<\/code><\/td><td>Неверный отступ<\/td><td>Внутри if/for/while/def — ровно 4 пробела<\/td><\/tr>\n<tr><td><code>NameError<\/code><\/td><td>Неизвестное имя<\/td><td>Опечатка в имени или переменная ещё не создана<\/td><\/tr>\n<tr><td><code>TypeError<\/code><\/td><td>Операция не подходит к типу<\/td><td>Часто: забыли <code>int()<\/code> после <code>input()<\/code><\/td><\/tr>\n<tr><td><code>ValueError<\/code><\/td><td>Неподходящее значение<\/td><td><code>int(\"7a\")<\/code> — в строке не число<\/td><\/tr>\n<tr><td><code>ZeroDivisionError<\/code><\/td><td>Деление на ноль<\/td><td>Проверьте делитель<\/td><\/tr>\n<\/table>\n<h3>Как учиться программировать<\/h3>\n<ul>\n<li>Набирайте примеры руками, а не копируйте: так быстрее запоминается.<\/li>\n<li>Меняйте пример и угадывайте результат до запуска — потом проверяйте.<\/li>\n<li>Не понимаете, что делает программа, — добавьте <code>print<\/code> в середину и посмотрите значения переменных.<\/li>\n<li>Застряли больше чем на 20 минут — откройте подсказку к задаче: они идут от идеи к плану и к каркасу кода.<\/li>\n<\/ul>"}, {"id": "w1l6s6", "t": "choice", "html": "<p>Программа упала с сообщением <code>NameError: name 'pirnt' is not defined<\/code>. В чём дело?<\/p>", "opts": [["Опечатка: <code>pirnt<\/code> вместо <code>print<\/code>", true, "Верно: Python не знает имени pirnt."], ["Нужно установить модуль pirnt", false, "Такого модуля нет — это просто опечатка."], ["Не хватает отступа", false, "Тогда была бы IndentationError."]]}]}, {"title": "Python: переменные, типы, ввод-вывод, условия", "steps": [{"id": "w1l7s1", "t": "text", "html": "<h3>Переменные и типы<\/h3>\n<pre><code>n = 128          # int — целое, любой длины\nx = 3.5          # float — дробное\nok = n &gt;= 112    # bool — True или False\nname = \"AES\"     # str — строка<\/code><\/pre>\n<p>Целые числа в Python не переполняются: <code>2 ** 256<\/code> вычисляется точно. Это пригодится в криптографии.<\/p>\n<h3>Арифметика<\/h3>\n<p><code>+ - *<\/code>; <code>/<\/code> — обычное деление (результат float); <code>//<\/code> — неполное частное; <code>%<\/code> — остаток; <code>**<\/code> — степень.<\/p>\n<pre><code>print(17 // 5, 17 % 5)    # 3 2\nprint(-17 // 5, -17 % 5)  # -4 3  (остаток всегда 0 ≤ r &lt; b при b &gt; 0)\nint(2**128 / 10**12) != 2**128 // 10**12   # True: / даёт float, он теряет цифры<\/code><\/pre>\n<h3>Сравнения<\/h3>\n<pre><code>a == b      # равно (два знака; один «=» — присваивание)\na != b      # не равно\na &lt; b, a &lt;= b, a &gt; b, a &gt;= b\nn % d == 0  # d делит n без остатка<\/code><\/pre>\n<p>Результат сравнения — <code>True<\/code> или <code>False<\/code> (тип bool). <code>x += 1<\/code> — короткая запись <code>x = x + 1<\/code>; так же работают <code>-=<\/code>, <code>*=<\/code>, <code>//=<\/code>.<\/p>\n<h3>Ввод и вывод<\/h3>\n<pre><code>a = int(input())         # читаем строку и превращаем в целое\nprint(a, a * 2)          # вывод через пробел\nprint(f\"a = {a}\")        # f-строка<\/code><\/pre>\n<h3>Условия<\/h3>\n<pre><code>if n &lt; 112:\n    print(\"мало\")\nelif n &lt; 128:\n    print(\"минимум\")\nelse:\n    print(\"хорошо\")<\/code><\/pre><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 580 260\" width=\"580\" style=\"min-width:417px\" role=\"img\" aria-label=\"if / elif / else: проверки идут сверху вниз, выполняется первая подходящая ветка\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-if\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><polygon points=\"140,12 245,40 140,68 35,40\" class=\"f-acc2\"/><text x=\"140\" y=\"45\" class=\"s-t s-mono\" text-anchor=\"middle\">n < 112 ?<\/text><polygon points=\"140,112 245,140 140,168 35,140\" class=\"f-acc2\"/><text x=\"140\" y=\"145\" class=\"s-t s-mono\" text-anchor=\"middle\">n < 128 ?<\/text><rect x=\"330\" y=\"20\" width=\"220\" height=\"40\" rx=\"8\" class=\"f-soft\"/><text x=\"440.0\" y=\"45.0\" class=\"s-t s-mono\" text-anchor=\"middle\">print(\"мало\")<\/text><rect x=\"330\" y=\"120\" width=\"220\" height=\"40\" rx=\"8\" class=\"f-soft\"/><text x=\"440.0\" y=\"145.0\" class=\"s-t s-mono\" text-anchor=\"middle\">print(\"минимум\")<\/text><rect x=\"40\" y=\"210\" width=\"200\" height=\"40\" rx=\"8\" class=\"f-soft\"/><text x=\"140.0\" y=\"235.0\" class=\"s-t s-mono\" text-anchor=\"middle\">print(\"хорошо\")<\/text><line x1=\"245\" y1=\"40\" x2=\"328\" y2=\"40\" class=\"s-ln\" marker-end=\"url(#ar-if)\"/><text x=\"285\" y=\"33\" class=\"s-tm\" text-anchor=\"middle\">да<\/text><line x1=\"245\" y1=\"140\" x2=\"328\" y2=\"140\" class=\"s-ln\" marker-end=\"url(#ar-if)\"/><text x=\"285\" y=\"133\" class=\"s-tm\" text-anchor=\"middle\">да<\/text><line x1=\"140\" y1=\"68\" x2=\"140\" y2=\"110\" class=\"s-ln\" marker-end=\"url(#ar-if)\"/><text x=\"160\" y=\"94\" class=\"s-tm\" text-anchor=\"start\">нет<\/text><line x1=\"140\" y1=\"168\" x2=\"140\" y2=\"208\" class=\"s-ln\" marker-end=\"url(#ar-if)\"/><text x=\"160\" y=\"194\" class=\"s-tm\" text-anchor=\"start\">нет<\/text><text x=\"250\" y=\"236\" class=\"s-tm\" text-anchor=\"start\">← else<\/text><\/svg><\/div><figcaption>if / elif / else: проверки идут сверху вниз, выполняется первая подходящая ветка<\/figcaption><\/figure>\n<p>Отступ (4 пробела) показывает, какие строки относятся к ветке.<\/p>"}, {"id": "w1l7s2", "t": "choice", "html": "<p>Что выведет <code>print(7 / 2, 7 // 2, 7 % 2)<\/code>?<\/p>", "opts": [["3.5 3 1", true, "Верно."], ["3 3 1", false, "/ всегда даёт float."], ["3.5 3.5 1", false, "// — неполное частное, целое."], ["3.5 3 0.5", false, "% — остаток от деления."]], "multi": false}, {"id": "w1l7s3", "t": "text", "html": "<h3>Как проверить программу<\/h3>\n<ul>\n<li>Запустите программу и введите строки из колонки «Ввод» примера. Данные приходят через <code>input()<\/code>: каждый вызов читает <b>одну строку<\/b> как текст.<\/li>\n<li>Число из строки получают так: <code>a = int(input())<\/code>. Два числа в двух строках — два вызова <code>input()<\/code>.<\/li>\n<li>Вывод сравнивается с ответом <b>точно<\/b>. Печатайте только ответ: <code>input(\"Введите a: \")<\/code> тоже печатает текст, и ответ не совпадёт.<\/li>\n<li>Лишние пробелы и пустые строки не важны, лишние слова и строки — важны.<\/li>\n<\/ul>\n<pre><code>a = int(input())   # 1-я строка ввода\nb = int(input())   # 2-я строка ввода\nprint(a + b)       # только ответ<\/code><\/pre>"}, {"id": "w1l7s4", "t": "code", "html": "<p><b>Деление с остатком.<\/b> Даны целые a и b (b &gt; 0), каждое в отдельной строке. Выведите в одной строке через пробел неполное частное и остаток.<\/p>\n<p>Пример ввода (два числа — две строки, значит, два <code>input()<\/code>):<\/p>\n<pre><code>17\n5<\/code><\/pre>\n<p>Пример вывода:<\/p>\n<pre><code>3 2<\/code><\/pre>\n<p>Числа могут быть отрицательными и очень большими — используйте <code>//<\/code> и <code>%<\/code>, а не <code>/<\/code>.<\/p>", "io": [["17\n5", "3 2"], ["0\n7", "0 0"], ["-1\n2", "-1 1"]], "limits": "", "hints": ["Прочитайте два числа: каждое в своей строке — значит, два вызова <code>input()<\/code>, каждый обернуть в <code>int()<\/code>.", "Неполное частное — <code>a // b<\/code>, остаток — <code>a % b<\/code>. Они правильно работают и для отрицательных, и для очень больших чисел.", "<pre><code>a = int(input())\nb = int(input())\nprint(..., ...)<\/code><\/pre>"]}, {"id": "w1l7s5", "t": "code", "html": "<p><b>Оценка длины ключа.<\/b> Дано целое n — длина симметричного ключа в битах. Выведите:<\/p>\n<ul><li><code>слабый<\/code>, если n &lt; 112;<\/li><li><code>допустимый<\/code>, если 112 ≤ n &lt; 128;<\/li><li><code>стойкий<\/code>, если n ≥ 128.<\/li><\/ul>\n<p>Пример: ввод <code>112<\/code> → вывод <code>допустимый<\/code>. Печатайте одно слово строчными буквами, без кавычек.<\/p>\n<p>(Упрощённо, по рекомендациям NIST: минимум 112 бит, рекомендуется 128 и больше.)<\/p>", "io": [["0", "слабый"], ["112", "допустимый"], ["127", "допустимый"]], "limits": "", "hints": ["Это задача на <code>if / elif / else<\/code> — посмотрите схему в уроке выше.", "Проверяйте границы по порядку: сначала <code>n &lt; 112<\/code>, затем <code>n &lt; 128<\/code>, иначе — стойкий. Слова печатайте точно как в условии.", "<pre><code>n = int(input())\nif n &lt; 112:\n    print(&quot;слабый&quot;)\nelif ...:\n    ...\nelse:\n    ...<\/code><\/pre>"]}]}, {"title": "Разминка: код и задачи Парсонса", "steps": [{"id": "w1l8s1", "t": "text", "html": "<h3>Если вывод не совпал с примером<\/h3>\n<p>Как программа получает данные и что печатать — в шаге «Как проверить программу» предыдущего урока. Коротко: одна строка входа — один <code>input()<\/code>, без подсказки внутри; печатайте только ответ, столько строк и в том порядке, как в примере.<\/p>\n<h3>Что видно и что делать<\/h3>\n<p>Запускайте программу на примерах из условия и на своих данных столько раз, сколько нужно.<\/p>\n<table border=\"1\" cellpadding=\"4\">\n<tbody><tr><th>Что видно<\/th><th>Что значит<\/th><th>Что делать<\/th><\/tr>\n<tr><td>Вывод не совпал с примером<\/td><td>Ответ неверный<\/td><td>Сравните строки по одной. Проверьте и другие данные: отрицательные числа, ноль, очень большие числа<\/td><\/tr>\n<tr><td><code>Traceback<\/code> и строка <code>…Error<\/code><\/td><td>Программа упала с ошибкой<\/td><td>Смотрите последнюю строку ошибки. <code>ValueError: invalid literal for int()<\/code> часто значит, что вы читаете два числа одним <code>input()<\/code><\/td><\/tr>\n<tr><td>Программа ничего не печатает<\/td><td>Ждёт ввода или работает слишком долго<\/td><td>Введите данные; если не помогло — проверьте, что цикл <code>while<\/code> заканчивается (остановка — Ctrl+C)<\/td><\/tr>\n<\/tbody><\/table>"}, {"id": "w1l8s2", "t": "choice", "html": "<p>Программа должна прочитать целое число и вывести его квадрат. Какой вариант пройдёт проверку?<\/p>", "opts": [["<code>n = int(input())<br>print(n * n)<\/code>", true, "Верно: читаем число без подсказки и печатаем только ответ."], ["<code>n = int(input(\"Введите число: \"))<br>print(n * n)<\/code>", false, "Текст «Введите число:» попадёт в вывод, и ответ не совпадёт с правильным."], ["<code>n = int(input())<br>print(\"Ответ:\", n * n)<\/code>", false, "Печатайте только число, без слова «Ответ»."], ["<code>n = input()<br>print(n * n)<\/code>", false, "input() возвращает строку, а строку нельзя умножить на строку — программа упадёт. Нужно int(input())."]], "multi": false}, {"id": "w1l8s3", "t": "code", "html": "<p><b>Разминка.<\/b> Даны два целых числа a и b, каждое в своей строке. Выведите в первой строке их сумму, во второй — разность a − b.<\/p>\n<p>Пример ввода:<\/p>\n<pre><code>7\n10<\/code><\/pre>\n<p>Пример вывода:<\/p>\n<pre><code>17\n-3<\/code><\/pre>\n<p>Запустите программу на примере, затем на своих числах. Если вывод не совпал — сравните его с примером построчно.<\/p>", "io": [["7\n10", "17\n-3"], ["-5\n-5", "-10\n0"], ["123456789123456789\n987654321987654321", "1111111111111111110\n-864197532864197532"]], "limits": ""}, {"id": "w1l8s4", "t": "text", "html": "<h3>Задачи Парсонса<\/h3>\n<p>В такой задаче программа уже написана, но её строки перемешаны и у всех убраны отступы. Нужно расставить строки в правильном порядке <b>и<\/b> выставить каждой правильный отступ. Проверяется и то, и другое.<\/p>\n<ul>\n<li><b>Порядок:<\/b> перетащите строку мышью или нажимайте стрелки <b>↑ ↓<\/b> у строки.<\/li>\n<li><b>Отступ:<\/b> стрелки <b>⇥ ⇤<\/b> у строки сдвигают её вправо и влево на один уровень (это 4 пробела в настоящей программе).<\/li>\n<\/ul>\n<p>Как понять, какой нужен отступ: строка, которая заканчивается двоеточием (<code>for<\/code>, <code>while<\/code>, <code>if<\/code>, <code>else<\/code>), открывает блок. Строки, которые выполняются <b>внутри<\/b> этого блока, сдвигаются на один уровень правее неё. Строка, которая выполняется уже <b>после<\/b> блока, возвращается на уровень заголовка.<\/p>\n<pre><code>for i in range(3):     # уровень 0\n    print(i)           # уровень 1 — повторяется 3 раза\nprint(\"готово\")        # уровень 0 — выполнится один раз, после цикла<\/code><\/pre>"}, {"id": "w1l8s5", "t": "parsons", "html": "<p><b>Разминка.<\/b> Соберите программу: прочитать целое число и напечатать «чётное» или «нечётное». Порядок меняйте стрелками ↑ ↓, отступ — стрелками ⇥ ⇤.<\/p>", "lines": [[0, "n = int(input())"], [0, "if n % 2 == 0:"], [1, "print(\"чётное\")"], [0, "else:"], [1, "print(\"нечётное\")"]]}]}, {"title": "Циклы for и while", "steps": [{"id": "w1l9s1", "t": "text", "html": "<h3>Цикл for<\/h3>\n<pre><code>for i in range(5):        # 0, 1, 2, 3, 4\n    print(i, 2 ** i)\nfor d in range(1, n + 1): # от 1 до n включительно\n    ...<\/code><\/pre>\n<h3>Цикл while<\/h3>\n<p>Повторяет тело, пока условие истинно. Важно, чтобы условие когда-нибудь стало ложным.<\/p>\n<pre><code>n = 1000\nsteps = 0\nwhile n &gt; 0:\n    n = n // 10    # отбрасываем последнюю цифру\n    steps += 1\nprint(steps)       # 4 — столько цифр в числе 1000<\/code><\/pre><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 580 245\" width=\"580\" style=\"min-width:417px\" role=\"img\" aria-label=\"Цикл while: проверка → тело → снова проверка, пока условие истинно\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-wh\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><rect x=\"30\" y=\"20\" width=\"160\" height=\"40\" rx=\"8\" class=\"f-soft\"/><text x=\"110.0\" y=\"45.0\" class=\"s-t s-mono\" text-anchor=\"middle\">steps = 0<\/text><polygon points=\"110,90 215,118 110,146 5,118\" class=\"f-acc2\"/><text x=\"110\" y=\"123\" class=\"s-t s-mono\" text-anchor=\"middle\">n > 0 ?<\/text><rect x=\"300\" y=\"98\" width=\"260\" height=\"40\" rx=\"8\" class=\"f-soft\"/><text x=\"430.0\" y=\"123.0\" class=\"s-t s-mono\" text-anchor=\"middle\">n = n // 10;  steps += 1<\/text><rect x=\"30\" y=\"190\" width=\"160\" height=\"40\" rx=\"8\" class=\"f-soft\"/><text x=\"110.0\" y=\"215.0\" class=\"s-t s-mono\" text-anchor=\"middle\">print(steps)<\/text><line x1=\"110\" y1=\"60\" x2=\"110\" y2=\"88\" class=\"s-ln\" marker-end=\"url(#ar-wh)\"/><line x1=\"215\" y1=\"118\" x2=\"298\" y2=\"118\" class=\"s-ln\" marker-end=\"url(#ar-wh)\"/><text x=\"255\" y=\"110\" class=\"s-tm\" text-anchor=\"middle\">да<\/text><path d=\"M430,98 L430,76 L150,76 L150,90\" class=\"s-ln\" fill=\"none\" marker-end=\"url(#ar-wh)\"/><text x=\"290\" y=\"70\" class=\"s-tm\" text-anchor=\"middle\">повторить проверку<\/text><line x1=\"110\" y1=\"146\" x2=\"110\" y2=\"188\" class=\"s-ln\" marker-end=\"url(#ar-wh)\"/><text x=\"125\" y=\"172\" class=\"s-tm\" text-anchor=\"start\">нет<\/text><\/svg><\/div><figcaption>Цикл while: проверка → тело → снова проверка, пока условие истинно<\/figcaption><\/figure>\n<h3>Накопление результата<\/h3>\n<pre><code>total = 0\nfor i in range(1, 11):\n    total += i\nprint(total)       # 55<\/code><\/pre><p><b>Трассировка<\/b> — выписываем переменные после каждого прохода цикла:<\/p>\n<table><tr><th>Проход<\/th><th>n<\/th><th>steps<\/th><th>n &gt; 0?<\/th><\/tr>\n<tr><td>до цикла<\/td><td>1000<\/td><td>0<\/td><td>да<\/td><\/tr><tr><td>1<\/td><td>100<\/td><td>1<\/td><td>да<\/td><\/tr>\n<tr><td>2<\/td><td>10<\/td><td>2<\/td><td>да<\/td><\/tr><tr><td>3<\/td><td>1<\/td><td>3<\/td><td>да<\/td><\/tr>\n<tr><td>4<\/td><td>0<\/td><td>4<\/td><td>нет → выход<\/td><\/tr><\/table>"}, {"id": "w1l9s2", "t": "parsons", "html": "<p>Соберите программу, которая выводит все делители числа n (по одному в строке). Расставьте строки и отступы.<\/p><p><i>Порядок строк меняйте стрелками ↑ ↓ (или перетаскиванием), отступ — стрелками ⇥ ⇤. Строки внутри for и if сдвигаются вправо. Подробнее — в предыдущем уроке «Как сдавать код и задачи Парсонса».<\/i><\/p>", "lines": [[0, "n = int(input())"], [0, "for d in range(1, n + 1):"], [1, "if n % d == 0:"], [2, "print(d)"]]}, {"id": "w1l9s3", "t": "code", "html": "<p><b>Степени двойки.<\/b> Дано n (0 ≤ n ≤ 64). Для каждого i от 0 до n включительно выведите строку из двух чисел: i и 2 в степени i (в Python — <code>2 ** i<\/code>; знак <code>^<\/code> в Python означает другую операцию).<\/p>\n<p>Пример: ввод <code>2<\/code> → вывод:<br><code>0 1<\/code><br><code>1 2<\/code><br><code>2 4<\/code><\/p>", "io": [["0", "0 1"], ["1", "0 1\n1 2"], ["10", "0 1\n1 2\n2 4\n3 8\n4 16\n5 32\n6 64\n7 128\n8 256\n9 512\n10 1024"]], "limits": "", "hints": ["Нужен цикл <code>for<\/code> по i от 0 до n <b>включительно<\/b>: <code>range(n + 1)<\/code>.", "В теле цикла печатайте два значения через пробел: <code>print(i, 2 ** i)<\/code>.", "<pre><code>n = int(input())\nfor i in range(...):\n    print(...)<\/code><\/pre>"]}, {"id": "w1l9s4", "t": "code", "html": "<p><b>Сколько бит нужно.<\/b> Дано целое n ≥ 1. Выведите, сколько бит нужно для записи n в двоичной системе.<\/p>\n<p>Решите циклом <code>while<\/code>: делите n на 2, пока оно не станет 0, и считайте шаги. Не используйте <code>bin<\/code> и <code>bit_length<\/code>.<\/p>\n<p>Примеры: 1 → 1; 255 → 8; 256 → 9.<\/p>", "io": [["1", "1"], ["255", "8"], ["1000000000000000000", "60"]], "limits": "", "hints": ["Каждое деление на 2 нацело «отрезает» один двоичный разряд. Сколько раз делим, пока n не станет 0, — столько и бит.", "Заведите счётчик <code>bits = 0<\/code>; пока <code>n &gt; 0<\/code>: <code>n = n // 2<\/code> и <code>bits += 1<\/code>. Проверьте на n = 1 (1 бит) и n = 256 (9 бит).", "<pre><code>n = int(input())\nbits = 0\nwhile n &gt; 0:\n    ...\n    ...\nprint(bits)<\/code><\/pre>"]}, {"id": "w1l9s5", "t": "code", "html": "<p><b>П1. Калькулятор полного перебора.<\/b> Даны три целых числа, каждое в своей строке: A — размер алфавита, L — длина ключа (пароля), v — скорость перебора в ключах в секунду.<\/p>\n<p>Выведите три строки:<\/p>\n<ol><li>число всех возможных ключей A<sup>L<\/sup>;<\/li><li>время полного перебора в секундах (целая часть);<\/li><li>время в годах (целая часть), считая год равным 365 суткам.<\/li><\/ol>\n<p>Числа бывают огромными (2<sup>128<\/sup>). Считайте только целыми операциями <code>**<\/code> и <code>//<\/code>: деление <code>/<\/code> даёт float, у него около 16 значащих цифр, и ответ получится неточным.<\/p>\n<p>Пример: 4-значный PIN (A = 10, L = 4) при v = 1000 → <code>10000<\/code>, <code>10<\/code>, <code>0<\/code>.<\/p>", "io": [["10\n4\n1000", "10000\n10\n0"], ["2\n56\n1000000000", "72057594037927936\n72057594\n2"], ["2\n1\n1", "2\n2\n0"]], "limits": "", "hints": ["Число ключей — A в степени L (<code>A ** L<\/code>). Время в секундах — число ключей, делённое на скорость, целая часть.", "Делите только целочисленно (<code>//<\/code>), не <code>/<\/code>: на огромных числах дробное деление теряет точность. Год = 365·24·60·60 секунд.", "<pre><code>A = int(input())\nL = int(input())\nv = int(input())\nkeys = A ** L\nsec = keys // v\nyear = 365 * 24 * 60 * 60\nprint(keys)\nprint(sec)\nprint(...)<\/code><\/pre>"]}]}, {"title": "Двоичная и шестнадцатеричная системы (начало)", "steps": [{"id": "w1l10s1", "t": "text", "html": "<h3>Что значит «позиционная» запись<\/h3><p style=\"text-align:center;\"><img alt=\"Числа 2026, 1101 в двоичной и 2F в шестнадцатеричной системе с весами разрядов\" src=\"/media/attachments/lesson/2612701/w01_positional.png\" style=\"height:auto;\"><\/p>\n<p>Каждая цифра умножается на «вес» своего места, и всё складывается. Вес самого правого разряда — 1, каждый следующий влево в «основание» раз больше: в десятичной ×10, в двоичной ×2, в шестнадцатеричной ×16. Поэтому одна и та же запись «10» означает десять, два или шестнадцать — смотря по основанию.<\/p>\n<p><b>Зачем это криптографии.<\/b> Компьютер хранит всё в двоичной системе: ключ AES-128 — это 128 двоичных разрядов. Шестнадцатеричная запись — удобная «упаковка» двоичной: одна hex-цифра ровно 4 бита, байт — ровно две hex-цифры.<\/p>"}, {"id": "w1l10s2", "t": "widget", "kind": "base", "html": ""}, {"id": "w1l10s3", "t": "text", "html": "<h3>Перевод из десятичной: деление с остатком<\/h3><p style=\"text-align:center;\"><img alt=\"Перевод 13 в двоичную систему последовательным делением на 2\" src=\"/media/attachments/lesson/2612701/w01_div_convert.png\" style=\"height:auto;\"><\/p>\n<p>Остаток от деления на 2 — это самый правый двоичный разряд: он показывает, чётное число или нет. Частное — число без этого разряда. Повторяем, пока частное не станет 0, и читаем остатки снизу вверх.<\/p>\n<p><b>Проверка обратным переводом:<\/b> 1101₂ = 8 + 4 + 0 + 1 = 13 ✓. Проверяйте так каждую ручную задачу — это занимает 10 секунд.<\/p>"}, {"id": "w1l10s4", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Сколько будет 1011₂ в десятичной системе?<\/p>", "opts": [["11", true, "Верно: 8 + 0 + 2 + 1 = 11."], ["1011", false, "Это запись в двоичной системе. Переведите: каждая цифра на свой вес 8, 4, 2, 1."], ["13", false, "13 = 1101₂. Проверьте порядок цифр."], ["7", false, "Это 0111₂. Старший разряд 1011₂ весит 8."]], "multi": false}, {"id": "w1l10s5", "t": "text", "html": "<h3>Позиционная запись<\/h3>\n<p>В десятичной системе 345 = 3·10<sup>2<\/sup> + 4·10<sup>1<\/sup> + 5·10<sup>0<\/sup>. В двоичной — то же, но по степеням двойки: 1011<sub>2<\/sub> = 1·8 + 0·4 + 1·2 + 1·1 = 11.<\/p>\n<h3>Перевод 10 → 2<\/h3>\n<p>Делим на 2, записываем остатки, читаем <b>снизу вверх<\/b>: 11 → 5 ост. 1 → 2 ост. 1 → 1 ост. 0 → 0 ост. 1 ⇒ 1011.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 620 165\" width=\"620\" style=\"min-width:446px\" role=\"img\" aria-label=\"Слева: 1011₂ → 11 (сумма весов под единицами). Справа: 11 → 1011₂ (деление на 2)\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-pos\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><text x=\"56\" y=\"28\" class=\"s-tm s-mono\" text-anchor=\"middle\">8<\/text><text x=\"56\" y=\"44\" class=\"s-tm s-mono\" text-anchor=\"middle\">2<tspan dy='-6' font-size='10'>3<\/tspan><\/text><rect x=\"30\" y=\"52\" width=\"52\" height=\"52\" rx=\"8\" class=\"f-acc\"/><text x=\"56.0\" y=\"83.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:22px\">1<\/text><text x=\"118\" y=\"28\" class=\"s-tm s-mono\" text-anchor=\"middle\">4<\/text><text x=\"118\" y=\"44\" class=\"s-tm s-mono\" text-anchor=\"middle\">2<tspan dy='-6' font-size='10'>2<\/tspan><\/text><rect x=\"92\" y=\"52\" width=\"52\" height=\"52\" rx=\"8\" class=\"f-soft\"/><text x=\"118.0\" y=\"83.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:22px\">0<\/text><text x=\"180\" y=\"28\" class=\"s-tm s-mono\" text-anchor=\"middle\">2<\/text><text x=\"180\" y=\"44\" class=\"s-tm s-mono\" text-anchor=\"middle\">2<tspan dy='-6' font-size='10'>1<\/tspan><\/text><rect x=\"154\" y=\"52\" width=\"52\" height=\"52\" rx=\"8\" class=\"f-acc\"/><text x=\"180.0\" y=\"83.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:22px\">1<\/text><text x=\"242\" y=\"28\" class=\"s-tm s-mono\" text-anchor=\"middle\">1<\/text><text x=\"242\" y=\"44\" class=\"s-tm s-mono\" text-anchor=\"middle\">2<tspan dy='-6' font-size='10'>0<\/tspan><\/text><rect x=\"216\" y=\"52\" width=\"52\" height=\"52\" rx=\"8\" class=\"f-acc\"/><text x=\"242.0\" y=\"83.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:22px\">1<\/text><text x=\"150\" y=\"135\" class=\"s-t s-mono\" text-anchor=\"middle\">8 + 0 + 2 + 1 = 11<\/text><text x=\"360\" y=\"40\" class=\"s-t s-mono\" text-anchor=\"start\">11 : 2 = 5<\/text><text x=\"500\" y=\"40\" class=\"s-tm\" text-anchor=\"start\">ост.<\/text><rect x=\"535\" y=\"22\" width=\"26\" height=\"24\" rx=\"5\" class=\"f-ok\"/><text x=\"548\" y=\"39\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">1<\/text><text x=\"360\" y=\"68\" class=\"s-t s-mono\" text-anchor=\"start\">5 : 2 = 2<\/text><text x=\"500\" y=\"68\" class=\"s-tm\" text-anchor=\"start\">ост.<\/text><rect x=\"535\" y=\"50\" width=\"26\" height=\"24\" rx=\"5\" class=\"f-ok\"/><text x=\"548\" y=\"67\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">1<\/text><text x=\"360\" y=\"96\" class=\"s-t s-mono\" text-anchor=\"start\">2 : 2 = 1<\/text><text x=\"500\" y=\"96\" class=\"s-tm\" text-anchor=\"start\">ост.<\/text><rect x=\"535\" y=\"78\" width=\"26\" height=\"24\" rx=\"5\" class=\"f-ok\"/><text x=\"548\" y=\"95\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">0<\/text><text x=\"360\" y=\"124\" class=\"s-t s-mono\" text-anchor=\"start\">1 : 2 = 0<\/text><text x=\"500\" y=\"124\" class=\"s-tm\" text-anchor=\"start\">ост.<\/text><rect x=\"535\" y=\"106\" width=\"26\" height=\"24\" rx=\"5\" class=\"f-ok\"/><text x=\"548\" y=\"123\" class=\"s-t s-mono s-b\" text-anchor=\"middle\">1<\/text><line x1=\"585\" y1=\"124\" x2=\"585\" y2=\"26\" class=\"s-ln\" marker-end=\"url(#ar-pos)\"/><text x=\"470\" y=\"156\" class=\"s-t s-b\" text-anchor=\"middle\">читаем снизу вверх: 1011<\/text><\/svg><\/div><figcaption>Слева: 1011₂ → 11 (сумма весов под единицами). Справа: 11 → 1011₂ (деление на 2)<\/figcaption><\/figure>\n<h3>Шестнадцатеричная система<\/h3>\n<p>Цифры 0–9 и A–F (A = 10, …, F = 15). Одна hex-цифра — ровно 4 бита, поэтому перевод 16 ↔ 2 делается по группам: 0x2F = 0010 1111. Байт (8 бит, 0…255) записывается двумя hex-цифрами — так в криптографии записывают ключи и хеши.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 540 155\" width=\"540\" style=\"min-width:388px\" role=\"img\" aria-label=\"Перевод 16 ↔ 2 делается по группам из 4 бит\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar-hexg\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"s-arrow\"/><\/marker><\/defs><rect x=\"90\" y=\"15\" width=\"60\" height=\"44\" rx=\"8\" class=\"f-acc2\"/><text x=\"120.0\" y=\"42.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:22px\">2<\/text><line x1=\"120\" y1=\"59\" x2=\"120\" y2=\"78\" class=\"s-ln\" marker-end=\"url(#ar-hexg)\"/><rect x=\"60\" y=\"82\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"73.5\" y=\"99.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"90\" y=\"82\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"103.5\" y=\"99.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"120\" y=\"82\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"133.5\" y=\"99.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"150\" y=\"82\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"163.5\" y=\"99.0\" class=\"s-t s-mono\" text-anchor=\"middle\">0<\/text><rect x=\"340\" y=\"15\" width=\"60\" height=\"44\" rx=\"8\" class=\"f-acc2\"/><text x=\"370.0\" y=\"42.0\" class=\"s-t s-mono s-b\" text-anchor=\"middle\" style=\"font-size:22px\">F<\/text><line x1=\"370\" y1=\"59\" x2=\"370\" y2=\"78\" class=\"s-ln\" marker-end=\"url(#ar-hexg)\"/><rect x=\"310\" y=\"82\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"323.5\" y=\"99.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"340\" y=\"82\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"353.5\" y=\"99.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"370\" y=\"82\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"383.5\" y=\"99.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><rect x=\"400\" y=\"82\" width=\"27\" height=\"27\" rx=\"5\" class=\"f-acc\"/><text x=\"413.5\" y=\"99.0\" class=\"s-t s-mono\" text-anchor=\"middle\">1<\/text><text x=\"30\" y=\"42\" class=\"s-tm s-mono\" text-anchor=\"end\" style=\"font-size:20px\">0x<\/text><text x=\"270\" y=\"140\" class=\"s-t\" text-anchor=\"middle\">0x2F = 0010 1111 = 47: одна hex-цифра ↔ ровно 4 бита<\/text><\/svg><\/div><figcaption>Перевод 16 ↔ 2 делается по группам из 4 бит<\/figcaption><\/figure>\n<p><b>10 → 16:<\/b> делим на 16, остатки 10–15 пишем буквами: 200 = 12·16 + 8, 12 = 0·16 + 12 ⇒ <b>C8<\/b> (проверка: 12·16 + 8 = 200). Можно и через двоичную: 200 = 1100 1000₂ → C 8. Группы по 4 бита отсчитывают <b>справа<\/b>, левую неполную группу дополняют нулями: 101111₂ = 0010 1111 = 2F.<\/p>\n<h3>В Python<\/h3>\n<pre><code>print(bin(11), hex(255))        # 0b1011 0xff\nprint(int(\"1011\", 2), int(\"ff\", 16))  # 11 255\nprint(0b1011, 0xFF)             # 11 255\nbin(11)[2:]            # '1011' — [2:] отрезает первые два символа «0b»\nhex(255)[2:].upper()   # 'FF'   — .upper() делает буквы заглавными<\/code><\/pre>"}, {"id": "w1l10s6", "t": "example", "html": "<h3>Разбор: переводы между системами<\/h3><p><b>10 → 2<\/b>, число 156: делим на 2 и записываем остатки.<\/p><table><tr><th>Деление<\/th><th>Частное<\/th><th>Остаток<\/th><\/tr><tr><td>156 : 2<\/td><td>78<\/td><td>0<\/td><\/tr><tr><td>78 : 2<\/td><td>39<\/td><td>0<\/td><\/tr><tr><td>39 : 2<\/td><td>19<\/td><td>1<\/td><\/tr><tr><td>19 : 2<\/td><td>9<\/td><td>1<\/td><\/tr><tr><td>9 : 2<\/td><td>4<\/td><td>1<\/td><\/tr><tr><td>4 : 2<\/td><td>2<\/td><td>0<\/td><\/tr><tr><td>2 : 2<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>1 : 2<\/td><td>0<\/td><td>1<\/td><\/tr><\/table><p>Читаем остатки снизу вверх: <b>10011100<\/b>. Проверка: <code>bin(156)<\/code> = <code>0b10011100<\/code>.<\/p><p><b>2 → 10<\/b>, число 101101<sub>2<\/sub>: складываем веса единиц: 32 + 8 + 4 + 1 = <b>45<\/b>.<\/p><p><b>10 → 16<\/b>, число 200: делим на 16.<\/p><table><tr><th>Деление<\/th><th>Частное<\/th><th>Остаток<\/th><\/tr><tr><td>200 : 16<\/td><td>12<\/td><td>8 → 8<\/td><\/tr><tr><td>12 : 16<\/td><td>0<\/td><td>12 → C<\/td><\/tr><\/table><p>Снизу вверх: <b>C8<\/b>.<\/p><p><b>16 → 2<\/b>, число 3B<sub>16<\/sub>: каждую цифру — в 4 бита: 0011 1011 → <b>111011<\/b> (ведущие нули можно не писать).<\/p>"}, {"id": "w1l10s7", "t": "dataset", "html": "<p><b>Перевод 10 ↔ 2.<\/b> Во входных данных две строки: число n в десятичной записи и число m в двоичной.<\/p>\n<p>Формат ответа: <code>двоичная запись n; десятичная запись m<\/code>, например <code>1011; 45<\/code><\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["108\n10000011", "1101100; 131"], ["237\n1100101", "11101101; 101"], ["62\n1101111", "111110; 111"]]}, {"id": "w1l10s8", "t": "dataset", "html": "<p><b>Перевод 10 → 16 и 16 → 2.<\/b> Во входных данных две строки: число n в десятичной записи и число m в шестнадцатеричной.<\/p>\n<p>Формат ответа: <code>шестнадцатеричная запись n; двоичная запись m<\/code>, например <code>2F; 101111<\/code><\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["123\n92", "7B; 10010010"], ["252\n74", "FC; 1110100"], ["77\n7E", "4D; 1111110"]]}, {"id": "w1l10s9", "t": "code", "html": "<p><b>bin и hex.<\/b> Дано целое n ≥ 0. Выведите в первой строке его двоичную запись без префикса <code>0b<\/code>, во второй — шестнадцатеричную заглавными буквами без префикса <code>0x<\/code>.<\/p>\n<p>Пример: 255 → <code>11111111<\/code>, <code>FF<\/code>.<\/p>", "io": [["0", "0\n0"], ["255", "11111111\nFF"], ["1000000000000000000000000000000", "1100100111110010110010011100110100000100011001110100111011011110101001000000000000000000000000000000\nC9F2C9CD04674EDEA40000000"]], "limits": "", "hints": ["<code>bin(n)<\/code> возвращает строку вида <code>'0b1011'<\/code>, <code>hex(n)<\/code> — <code>'0xff'<\/code>. Нужно убрать первые два символа и сделать буквы заглавными.", "Срез <code>s[2:]<\/code> отбрасывает префикс, метод <code>.upper()<\/code> делает буквы заглавными.", "<pre><code>n = int(input())\nprint(bin(n)[2:])\nprint(...)<\/code><\/pre>"]}, {"id": "w1l10s10", "t": "code", "html": "<p><b>⭐ Любое основание.<\/b> Даны целые n ≥ 0 и b (2 ≤ b ≤ 36), каждое в своей строке. Выведите запись n в системе с основанием b; цифры больше 9 — заглавные латинские буквы A–Z.<\/p>\n<p>Примеры: 255, 16 → <code>FF<\/code>; 36, 36 → <code>10<\/code>; 0, 2 → <code>0<\/code>.<\/p>\n<p>Подсказка: цифра для остатка r — это <code>\"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ\"[r]<\/code> (символ номер r, счёт с 0). Строки склеиваются знаком +: новую цифру ставьте слева, <code>s = цифра + s<\/code>.<\/p>", "io": [["0\n2", "0"], ["36\n36", "10"], ["1\n3", "1"]], "limits": "", "hints": ["Тот же алгоритм, что и для двоичной системы: делите на b и собирайте остатки, затем читайте их в обратном порядке.", "Цифры берите из строки <code>DIGITS = \"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ\"<\/code>: остаток r превращается в <code>DIGITS[r]<\/code>. Отдельно обработайте n = 0 — ответ «0».", "<pre><code>DIGITS = &quot;0123456789ABCDEFGHIJKLMNOP
