width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#f59e0b;fill-opacity:.85\"/><text x=\"556.5\" y=\"65\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"568\" y=\"51\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#ec4899;fill-opacity:.85\"/><text x=\"577.5\" y=\"65\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"589\" y=\"51\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#6366f1;fill-opacity:.85\"/><text x=\"598.5\" y=\"65\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"526\" y=\"72\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#f59e0b;fill-opacity:.85\"/><text x=\"535.5\" y=\"86\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"547\" y=\"72\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#ec4899;fill-opacity:.85\"/><text x=\"556.5\" y=\"86\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"568\" y=\"72\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#6366f1;fill-opacity:.85\"/><text x=\"577.5\" y=\"86\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"589\" y=\"72\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#0ea5e9;fill-opacity:.85\"/><text x=\"598.5\" y=\"86\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"526\" y=\"93\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#ec4899;fill-opacity:.85\"/><text x=\"535.5\" y=\"107\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"547\" y=\"93\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#6366f1;fill-opacity:.85\"/><text x=\"556.5\" y=\"107\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"568\" y=\"93\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#0ea5e9;fill-opacity:.85\"/><text x=\"577.5\" y=\"107\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><rect x=\"589\" y=\"93\" width=\"19\" height=\"19\" rx=\"3\" style=\"fill:#f59e0b;fill-opacity:.85\"/><text x=\"598.5\" y=\"107\" class=\"s-w\" text-anchor=\"middle\" style=\"font-size:10px\">⊕<\/text><text x=\"567\" y=\"22\" class=\"s-t s-b\" text-anchor=\"middle\" style=\"font-size:13px\">AddRoundKey<\/text><line x1=\"486\" y1=\"71\" x2=\"518\" y2=\"71\" class=\"s-ln\" marker-end=\"url(#ar-aes)\"/><text x=\"55\" y=\"136\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:12px\">16 байт = 4×4<\/text><text x=\"183\" y=\"136\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:12px\">байт → S(байт)<\/text><text x=\"311\" y=\"136\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:12px\">строка i ← на i<\/text><text x=\"439\" y=\"136\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:12px\">столбец × матрица<\/text><text x=\"567\" y=\"136\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:12px\">XOR с ключом раунда<\/text><text x=\"330\" y=\"166\" class=\"s-tm\" text-anchor=\"middle\" style=\"font-size:12px\">Цвет — исходный столбец: после ShiftRows байты одного столбца расходятся по разным<\/text><\/svg><\/div><figcaption>Один раунд AES: четыре преобразования состояния 4×4<\/figcaption><\/figure>\n<p>Полную реализацию AES писать не нужно: в работе используйте библиотеку (нед. 9). Цель — понимать, откуда в AES конечные поля.<\/p>"}, {"id": "w8l1s11", "t": "choice", "html": "<p>Почему модуль AES 0x11B должен быть неприводимым многочленом?<\/p>", "opts": [["Иначе у некоторых ненулевых байтов не будет обратного, и S-box не построить", true, ""], ["Иначе xtime будет работать медленнее", false, "Скорость здесь ни при чём."], ["Так короче записывать константу", false, "Выбор модуля определяется математикой, а не записью."], ["Неприводимость нужна только для ShiftRows", false, "ShiftRows — перестановка байтов, поле ей не нужно."]]}, {"id": "w8l1s12", "t": "choice", "html": "<p>Сколько раундов у AES-128?<\/p>", "opts": [["10", true, ""], ["12", false, "12 — у AES-192."], ["14", false, "14 — у AES-256."], ["16", false, "Столько раундов у DES."]]}, {"id": "w8l1s13", "t": "matching", "html": "<p>Сопоставьте операцию раунда AES и её роль.<\/p>", "pairs": [["SubBytes", "нелинейная замена байтов (confusion)"], ["ShiftRows", "разносит байты столбца по разным столбцам"], ["MixColumns", "перемешивает байты внутри столбца (diffusion)"], ["AddRoundKey", "подмешивает ключ раунда через XOR"]]}]}, {"title": "Ручные задачи: GF(2^3), xtime, умножение, MixColumns", "steps": [{"id": "w8l2s1", "t": "example", "html": "<h3>Разбор: умножение в GF(2<sup>3<\/sup>)<\/h3><p>110 · 111 с модулем x<sup>3<\/sup> + x + 1 = 1011. Умножаем «в столбик», но складываем через XOR: для каждой единицы в 111 сдвигаем 110 влево.<\/p><pre><code>  00110\n  01100\n  11000\n  -----\n= 10010   (степень ≥ 3 — приводим)\n10010 ⊕ 10110 = 00100<\/code><\/pre><p>Результат: <b>100<\/b>. Приведение — это XOR с модулем 1011, сдвинутым под старший единичный бит, пока степень ≥ 3.<\/p><p class=\"ans\">Ответ в формате задачи: <code>100<\/code><\/p><h3>Разбор: цепочка xtime<\/h3><p>b = C3. xtime: сдвиг влево; если старший бит был 1 — XOR с 1B.<\/p><table><tr><th>b<\/th><th>Биты<\/th><th>Старший бит 1?<\/th><th>xtime(b)<\/th><\/tr><tr><td>C3<\/td><td>11000011<\/td><td>да → ⊕ 1B<\/td><td>9D<\/td><\/tr><tr><td>9D<\/td><td>10011101<\/td><td>да → ⊕ 1B<\/td><td>21<\/td><\/tr><tr><td>21<\/td><td>00100001<\/td><td>нет<\/td><td>42<\/td><\/tr><tr><td>42<\/td><td>01000010<\/td><td>нет<\/td><td>84<\/td><\/tr><\/table><p class=\"ans\">Ответ в формате задачи: <code>9D 21 42 84<\/code><\/p><h3>Разбор: умножение байтов<\/h3><p>A2 · 0B. Раскладываем 0B = 01 ⊕ 02 ⊕ 08 по степеням двойки и строим цепочку xtime для A2.<\/p><table><tr><th>Произведение<\/th><th>Значение<\/th><th>Берём<\/th><\/tr><tr><td>A2·01<\/td><td>A2<\/td><td>✔<\/td><\/tr><tr><td>A2·02<\/td><td>5F<\/td><td>✔<\/td><\/tr><tr><td>A2·04<\/td><td>BE<\/td><td><\/td><\/tr><tr><td>A2·08<\/td><td>67<\/td><td>✔<\/td><\/tr><\/table><p>Складываем отмеченные через XOR: A2 ⊕ 5F ⊕ 67 = <b>9A<\/b>.<\/p><p class=\"ans\">Ответ в формате задачи: <code>9A<\/code><\/p><h3>Разбор: один байт MixColumns<\/h3><p>Столбец [D4 BF 5D 30]. b0 = 02·a0 ⊕ 03·a1 ⊕ a2 ⊕ a3; умножение на 03 = xtime(x) ⊕ x.<\/p><ol><li>02·D4 = xtime(D4) = B3<\/li><li>03·BF = xtime(BF) ⊕ BF = 65 ⊕ BF = DA<\/li><li>b0 = B3 ⊕ DA ⊕ 5D ⊕ 30 = <b>04<\/b> (пример из стандарта FIPS-197)<\/li><\/ol><p class=\"ans\">Ответ в формате задачи: <code>04<\/code><\/p>"}, {"id": "w8l2s2", "t": "dataset", "html": "<p><b>Умножение в GF(2<sup>3<\/sup>).<\/b> Во входных данных два элемента a и b поля GF(2<sup>3<\/sup>) с модулем x<sup>3<\/sup> + x + 1, записанные тремя битами. Найдите a·b и запишите тремя битами (например, <code>100<\/code>).<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["101 110", "011"], ["101 110", "011"], ["011 101", "100"]]}, {"id": "w8l2s3", "t": "dataset", "html": "<p><b>Цепочка xtime.<\/b> Во входных данных байт b (hex). Вычислите b·{02}, b·{04}, b·{08}, b·{10} в GF(2<sup>8<\/sup>) последовательным применением xtime — все числа шестнадцатеричные, {10} = x<sup>4<\/sup> (четыре xtime подряд). Запишите четыре байта в hex через пробел.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["8B", "0D 1A 34 68"], ["84", "13 26 4C 98"], ["5D", "BA 6F DE A7"]]}, {"id": "w8l2s4", "t": "dataset", "html": "<p><b>Умножение байтов.<\/b> Во входных данных байты a и b (hex). Вычислите a·b в GF(2<sup>8<\/sup>) (модуль 0x11B). Разложите b по степеням двойки и сложите (XOR) нужные результаты xtime.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["7B 0E", "F4"], ["FC 0C", "7C"], ["4D 0C", "71"]]}, {"id": "w8l2s5", "t": "dataset", "html": "<p><b>Один байт MixColumns.<\/b> Во входных данных столбец состояния [a0 a1 a2 a3] (hex). Вычислите первый байт результата: b0 = 02·a0 ⊕ 03·a1 ⊕ a2 ⊕ a3. Запишите b0 в hex.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["D6 1C B2 D4", "F5"], ["C9 B1 B7 EE", "18"], ["7B DD 9F DF", "CA"]]}]}, {"title": "ЛР-5 (мини). Конечные поля: GF(2^8) в коде", "steps": [{"id": "w8l3s1", "t": "text", "html": "<h3>Лабораторная работа 5 (мини)<\/h3>\n<p>Пишем модуль <code>gf256.py<\/code>: <code>xtime<\/code>, <code>gf256_mul<\/code>, <code>mix_column<\/code>, ⭐ <code>sbox<\/code>. Проверяем тест-векторами стандарта FIPS-197.<\/p>\n<p>Функции из предыдущих задач (например, <code>xtime<\/code>) копируйте в решение, чтобы каждый файл запускался сам по себе. Свой файл <code>gf256.py<\/code> и импорт <code>from gf256 import …<\/code> делайте у себя на компьютере (урок «Python на своём компьютере», неделя 7): оба файла кладут в одну папку.<\/p>\n<h3>Python: маски, сдвиги, тест-векторы<\/h3>\n<p>Битовые операции подробно — неделя 7, урок «Python: bytes, bytearray…».<\/p>\n<pre><code>b &lt;&lt; 1          # сдвиг влево (умножение на x)\nb &amp; 0x100       # проверка бита 8\nb ^ 0x11B       # XOR с модулем\n(b &gt;&gt; i) &amp; 1    # i-й бит числа\nf\"{b:02x}\"      # байт в hex с ведущим нулём<\/code><\/pre>\n<p>Свой модуль и тест-векторы:<\/p>\n<pre><code># gf256.py\ndef xtime(b): ...\ndef gf256_mul(a, b): ...\n\nif __name__ == \"__main__\":\n    assert xtime(0x57) == 0xAE\n    assert gf256_mul(0x57, 0x83) == 0xC1\n    print(\"все тест-векторы пройдены\")<\/code><\/pre>\n<p>Тест-вектор из стандарта — лучший способ поймать ошибку: если assert не прошёл, ошибка у вас, а не в стандарте.<\/p>"}, {"id": "w8l3s2", "t": "parsons", "html": "<p>Соберите файл с проверкой тест-векторов: функция <code>test_vectors<\/code> вызывается только при прямом запуске файла.<\/p>", "lines": [[0, "from gf256 import xtime, gf256_mul"], [0, "def test_vectors():"], [1, "assert xtime(0x57) == 0xAE"], [1, "assert gf256_mul(0x57, 0x83) == 0xC1"], [0, "if __name__ == \"__main__\":"], [1, "test_vectors()"], [1, "print(\"OK\")"]]}, {"id": "w8l3s3", "t": "code", "html": "<p><b>ЛР-5.1. xtime.<\/b> Напишите <code>xtime(b)<\/code>: умножение байта b (0..255) на {02} в GF(2<sup>8<\/sup>) с модулем 0x11B. Результат — int 0..255.<\/p>\n", "tpl": "def xtime(b):\n    # ваш код\n    pass", "calls": [["xtime(87)", "174", ""], ["xtime(34)", "68", ""], ["xtime(78)", "156", ""], ["xtime(122)", "244", ""], ["xtime(167)", "85", ""], ["xtime(210)", "191", ""], ["xtime(253)", "225", ""]], "limits": "", "hints": ["Сдвиг влево: <code>b &lt;&lt; 1<\/code> (то же, что b·2). Если результат ≥ 0x100 (вышел бит 8) — XOR с 0x11B. Схема xtime — в теории.", "Проверьте тест-векторы: <code>xtime(0x57) == 0xAE<\/code>, <code>xtime(0xAE) == 0x47<\/code>.", "<pre><code>def xtime(b):\n    b = b &lt;&lt; 1\n    if b &amp; 0x100:\n        b ^= ...\n    return b<\/code><\/pre>"]}, {"id": "w8l3s4", "t": "code", "html": "<p><b>ЛР-5.2. Умножение в GF(2<sup>8<\/sup>).<\/b> Напишите <code>gf256_mul(a, b)<\/code> методом shift-and-add через xtime. Тест-векторы: {57}·{83} = {C1}, {57}·{13} = {FE}, {53}·{CA} = {01}.<\/p>\n", "tpl": "def xtime(b):\n    # из ЛР-5.1\n    pass\n\n\ndef gf256_mul(a, b):\n    # ваш код\n    pass", "calls": [["gf256_mul(87, 131)", "193", ""], ["gf256_mul(153, 59)", "225", ""], ["gf256_mul(203, 196)", "49", ""], ["gf256_mul(225, 31)", "74", ""], ["gf256_mul(59, 7)", "161", ""], ["gf256_mul(247, 52)", "209", ""], ["gf256_mul(120, 227)", "106", ""]], "limits": "", "hints": ["Shift-and-add: идите по битам b справа налево. Бит 1 — <code>result ^= a<\/code>; затем <code>a = xtime(a)<\/code>, <code>b &gt;&gt;= 1<\/code>. Сложение в GF(2<sup>8<\/sup>) — это XOR.", "Это то же самое, что «Разбор: умножение байтов» в ручных задачах, только в коде. Тест-векторы: 57·83 = C1, 57·13 = FE.", "<pre><code>def gf256_mul(a, b):\n    result = 0\n    while b &gt; 0:\n        if b &amp; 1:\n            result ^= ...\n        a = ...\n        b &gt;&gt;= 1\n    return result<\/code><\/pre>"]}, {"id": "w8l3s5", "t": "code", "html": "<p><b>ЛР-5.3. MixColumns для одного столбца.<\/b> Напишите <code>mix_column(col)<\/code>: col — список из 4 байтов, вернуть новый список из 4 байтов:<\/p>\n<pre><code>b0 = 02·a0 ⊕ 03·a1 ⊕ a2 ⊕ a3\nb1 = a0 ⊕ 02·a1 ⊕ 03·a2 ⊕ a3\nb2 = a0 ⊕ a1 ⊕ 02·a2 ⊕ 03·a3\nb3 = 03·a0 ⊕ a1 ⊕ a2 ⊕ 02·a3<\/code><\/pre>\n<p>Тест-вектор: [db 13 53 45] → [8e 4d a1 bc].<\/p>", "tpl": "def xtime(b):\n    # из ЛР-5.1\n    pass\n\n\ndef gf256_mul(a, b):\n    # из ЛР-5.2\n    pass\n\n\ndef mix_column(col):\n    # ваш код\n    pass", "calls": [["mix_column([219, 19, 83, 69])", "[142, 77, 161, 188]", ""], ["mix_column([88, 226, 210, 165])", "[250, 79, 241, 137]", ""], ["mix_column([68, 53, 43, 197])", "[57, 150, 115, 67]", ""], ["mix_column([113, 8, 223, 241])", "[212, 234, 212, 189]", ""], ["mix_column([205, 170, 201, 81])", "[252, 147, 29, 141]", ""], ["mix_column([157, 87, 38, 115])", "[141, 42, 19, 43]", ""], ["mix_column([193, 153, 144, 167])", "[30, 228, 145, 4]", ""]], "limits": "", "hints": ["Умножение на 02 — <code>xtime(x)<\/code>, на 03 — <code>xtime(x) ^ x<\/code>, на 01 — само x. Сложение — XOR.", "Распишите четыре формулы из условия, используя вспомогательные mul2 и mul3. Сверьтесь с «Разбор: один байт MixColumns».", "<pre><code>def mix_column(col):\n    a0, a1, a2, a3 = col\n    mul2 = lambda x: xtime(x)\n    mul3 = lambda x: xtime(x) ^ x\n    b0 = mul2(a0) ^ mul3(a1) ^ a2 ^ a3\n    b1 = ...\n    b2 = ...\n    b3 = ...\n    return [b0, b1, b2, b3]<\/code><\/pre>"]}, {"id": "w8l3s6", "t": "code", "html": "<p><b>⭐ ЛР-5.4. S-box AES.<\/b> Напишите <code>sbox(b)<\/code>: сначала x = b<sup>−1<\/sup> в GF(2<sup>8<\/sup>) (для b = 0 считаем x = 0; обратный — через x = b<sup>254<\/sup>), затем аффинное преобразование: бит i результата = x<sub>i<\/sub> ⊕ x<sub>(i+4) mod 8<\/sub> ⊕ x<sub>(i+5) mod 8<\/sub> ⊕ x<sub>(i+6) mod 8<\/sub> ⊕ x<sub>(i+7) mod 8<\/sub> ⊕ c<sub>i<\/sub>, где c = 0x63.<\/p>\n<p>Тест-векторы: S(00) = 63, S(01) = 7C, S(53) = ED. Дополнительная проверка: значения <code>sbox(0)<\/code>, …, <code>sbox(255)<\/code> все различны — S-box является перестановкой 256 байтов.<\/p>", "tpl": "def sbox(b):\n    # ваш код\n    pass", "calls": [["sbox(0)", "99", ""], ["sbox(39)", "204", ""], ["sbox(82)", "0", ""], ["sbox(126)", "243", ""], ["sbox(168)", "194", ""], ["sbox(211)", "102", ""], ["sbox(254)", "187", ""]], "limits": "", "hints": ["Обратный: x = b<sup>254<\/sup> в GF(2<sup>8<\/sup>) — возведение в степень, как mod_pow, только умножение — ваш gf256_mul. Для b = 0 берите x = 0.", "Аффинное преобразование побитно: <code>bit(v, i) = (v &gt;&gt; i) &amp; 1<\/code>. Бит результата i = x<sub>i<\/sub> ⊕ x<sub>(i+4) mod 8<\/sub> ⊕ x<sub>(i+5) mod 8<\/sub> ⊕ x<sub>(i+6) mod 8<\/sub> ⊕ x<sub>(i+7) mod 8<\/sub> ⊕ c<sub>i<\/sub>, c = 0x63; собирайте <code>res |= бит &lt;&lt; i<\/code>.", "Проверка: S(00) = 63, S(01) = 7C, S(53) = ED."]}]}]}];
const KEY = 'mobak-theory-w1-8';
const WEEK_COLORS = ['#6366f1', '#0ea5e9', '#14b8a6', '#f97316', '#e11d48', '#8b5cf6', '#10b981', '#d97706'];
const TYPE = {
  text: ['📖', 'Теория', 'var(--c-text)'], choice: ['❓', 'Вопрос', 'var(--c-quiz)'], number: ['❓', 'Вопрос', 'var(--c-quiz)'],
  matching: ['🔗', 'Сопоставление', 'var(--c-quiz)'], parsons: ['🧩', 'Собери код', 'var(--c-quiz)'],
  dataset: ['✍️', 'Ручная задача', 'var(--c-dataset)'], example: ['🔍', 'Разбор на примере', '#06b6d4'], code: ['💻', 'Программирование', 'var(--c-code)'], widget: ['🎛️', 'Тренажёр', 'var(--c-widget)'],
};

/* ---------- состояние ---------- */
let S = { steps: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast('Браузер не даёт сохранять прогресс. Сохраняйте его в файл через меню ⋯'); } }
}
const rec = id => (S.steps[id] = S.steps[id] || {});
const STEPS = {}, LESSONS = [];
COURSE.forEach(w => { w.color = WEEK_COLORS[(w.n - 1) % WEEK_COLORS.length]; w.lessons.forEach((l, li) => {
  l.key = 'w' + w.n + 'l' + (li + 1); l.week = w; LESSONS.push(l);
  l.steps.forEach((s, si) => { s.lesson = l; s.num = si + 1; STEPS[s.id] = s; });
}); });

/* ---------- утилиты ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
function el(tag, attrs = {}, html) {

    '<p>Выполнено <b>' + t.d + '</b> из ' + t.n + ' заданий</p><div class="bar" style="margin-top:10px"><i style="width:' + (100 * t.d / t.n).toFixed(1) + '%"></i></div>');
  const nxt = LESSONS.find(l => { const s = lessonStat(l); return s.n && s.d < s.n; });
  const acts = el('div', { class: 'actions', style: 'margin-top:16px;position:relative' });
  acts.append(el('button', { on: { click: () => location.hash = (t.d ? nxt || LESSONS[0] : LESSONS[0]).key } }, t.d ? 'Продолжить →' : 'Начать →'),
    el('button', { class: 'ghost', on: { click: () => location.hash = LESSONS[1].key } }, 'Как запускать код'));
  hero.appendChild(acts);
  m.appendChild(hero);
  const lg = el('div', { class: 'legend' });
  [['text', 'Теория'], ['example', 'Разборы'], ['widget', 'Тренажёры'], ['choice', 'Вопросы'], ['dataset', 'Ручные задачи'], ['code', 'Программирование']].forEach(([k, n]) => lg.appendChild(el('span', { style: '--c:' + TYPE[k][2] }, TYPE[k][0] + ' ' + n)));
  m.appendChild(lg);
  const grid = el('div', { class: 'weeks' });
  COURSE.forEach(w => {
    const ws = weekStat(w), c = el('div', { class: 'wcard', style: '--c:' + w.color, role: 'link', tabindex: '0' });
    c.innerHTML = '<div class="band"><b>Неделя</b><span class="big">' + w.n + '</span></div><div class="in"><h3>' + esc(short(w.title)) + '</h3>' +
      '<ul>' + w.lessons.map(l => '<li>' + esc(l.title) + '</li>').join('') + '</ul>' +
      '<div class="ring">' + ringSvg(ws.n ? ws.d / ws.n : 0, w.color) + '<span>выполнено ' + ws.d + ' из ' + ws.n + '</span></div></div>';
    const go = () => location.hash = w.lessons[0].key;
    c.addEventListener('click', go); c.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    grid.appendChild(c);
  });
  m.appendChild(grid);
  window.scrollTo(0, 0);
}
function lesson(l) {
  CUR = l; drawSide();
  document.documentElement.style.setProperty('--wk', l.week.color);
  const m = $('#main'); m.innerHTML = '';
  const head = el('div', { class: 'lhead' }, '<div class="crumbs">Неделя ' + l.week.n + ' · ' + esc(short(l.week.title)) + '</div><h1>' + esc(l.title) + '</h1>');
  if (l.steps.length > 1) {
    const bar = el('div', { class: 'stepbar' });
    l.steps.forEach(s => bar.appendChild(el('a', { id: 'sb-' + s.id, class: isDone(s) ? 'full' : '', href: 'javascript:void 0',
      title: TYPE[s.t][1] + ': ' + stepTitle(s), on: { click: () => document.getElementById(s.id).scrollIntoView({ behavior: 'smooth' }) } }, TYPE[s.t][0] + ' ' + s.num)));
    head.appendChild(bar);
  }
  m.appendChild(head);
  l.steps.forEach(s => {
    const [icon, name, color] = TYPE[s.t];
    const card = el('section', { class: 'step', id: s.id, style: '--c:' + color });
    const h = el('div', { class: 'step-h' }, '<span class="chip">' + icon + ' ' + name + (l.steps.length > 1 ? ' · шаг ' + s.num : '') + '</span>');
    if (isTask(s)) h.appendChild(el('span', { id: 'badge-' + s.id, class: 'badge' + (isDone(s) ? ' full' : '') }, isDone(s) ? '✓ выполнено' : 'не выполнено'));
    const body = el('div', { class: 'body' }, s.html);
    enhance(body);
    card.append(h, body);
    if (R[s.t]) R[s.t](s, card);
    m.appendChild(card);
  });
  const i = LESSONS.indexOf(l), pager = el('div', { class: 'pager' });
  pager.append(i > 0 ? el('button', { on: { click: () => location.hash = LESSONS[i - 1].key } }, '← ' + esc(LESSONS[i - 1].title)) : el('span'),
    i < LESSONS.length - 1 ? el('button', { class: 'primary', on: { click: () => location.hash = LESSONS[i + 1].key } }, esc(LESSONS[i + 1].title) + ' →') : el('span'));
  m.appendChild(pager);
  const t = lessonStat(l); if (t.n && t.d === t.n) celebrate();
  window.scrollTo(0, 0);
}
function route() {
  document.body.classList.remove('nav-open');
  const k = location.hash.slice(1), l = LESSONS.find(x => x.key === k);
  l ? lesson(l) : home();
}
function menu() {
  if ($('.menu')) return $('.menu').remove();
  const mn = el('div', { class: 'menu' });
  const item = (t, fn) => mn.appendChild(el('button', { on: { click: () => { mn.remove(); fn(); } } }, t));
  item('💾 Сохранить прогресс в файл', () => download('МОБАК_прогресс.json', JSON.stringify(S), 'application/json'));
  item('📂 Загрузить прогресс из файла', () => {
    const f = el('input', { type: 'file', accept: '.json,application/json' });
    f.onchange = async () => { try { const o = JSON.parse(await f.files[0].text()); if (!o.steps) throw 0; S = Object.assign({ steps: {} }, o); save(); refreshChrome(); route(); toast('Прогресс загружен'); } catch (e) { toast('Это не файл прогресса'); } };
    f.click();
  });
  item('🌓 Тема: светлая / тёмная', () => { const cur = document.documentElement.dataset.theme; const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem(KEY + '-theme', document.documentElement.dataset.theme); } catch (e) {} });
  item('🧹 Сбросить прогресс', () => { if (confirm('Удалить все отметки и ответы? Это нельзя отменить.')) { S = { steps: {} }; save(); refreshChrome(); route(); } });
  document.body.appendChild(mn);
  setTimeout(() => document.addEventListener('click', function off(e) { if (!mn.contains(e.target)) { mn.remove(); document.removeEventListener('click', off); } }), 0);
}

try { const th = localStorage.getItem(KEY + '-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
$('#navBtn').onclick = () => document.body.classList.toggle('nav-open');
$('#brand').onclick = () => location.hash = '';
$('#moreBtn').onclick = menu;
window.addEventListener('hashchange', route);
refreshChrome(); route();
</script>
</body>
