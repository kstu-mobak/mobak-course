а: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["5 42 61", "19"], ["38 47 59", "46"], ["29 21 37", "19"]]}, {"id": "w4l2s4", "t": "dataset", "html": "<p><b>Линейное сравнение.<\/b> Во входных данных числа a, b и простое p. Решите a·x ≡ b (mod p). Запишите x от 0 до p−1.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["34 33 61", "53"], ["38 46 59", "54"], ["29 20 37", "16"]]}, {"id": "w4l2s5", "t": "dataset", "html": "<p><b>Делители нуля.<\/b> Во входных данных составное n. Перечислите через пробел в порядке возрастания все a от 1 до n−1, которые являются делителями нуля в Z_n (то есть a·b ≡ 0 (mod n) для некоторого b из 1…n−1).<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["22", "2 4 6 8 10 11 12 14 16 18 20"], ["22", "2 4 6 8 10 11 12 14 16 18 20"], ["18", "2 3 4 6 8 9 10 12 14 15 16"]]}]}, {"title": "Шифр Цезаря и аффинный шифр", "steps": [{"id": "w4l3s1", "t": "text", "html": "<h3>Шифры над Z_26<\/h3>\n<p>Пронумеруем буквы: a = 0, b = 1, …, z = 25.<\/p>\n<ul>\n<li><b>Цезарь:<\/b> E(x) = x + k mod 26. Ключей всего 26.<\/li>\n<li><b>Аффинный шифр:<\/b> E(x) = a·x + b mod 26, расшифрование D(y) = a⁻¹·(y − b) mod 26. Ключ корректен, только если НОД(a, 26) = 1, иначе a⁻¹ не существует и разные буквы склеятся. Подходящих a — 12, ключей — 12·26 = 312.<\/li>\n<\/ul>\n<p>По принципу Керкгоффса алгоритм известен противнику, а 312 ключей перебираются за доли секунды. Эти шифры — учебный пример модульной арифметики, а не защита.<\/p>\n<p>Пример: ключ (a, b) = (5, 8), буква h = 7 → 5·7 + 8 = 43 ≡ 17 = r.<\/p>"}, {"id": "w4l3s2", "t": "widget", "kind": "affine", "html": ""}, {"id": "w4l3s3", "t": "example", "html": "<h3>Разбор: аффинное шифрование<\/h3><p>Ключ (5, 8), слово «dog». Нумеруем буквы a = 0 … z = 25 и считаем 5·x + 8 mod 26.<\/p><table><tr><th>Буква<\/th><th>x<\/th><th>a·x + b<\/th><th>mod 26<\/th><th>Шифр<\/th><\/tr><tr><td>d<\/td><td>3<\/td><td>5·3 + 8 = 23<\/td><td>23<\/td><td>x<\/td><\/tr><tr><td>o<\/td><td>14<\/td><td>5·14 + 8 = 78<\/td><td>0<\/td><td>a<\/td><\/tr><tr><td>g<\/td><td>6<\/td><td>5·6 + 8 = 38<\/td><td>12<\/td><td>m<\/td><\/tr><\/table><p class=\"ans\">Ответ в формате задачи: <code>xam<\/code><\/p>"}, {"id": "w4l3s4", "t": "dataset", "html": "<p><b>Аффинное шифрование.<\/b> Во входных данных ключ a, b и слово из строчных латинских букв. Зашифруйте слово: E(x) = a·x + b mod 26 (a = 0, …, z = 25). Запишите шифртекст.<\/p><p class=\"note\">✍️ Ручная задача: решите на бумаге, без калькулятора, для данных ниже.<\/p>", "data": [["17 17 rsa", "ulr"], ["17 19 byte", "klej"], ["9 14 zero", "fylk"]]}]}, {"title": "Python: f-строки и чтение ошибок", "steps": [{"id": "w4l4s1", "t": "text", "html": "<h3>f-строки: значение и формат<\/h3>\n<p>В f-строке после двоеточия пишут <b>формат<\/b>: ширину, выравнивание, систему счисления.<\/p>\n<table style=\"\">\n<tbody><tr style=\"background:#EEF2F6;\"><th style=\"padding:4px 10px;\">Запись<\/th><th style=\"padding:4px 10px;\">Результат<\/th><th style=\"padding:4px 10px;\">Что значит<\/th><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>f\"{255:x}\"<\/code><\/td><td style=\"padding:4px 10px;\"><code>ff<\/code><\/td><td style=\"padding:4px 10px;\">шестнадцатеричная<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>f\"{5:02x}\"<\/code><\/td><td style=\"padding:4px 10px;\"><code>05<\/code><\/td><td style=\"padding:4px 10px;\">не меньше 2 цифр, слева нули — так записывают байты<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>f\"{5:08b}\"<\/code><\/td><td style=\"padding:4px 10px;\"><code>00000101<\/code><\/td><td style=\"padding:4px 10px;\">двоичная, 8 бит<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>f\"{42:&gt;6}\"<\/code><\/td><td style=\"padding:4px 10px;\"><code>␣␣␣␣42<\/code><\/td><td style=\"padding:4px 10px;\">ширина 6, вправо (для чисел так по умолчанию)<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>f\"{'ab':&lt;6}|\"<\/code><\/td><td style=\"padding:4px 10px;\"><code>ab␣␣␣␣|<\/code><\/td><td style=\"padding:4px 10px;\">ширина 6, влево (для строк по умолчанию)<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>f\"{7:03}\"<\/code><\/td><td style=\"padding:4px 10px;\"><code>007<\/code><\/td><td style=\"padding:4px 10px;\">ширина 3, нули слева<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>f\"{3.14159:.2f}\"<\/code><\/td><td style=\"padding:4px 10px;\"><code>3.14<\/code><\/td><td style=\"padding:4px 10px;\">2 знака после точки<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>f\"{2**40:,}\"<\/code><\/td><td style=\"padding:4px 10px;\"><code>1,099,511,627,776<\/code><\/td><td style=\"padding:4px 10px;\">разделитель тысяч<\/td><\/tr>\n<\/tbody><\/table>\n<p>␣ — пробел. Таблица трассировки с ровными столбцами:<\/p>\n<pre><code>print(f\"{'a':&gt;6}{'b':&gt;6}\")\nprint(f\"{240:&gt;6}{46:&gt;6}\")\n#      a     b\n#    240    46<\/code><\/pre>\n<h3>Как читать сообщение об ошибке (traceback)<\/h3>\n<pre><code>Traceback (most recent call last):\n  File \"lab.py\", line 12, in &lt;module&gt;\n    print(mod_inverse(3, 7))\n  File \"lab.py\", line 8, in mod_inverse\n    g, x = egcd(a, n)\nValueError: too many values to unpack (expected 2)<\/code><\/pre>\n<ol>\n<li><b>Читайте снизу.<\/b> Последняя строка — тип ошибки и пояснение: функция вернула больше значений, чем переменных слева.<\/li>\n<li><b>Строкой выше — где упало:<\/b> файл, номер строки (8), функция (mod_inverse) и сам код.<\/li>\n<li><b>Ещё выше — кто вызвал:<\/b> строка 12 вызвала mod_inverse.<\/li>\n<\/ol>\n<table style=\"\">\n<tbody><tr style=\"background:#EEF2F6;\"><th style=\"padding:4px 10px;\">Ошибка<\/th><th style=\"padding:4px 10px;\">Обычная причина<\/th><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>NameError<\/code><\/td><td style=\"padding:4px 10px;\">опечатка в имени или переменная не создана<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>TypeError<\/code><\/td><td style=\"padding:4px 10px;\">не тот тип: <code>\"5\" + 1<\/code>, вызов с неверным числом аргументов, операция с <code>None<\/code><\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>ValueError<\/code><\/td><td style=\"padding:4px 10px;\">тип верный, значение нет: <code>int(\"7a\")<\/code>, распаковка не того количества<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>IndexError<\/code> / <code>KeyError<\/code><\/td><td style=\"padding:4px 10px;\">нет такого индекса в списке / ключа в словаре<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>ZeroDivisionError<\/code><\/td><td style=\"padding:4px 10px;\">деление или <code>%<\/code> на ноль<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\"><code>IndentationError<\/code><\/td><td style=\"padding:4px 10px;\">сбиты отступы<\/td><\/tr>\n<\/tbody><\/table>\n<p><b>Если ошибки нет, а ответ неверный:<\/b> напечатайте промежуточные значения (<code>print(a, b, q, x0, x1)<\/code> внутри цикла) и сравните с таблицей, посчитанной вручную. Это та же таблица трассировки, только её пишет программа.<\/p>"}, {"id": "w4l4s2", "t": "choice", "html": "<p>Что выведет программа?<\/p><pre><code>print(f\"{10:08b}|{255:02x}|{5:03}|{3.14159:.2f}\")<\/code><\/pre>", "opts": [["00001010|ff|005|3.14", true, "Верно."], ["1010|ff|5|3.14", false, "08b и 03 дополняют число нулями слева до 8 и 3 символов."], ["00001010|0xff|005|3.14", false, "Формат x не добавляет префикс 0x: он нужен в f\"0x{255:02x}\" явно."], ["00001010|ff|005|3.141", false, ".2f — два знака после точки."]]}, {"id": "w4l4s3", "t": "choice", "html": "<p>Программа упала с таким сообщением. Что исправить?<\/p><pre><code>Traceback (most recent call last):\n  File \"lab.py\", line 9, in &lt;module&gt;\n    print(affine_decrypt(\"f\", 2, 5))\n  File \"lab.py\", line 5, in affine_decrypt\n    return (y - b) * a_inv % 26\nTypeError: unsupported operand type(s) for *: 'int' and 'NoneType'<\/code><\/pre>", "opts": [["a_inv оказался None: обратного к 2 по модулю 26 нет, функция поиска вернула None — нужно проверить ключ до расшифрования", true, "Верно: последняя строка говорит, что один из множителей — None, а это a_inv."], ["Ошибка в строке 9: строку \"f\" нельзя передавать в функцию", false, "Строка 9 только вызвала функцию. Ошибка — в строке 5, и речь в ней о None."], ["Нужно заменить % 26 на // 26", false, "Сообщение про операцию *, а не про %."], ["Python не умеет умножать отрицательные числа", false, "Умеет. Проблема в том, что второй множитель — None."]]}, {"id": "w4l4s4", "t": "code", "html": "<p><b>Байт в трёх видах.<\/b> Напишите функцию <code>byte_info(b)<\/code> для 0 ≤ b ≤ 255. Она возвращает строку: десятичное число шириной 3 (выравнивание вправо), затем <code> | 0x<\/code> и две шестнадцатеричные цифры (строчные), затем <code> | <\/code> и 8 двоичных цифр.<\/p>\n<pre><code>byte_info(5)   → \"  5 | 0x05 | 00000101\"\nbyte_info(255) → \"255 | 0xff | 11111111\"<\/code><\/pre>\n<p>Пробелы здесь важны: строка должна совпасть посимвольно.<\/p>", "tpl": "def byte_info(b):\n    # ваш код\n    pass", "calls": [["byte_info(5)", "'  5 | 0x05 | 00000101'", ""], ["byte_info(1)", "'  1 | 0x01 | 00000001'", ""], ["byte_info(10)", "' 10 | 0x0a | 00001010'", ""], ["byte_info(16)", "' 16 | 0x10 | 00010000'", ""], ["byte_info(128)", "'128 | 0x80 | 10000000'", ""], ["byte_info(99)", "' 99 | 0x63 | 01100011'", ""], ["byte_info(177)", "'177 | 0xb1 | 10110001'", ""]], "limits": ""}, {"id": "w4l4s5", "t": "code", "html": "<p><b>Таблица трассировки Евклида.<\/b> Напишите функцию <code>euclid_table(a, b)<\/code> для a, b ≥ 1. Она <b>печатает<\/b> таблицу шагов алгоритма Евклида: заголовок и по строке на каждое деление, пока b ≠ 0. Каждый столбец — ширина 6, выравнивание вправо.<\/p>\n<pre><code>euclid_table(240, 46)\n     a     b     q     r\n   240    46     5    10\n    46    10     4     6\n    10     6     1     4\n     6     4     1     2\n     4     2     2     0<\/code><\/pre>\n<p>Пробелы важны: вывод должен совпасть посимвольно. Строку <code>---<\/code> в начале вывода печатает проверочный код в конце заготовки.<\/p>", "io": [["240 46", "---\n     a     b     q     r\n   240    46     5    10\n    46    10     4     6\n    10     6     1     4\n     6     4     1     2\n     4     2     2     0"], ["12 4", "---\n     a     b     q     r\n    12     4     3     0"], ["123456 7890", "---\n     a     b     q     r\n123456  7890    15  5106\n  7890  5106     1  2784\n  5106  2784     1  2322\n  2784  2322     1   462\n  2322   462     5    12\n   462    12    38     6\n    12     6     2     0"]], "tpl": "def euclid_table(a, b):\n    # ваш код: печать заголовка и строк\n    pass\n\n\n# --- проверочный код: не меняйте; запустите файл и введите строку из колонки «Ввод» ---\nprint(\"---\")\n_a, _b = map(int, input().split())\neuclid_table(_a, _b)", "limits": ""}, {"id": "w4l4s6", "t": "code", "html": "<p><b>Найди и исправь.<\/b> В шаблоне — функция поиска обратного элемента с <b>двумя<\/b> ошибками. Запустите <code>print(mod_inverse(3, 7))<\/code>, прочитайте traceback и исправьте первую ошибку. Затем сравните ответ с ручным расчётом (3⁻¹ mod 7 = 5) и найдите вторую: распечатайте значения переменных в цикле.<\/p>\n<p>Функция возвращает a⁻¹ mod n или <code>None<\/code>, если обратного нет. <code>pow(a, -1, n)<\/code> здесь запрещён.<\/p>", "tpl": "def egcd(a, b):\n    x0, y0, x1, y1 = 1, 0, 0, 1\n    while b != 0:\n        q = a // b\n        a, b = b, a % b\n        x0, x1 = x1, x0 - q * x0\n        y0, y1 = y1, y0 - q * y1\n    return a, x0, y0\n\n\ndef mod_inverse(a, n):\n    g, x = egcd(a, n)\n    if g != 1:\n        return None\n    return x % n", "calls": [["mod_inverse(3, 7)", "5", ""], ["mod_inverse(2, 26)", "None", ""], ["mod_inverse(4, 10)", "None", ""], ["mod_inverse(99, 100)", "99", ""], ["mod_inverse(7, 26)", "15", ""], ["mod_inverse(25, 26)", "25", ""], ["mod_inverse(4566, 4567)", "4566", ""]], "limits": "<div class=\"limits\"><b>Ограничения<\/b><ul><li>pow(a, -1, n) здесь запрещён: исправьте функцию из шаблона.<\/li><\/ul><\/div>"}]}, {"title": "ЛР-3 (этап A). Обратный элемент и GF(p)", "steps": [{"id": "w4l5s1", "t": "text", "html": "<h3>Лабораторная работа 3, этап A<\/h3>\n<p>Функции модульной арифметики. <code>pow(a, -1, n)<\/code> и библиотеки sympy/gmpy2 использовать нельзя. Вы можете копировать в решение свою функцию <code>egcd<\/code> из ЛР-2 — так и задумано: к концу семестра у вас соберётся собственный модуль теории чисел.<\/p>"}, {"id": "w4l5s2", "t": "code", "html": "<p><b>ЛР-3.1. Обратный элемент.<\/b> Напишите <code>mod_inverse(a, n)<\/code> (n ≥ 2, a — любое целое): верните x из диапазона 0..n−1 с a·x ≡ 1 (mod n). Если обратного нет, возбудите <code>ValueError<\/code>.<\/p>\n<p>Ваша <code>egcd<\/code> из ЛР-2 рассчитана на неотрицательные числа, поэтому сначала приведите a: <code>a = a % n<\/code>.<\/p>", "tpl": "def mod_inverse(a, n):\n    # ваш код; при НОД(a, n) != 1 — raise ValueError(...)\n    pass", "calls": [["mod_inverse(17, 43)", "38", ""], ["mod_inverse(2, 6)", "исключение ValueError", ""], ["mod_inverse(0, 5)", "исключение ValueError", ""], ["mod_inverse(100, 7)", "4", ""], ["mod_inverse(65537, 3120)", "2753", ""], ["mod_inverse(12, 18)", "исключение ValueError", ""], ["mod_inverse(515377520732011331036461129765621272702107522001, 170141183460469231731687303715884105727)", "8360359590161573618888174699982691392", ""]], "limits": "<div class=\"limits\"><b>Ограничения<\/b><ul><li>pow(a, -1, n) в этой задаче запрещён: найдите обратный через расширенный алгоритм Евклида.<\/li><li>Нельзя подключать модули: <code>sympy<\/code>, <code>gmpy2<\/code>, <code>numpy<\/code>, <code>Crypto<\/code>, <code>Cryptodome<\/code>.<\/li><\/ul><\/div>", "hints": ["Обратный существует, только если НОД(a, n) = 1. Из a·x + n·y = 1 следует a·x ≡ 1 (mod n) — значит, нужен ваш <code>egcd<\/code> из ЛР-2.", "Сначала <code>a % n<\/code> (a может быть отрицательным или больше n). Вызовите <code>egcd(a % n, n)<\/code> → (g, x, y). Если g ≠ 1 — <code>raise ValueError(...)<\/code>, иначе ответ <code>x % n<\/code>.", "<pre><code>def mod_inverse(a, n):\n    g, x, y = egcd(a % n, n)\n    if g != 1:\n        raise ValueError(&quot;обратного нет&quot;)\n    return ...<\/code><\/pre>"]}, {"id": "w4l5s3", "t": "code", "html": "<p><b>ЛР-3.2. Деление в GF(p).<\/b> Напишите <code>gf_div(a, b, p)<\/code> для простого p: верните a / b в поле GF(p) (число 0..p−1). Если b ≡ 0 (mod p), возбудите <code>ZeroDivisionError<\/code>.<\/p>", "tpl": "def gf_div(a, b, p):\n    # ваш код\n    pass", "calls": [["gf_div(4, 3, 7)", "6", ""], ["gf_div(1, 1, 2)", "1", ""], ["gf_div(5, 0, 11)", "исключение ZeroDivisionError", ""], ["gf_div(5, 11, 11)", "исключение ZeroDivisionError", ""], ["gf_div(-4, 3, 7)", "1", ""], ["gf_div(123, 456, 1009)", "684", ""], ["gf_div(1267650600228229401496703205376, 717897987691852588770249, 170141183460469231731687303715884105727)", "29771692416324790159957751126224704839", ""]], "limits": "<div class=\"limits\"><b>Ограничения<\/b><ul><li>pow(a, -1, n) в этой задаче запрещён: найдите обратный через расширенный алгоритм Евклида.<\/li><li>Нельзя подключать модули: <code>sympy<\/code>, <code>gmpy2<\/code>, <code>numpy<\/code>, <code>Crypto<\/code>, <code>Cryptodome<\/code>.<\/li><\/ul><\/div>", "hints": ["Деление в поле: a / b = a · b<sup>−1<\/sup> mod p.", "Если <code>b % p == 0<\/code> — <code>raise ZeroDivisionError<\/code>. Иначе <code>a * mod_inverse(b, p) % p<\/code>: остаток по модулю p сам приведёт отрицательное a в диапазон 0…p−1.", "<pre><code>def gf_div(a, b, p):\n    if b % p == 0:\n        raise ZeroDivisionError(&quot;деление на ноль&quot;)\n    return ...<\/code><\/pre>"]}, {"id": "w4l5s4", "t": "code", "html": "<p><b>ЛР-3.3. Аффинный шифр.<\/b> Напишите <code>affine_encrypt(text, a, b)<\/code> и <code>affine_decrypt(text, a, b)<\/code>. Шифруются только строчные латинские буквы, остальные символы не меняются. Если НОД(a, 26) ≠ 1, обе функции возбуждают <code>ValueError<\/code>.<\/p>\n<p>Проверьте себя: <code>affine_decrypt(affine_encrypt(t, a, b), a, b)<\/code> должно вернуть исходный текст t.<\/p>", "tpl": "def affine_encrypt(text, a, b):\n    pass\n\n\ndef affine_decrypt(text, a, b):\n    pass", "calls": [["affine_encrypt('hello world', 5, 8)", "'rclla oaplx'", ""], ["affine_encrypt('abc xyz', 1, 3)", "'def abc'", ""], ["affine_encrypt('abc', 13, 2)", "исключение ValueError", ""], ["affine_encrypt('the quick brown fox, 2026!', 25, 25)", "'gsv jfrxp yildm ulc, 2026!'", ""], ["affine_decrypt('gsv jfrxp yildm ulc, 2026!', 25, 25)", "'the quick brown fox, 2026!'", ""], ["affine_decrypt('ttt aaa', 7, 0)", "'zzz aaa'", ""], ["affine_decrypt('KEY vgfjv rooxk', 11, 5)", "'KEY stays upper'", ""]], "limits": "<div class=\"limits\"><b>Ограничения<\/b><ul><li>pow(a, -1, n) в этой задаче запрещён: найдите обратный через расширенный алгоритм Евклида.<\/li><li>Нельзя подключать модули: <code>sympy<\/code>, <code>gmpy2<\/code>, <code>numpy<\/code>, <code>Crypto<\/code>, <code>Cryptodome<\/code>.<\/li><\/ul><\/div>", "hints": ["Буква → номер: <code>ord(ch) - ord('a')<\/code>; номер → буква: <code>chr(x + ord('a'))<\/code>. Шифруются только <code>'a' &lt;= ch &lt;= 'z'<\/code>, остальные символы добавляйте как есть.", "Сначала проверьте НОД(a, 26) = 1, иначе <code>ValueError<\/code>. Шифрование: (a·x + b) mod 26. Расшифрование: a<sup>−1<\/sup>·(y − b) mod 26, где a<sup>−1<\/sup> = <code>mod_inverse(a, 26)<\/code>.", "<pre><code>def affine_encrypt(text, a, b):\n    if gcd(a, 26) != 1:\n        raise ValueError(&quot;плохой ключ&quot;)\n    out = []\n    for ch in text:\n        if &#x27;a&#x27; &lt;= ch &lt;= &#x27;z&#x27;:\n            x = ord(ch) - ord(&#x27;a&#x27;)\n            out.append(chr(...))\n        else:\n            out.append(ch)\n    return &quot;&quot;.join(out)<\/code><\/pre>"]}]}]}, {"n": 5, "title": "Неделя 5. Простые числа, φ(n), Ферма–Эйлер, быстрая степень", "lessons": [{"title": "Простые числа, φ(n), теоремы Ферма и Эйлера", "steps": [{"id": "w5l1s1", "t": "text", "html": "<h3>Простые числа и решето<\/h3>\n<p>Простое число делится только на 1 и на себя. Все остальные числа больше 1 — составные: их можно разложить на простые множители, как дом на кирпичи (60 = 2·2·3·5).<\/p><p style=\"text-align:center;\"><img alt=\"Решето Эратосфена до 100: составные вычеркнуты числами 2, 3, 5, 7\" src=\"/media/attachments/lesson/2612715/w05_sieve.png\" style=\"height:auto;\"><\/p>\n<p><b>Решето:<\/b> выписываем числа, берём первое невычеркнутое (2) и вычёркиваем все его кратные. Берём следующее невычеркнутое (3) и так далее.<\/p>\n<ul>\n<li>Вычёркивать можно начиная с p²: меньшие кратные p уже вычеркнули меньшие простые (например, 15 = 3·5 вычеркнуто тройкой).<\/li>\n<li>Останавливаемся на √N: у составного n ≤ N есть множитель ≤ √n. Для N = 100 хватает 2, 3, 5, 7.<\/li>\n<\/ul>\n<p>Простых много: среди чисел около N примерно каждое ln N-е — простое. Поэтому 1024-битное простое для RSA находят быстро: перебирают случайные нечётные числа и проверяют их быстрым тестом.<\/p>"}, {"id": "w5l1s2", "t": "widget", "kind": "powmod", "html": ""}, {"id": "w5l1s3", "t": "text", "html": "<h3>φ(n) на картинке<\/h3><p style=\"text-align:center;\"><img alt=\"Числа от 1 до n, взаимно простые с n, для n = 12, 7, 15\" src=\"/media/attachments/lesson/2612715/w05_phi_rows.png\" style=\"height:auto;\"><\/p>\n<ul>\n<li><b>p простое:<\/b> с p не взаимно просто только само p, поэтому φ(p) = p − 1.<\/li>\n<li><b>n = p·q:<\/b> из чисел 1…pq убираем кратные p (их q штук) и кратные q (их p штук). Число pq убрали дважды, возвращаем: φ(pq) = pq − q − p + 1 = (p − 1)(q − 1). Для 15: (3 − 1)(5 − 1) = 8.<\/li>\n<li><b>n = p^k:<\/b> не взаимно просты с n только кратные p, их p^(k−1) штук: φ(p^k) = p^k − p^(k−1). Для 9: 9 − 3 = 6.<\/li>\n<\/ul>\n<p>Знать φ(n) легко, если известно разложение n. Не зная p и q, по n = p·q найти φ(n) так же трудно, как разложить n. На этом стоит RSA (неделя 12).<\/p>"}, {"id": "w5l1s4", "t": "text", "html": "<h3>Теорема Ферма: степени ходят по кругу<\/h3><p style=\"text-align:center;\"><img alt=\"Таблица a в степени k по модулю 7: столбец a в шестой — одни единицы\" src=\"/media/attachments/lesson/2612715/w05_fermat_table.png\" style=\"height:auto;\"><\/p>\n<p>Если p простое и a не делится на p, то <b>a^(p−1) ≡ 1 (mod p)<\/b>. На таблице это столбец a⁶ из одних единиц. Дальше всё повторяется: a⁷ = a⁶·a ≡ a, a⁸ ≡ a² и так далее.<\/p>\n<p><b>Почему это верно.<\/b> Умножим все числа 1, 2, …, p−1 на a по модулю p. Для p = 7, a = 3 получится 3, 6, 2, 5, 1, 4: те же числа в другом порядке. Так будет всегда: если a·x ≡ a·y, умножим обе части на a⁻¹ (он есть, неделя 4) и получим x ≡ y. Значит, произведения двух наборов равны: a^(p−1)·(1·2·…·(p−1)) ≡ 1·2·…·(p−1) (mod p). Число 1·2·…·(p−1) обратимо, на него можно сократить: <b>a^(p−1) ≡ 1<\/b>.<\/p>\n<p><b>Как этим пользоваться.<\/b> Чтобы найти 3¹⁰⁰ mod 7, выбросим из показателя все полные круги по 6: 100 = 16·6 + 4, значит 3¹⁰⁰ ≡ 3⁴ = 81 ≡ 4 (mod 7).<\/p>\n<p><b>Теорема Эйлера<\/b> — то же для любого n: если НОД(a, n) = 1, то a^φ(n) ≡ 1 (mod n), и показатель сокращают по модулю φ(n). Пример: 7²²² mod 10, φ(10) = 4, 222 mod 4 = 2, 7² = 49 ≡ 9.<\/p>\n<p>Именно поэтому в RSA расшифрование возвращает исходное сообщение: (m^e)^d = m^(e·d), а e·d ≡ 1 по модулю φ(n) (для m, взаимно простых с n; остальные m разберём на неделе 12 через КТО).<\/p>"}, {"id": "w5l1s5", "t": "text", "html": "<h3>Быстрое возведение в степень<\/h3><p style=\"text-align:center;\"><img alt=\"5 в степени 13 по модулю 23 по битам показателя 1101\" src=\"/media/attachments/lesson/2612715/w05_square_multiply.png\" style=\"height:auto;\"><\/p>\n<p>Каждый новый бит показателя удваивает уже набранную степень (квадрат), а единичный бит добавляет ещё одно a. После битов 1, 11, 110, 1101 в r лежат 5¹, 5³, 5⁶, 5¹³ — показатель растёт так же, как число при чтении двоичной записи слева направо.<\/p>\n<table style=\"text-align:right;\">\n<tbody><tr style=\"background:#EEF2F6;\"><th style=\"padding:4px 10px;\">Показатель e<\/th><th style=\"padding:4px 10px;\">Наивно: умножений<\/th><th style=\"padding:4px 10px;\">Square-and-multiply<\/th><\/tr>\n<tr><td style=\"padding:4px 10px;\">13 (4 бита)<\/td><td style=\"padding:4px 10px;\">12<\/td><td style=\"padding:4px 10px;\">5<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">1 000 000 (20 бит)<\/td><td style=\"padding:4px 10px;\">999 999<\/td><td style=\"padding:4px 10px;\">25<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">256-битный<\/td><td style=\"padding:4px 10px;\">≈ 10⁷⁷<\/td><td style=\"padding:4px 10px;\">не больше 510<\/td><\/tr>\n<tr><td style=\"padding:4px 10px;\">2048-битный<\/td><td style=\"padding:4px 10px;\">≈ 10⁶¹⁶<\/td><td style=\"padding:4px 10px;\">не больше 4 094<\/td><\/tr>\n<\/tbody><\/table>\n<p>После каждого умножения берём остаток по n, поэтому числа не растут больше n². Без этого 5^(2²⁰⁴⁸) не поместилось бы ни в какую память.<\/p>"}, {"id": "w5l1s6", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Чему равно φ(21)?<\/p>", "opts": [["12", true, "Верно: 21 = 3·7, φ = (3 − 1)(7 − 1) = 12."], ["20", false, "21 − 1 = 20 было бы для простого числа, а 21 = 3·7."], ["14", false, "Уберите кратные 3 (их 7) и кратные 7 (их 3), число 21 верните один раз: 21 − 7 − 3 + 1 = 12."], ["10", false, "Проверьте формулу (p − 1)(q − 1) для p = 3, q = 7."]]}, {"id": "w5l1s7", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Чему равно 2¹⁰⁰ mod 11?<\/p>", "opts": [["1", true, "Верно: по Ферма 2¹⁰ ≡ 1 (mod 11), а 100 = 10·10, поэтому 2¹⁰⁰ ≡ 1."], ["2", false, "Показатель сокращают по модулю p − 1 = 10, а не по модулю 11: 100 mod 10 = 0."], ["10", false, "100 mod 10 = 0, значит остаётся 2⁰ = 1."], ["0", false, "2 и 11 взаимно просты: никакая степень двойки не делится на 11."]]}, {"id": "w5l1s8", "t": "choice", "html": "<p><b>Проверь себя.<\/b> Сколько бит у показателя e = 1 000 000 (сколько раз нужно возвести в квадрат, если не считать самый старший бит)?<\/p>", "opts": [["20 бит, 19 возведений в квадрат", true, "Верно: 2¹⁹ ≤ 10⁶ &lt; 2²⁰. Плюс по одному умножению на каждую единицу, кроме старшей."], ["1 000 000 бит", false, "Битов столько, сколько двоичных цифр, а не сколько единиц в числе: log₂(10⁶) ≈ 20."], ["6 бит, по числу десятичных цифр", false, "Двоичных цифр примерно в 3,3 раза больше, чем десятичных."], ["64 бита", false, "64 бита — у чисел до 2⁶⁴ ≈ 1,8·10¹⁹. Миллиону хватает 20."]]}, {"id": "w5l1s9", "t": "text", "html": "<h3>Частые ошибки<\/h3>\n<ul>\n<li><b>Сокращают показатель по модулю p, а не p − 1.<\/b> По Ферма период степеней — p − 1, по Эйлеру — φ(n).<\/li>\n<li><b>Применяют Ферма, когда p делит a.<\/b> Тогда a^k ≡ 0 для любого k ≥ 1, и единицы не будет.<\/li>\n<li><b>Забывают брать остаток после каждого умножения.<\/b> Ответ верный, но на больших числах программа «зависает».<\/li>\n<li><b>Идут по битам не в ту сторону.<\/b> В нашем методе — слева направо, со старшего бита. Есть и вариант справа налево, но в нём квадрат берут от a, а не от r.<\/li>\n<li><b>Считают 1 простым.<\/b> У 1 только один делитель. <code>is_prime(1)<\/code> должно вернуть False.<\/li>\n<\/ul>\n<p>Ниже — краткий конспект темы.<\/p>"}, {"id": "w5l1s10", "t": "text", "html": "<h3>Простые числа<\/h3>\n<p>Простое число имеет ровно два делителя: 1 и себя. 1 — не простое. <b>Основная теорема арифметики:<\/b> каждое n &gt; 1 единственным образом раскладывается на простые множители.<\/p>\n<p><b>Пробное деление:<\/b> если n составное, у него есть делитель d ≤ √n. Проверка до √n стоит O(√n) делений — для 2048-битного n это около 2<sup>1024<\/sup> операций. Поэтому для больших чисел используют быстрые вероятностные тесты (Миллера–Рабина). Важно различать две задачи: <b>проверить<\/b>, простое ли число, — легко, а <b>разложить<\/b> составное число на множители — трудно. На трудности разложения держится RSA (нед. 12).<\/p>\n<p><b>Решето Эратосфена<\/b> находит все простые до N: вычёркиваем кратные 2, 3, 5, … начиная с квадрата.<\/p><figure class=\"dg\"><div class=\"dg-scroll\"><svg viewBox=\"0 0 460 246\" width=\"460
